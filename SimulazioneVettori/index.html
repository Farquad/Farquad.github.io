<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0K7SE4960W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0K7SE4960W');

    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulazione Vettori</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            overflow: hidden;
        }
        #canvas-container { flex: 1; position: relative; background-color: #030407; min-width: 0; min-height: 0; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #control-panel {
            width: 380px;
            background-color: #2a2a2a;
            color: #fff;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid #444;
            z-index: 10;
            scrollbar-color: #555 #2a2a2a;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            text-align: center;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .env-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
        }
        .env-control label {
            font-weight: 600;
            color: #ddd;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .env-control input[type="range"] { flex: 1; cursor: pointer; }
        .vector-control {
            border: 1px solid #444;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #333;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .vector-control h3 { margin: 0; display: flex; flex-direction: column; font-size: 1.1rem; cursor: pointer; user-select: none; }
        .vector-control h3:hover { opacity: 0.8; }
        .vector-header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .vector-header-bottom { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 5px; padding-left: 20px; box-sizing: border-box; }
        .vector-controls-container { display: none; margin-top: 15px; }
        .vector-control.expanded .vector-controls-container { display: block; }
        .expand-icon { font-size: 0.8rem; margin-right: 8px; display: inline-block; transition: transform 0.2s; }
        .vector-control.expanded .expand-icon { transform: rotate(90deg); }
        .coords-readout { font-family: monospace; font-size: 0.95rem; color: #ccc; }
        .coord-input { display: flex; align-items: center; margin-bottom: 8px; }
        .coord-input label { width: 25px; font-weight: bold; color: #ccc; }
        .coord-input input[type="range"] { flex: 1; margin: 0 10px; cursor: pointer; }
        .coord-input input[type="number"] {
            width: 60px;
            text-align: right;
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 3px;
            font-family: monospace;
            cursor: text;
        }
        .operations { margin-bottom: 4px; }
        .operations h3 { margin: 0 0 12px; font-size: 1.05rem; color: #fff; }
        .op-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 12px;
            padding: 12px 15px;
            background: #333;
            border: 1px solid #444;
            border-left-width: 5px;
            border-left-style: solid;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .op-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        #panel-sum { border-left-color: #3333ff; }
        #panel-diff { border-left-color: #ff8800; }
        #panel-cross { border-left-color: #cc33cc; }
        .op-row label { display: flex; align-items: center; cursor: pointer; font-size: 1.05rem; }
        .op-main input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
        .op-row label.build-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0 0;
            padding-top: 8px;
            border-top: 1px solid #444;
            font-size: 0.82rem;
            font-weight: 500;
            color: #c8c8c8;
            cursor: pointer;
        }
        .build-toggle input[type="checkbox"] { margin: 0; cursor: pointer; }

        input[type="range"] {
            cursor: pointer;
            accent-color: #b0b0b0;
        }
        input[type="range"]:disabled {
            accent-color: #666;
            cursor: not-allowed;
        }
        #panel-u { --accent: #cc0000; }
        #panel-v { --accent: #009900; }
        #panel-u input[type="range"],
        #panel-v input[type="range"] {
            accent-color: var(--accent);
        }

        .radio-switch {
            display: flex;
            position: relative;
            width: 100%;
            background-color: #222;
            border: 1px solid #555;
            border-radius: 6px;
            overflow: hidden;
        }
        .radio-switch input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .radio-switch label {
            flex: 1;
            margin: 0;
            padding: 8px 6px;
            text-align: center;
            font-size: 0.95rem;
            cursor: pointer;
            color: #d0d0d0;
            background: transparent;
            border: none;
            border-radius: 0;
            opacity: 0.9;
            transition: background-color 0.15s, color 0.15s, opacity 0.15s;
            user-select: none;
        }
        .radio-switch label:hover {
            color: #fff;
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .radio-switch input[type="radio"]:checked + label {
            background-color: #888;
            color: #fff;
            font-weight: 600;
            opacity: 1;
        }
        .radio-switch label + input[type="radio"] + label {
            border-left: 1px solid #555;
        }
        .view-switch { margin: 0 0 15px; }

        body.is-2d #panel-u-z,
        body.is-2d #panel-v-z { display: none; }
        .op-mag { font-family: monospace; background: #222; color: #ddd; padding: 2px 6px; border-radius: 4px; font-size: 0.95rem; }
        .result-box { margin-top: 8px; padding: 15px; background: #1a3040; border: 1px solid #2a6a80; border-radius: 6px; font-size: 1.05rem; color: #9fd4ea; display: flex; justify-content: space-between; align-items: center; }
        .result-val { font-family: monospace; font-weight: bold; font-size: 1.2rem; background: #111; color: #fff; padding: 3px 8px; border-radius: 4px; border: 1px solid #2a6a80; }
        
        /* Custom styles for colors */
        .color-u { color: #cc0000; }
        .color-v { color: #009900; }
        .color-sum { color: #3333ff; }
        .color-diff { color: #ff8800; }
        .color-cross { color: #cc33cc; }

        @media (max-width: 820px) {
            body { flex-direction: column; }
            #canvas-container { order: 1; width: 100%; min-height: 140px; }
            #control-panel {
                order: 2;
                width: 100%;
                flex: 0 1 auto;
                max-height: 42vh;
                min-height: 0;
                border-left: none;
                border-top: 1px solid #444;
            }
        }

        @media (max-width: 820px) and (orientation: landscape) {
            body { flex-direction: row; }
            #canvas-container { order: 1; flex: 1 1 0; width: auto; min-width: 0; }
            #control-panel {
                order: 2;
                flex: 0 0 min(340px, 42vw);
                width: min(340px, 42vw);
                max-height: none;
                height: 100%;
                border-left: 1px solid #444;
                border-top: none;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="overlay-canvas"></canvas>
    </div>
    <div id="control-panel">
        <div class="view-switch radio-switch" role="radiogroup" aria-label="Vista 2D o 3D">
            <input type="radio" name="view-mode" id="mode-2d" value="2d">
            <label for="mode-2d">2D</label>
            <input type="radio" name="view-mode" id="mode-3d" value="3d" checked>
            <label for="mode-3d">3D</label>
        </div>

        <div class="env-control">
            <label for="hdri-brightness">Luminosità ambiente</label>
            <input type="range" id="hdri-brightness" min="0" max="2" step="0.05" value="1">
        </div>

        <div class="vector-control" id="panel-u" style="border-left: 5px solid #cc0000;">
            <h3 class="color-u" onclick="this.parentElement.classList.toggle('expanded')">
                <div class="vector-header-top">
                    <span style="display: flex; align-items: center;">
                        <span class="expand-icon">▶</span>
                        <span style="display: flex; align-items: center;" onclick="event.stopPropagation()">
                            <input type="checkbox" id="show-u" checked style="margin-right: 8px;"> 
                            <label for="show-u" style="cursor: pointer; margin-right: 5px;">Vettore <b>u</b></label>
                        </span>
                    </span>
                </div>
                <div class="vector-header-bottom">
                    <span id="coords-u" class="coords-readout">u=(0; 0; 0)</span>
                    <span id="mag-u" class="op-mag">|u| = 0.00</span>
                </div>
            </h3>
            <div class="vector-controls-container">
                <div class="coord-input" id="panel-u-x"><label>X:</label><input type="range" id="u-x" min="-10" max="10" step="0.1" value="4"><input type="number" id="num-u-x" min="-10" max="10" step="0.1" value="4"></div>
                <div class="coord-input" id="panel-u-y"><label>Y:</label><input type="range" id="u-y" min="-10" max="10" step="0.1" value="2"><input type="number" id="num-u-y" min="-10" max="10" step="0.1" value="2"></div>
                <div class="coord-input" id="panel-u-z"><label>Z:</label><input type="range" id="u-z" min="-10" max="10" step="0.1" value="3"><input type="number" id="num-u-z" min="-10" max="10" step="0.1" value="3"></div>
            </div>
        </div>

        <div class="vector-control" id="panel-v" style="border-left: 5px solid #009900;">
            <h3 class="color-v" onclick="this.parentElement.classList.toggle('expanded')">
                <div class="vector-header-top">
                    <span style="display: flex; align-items: center;">
                        <span class="expand-icon">▶</span>
                        <span style="display: flex; align-items: center;" onclick="event.stopPropagation()">
                            <input type="checkbox" id="show-v" checked style="margin-right: 8px;"> 
                            <label for="show-v" style="cursor: pointer; margin-right: 5px;">Vettore <b>v</b></label>
                        </span>
                    </span>
                </div>
                <div class="vector-header-bottom">
                    <span id="coords-v" class="coords-readout">v=(0; 0; 0)</span>
                    <span id="mag-v" class="op-mag">|v| = 0.00</span>
                </div>
            </h3>
            <div class="vector-controls-container">
                <div class="coord-input" id="panel-v-x"><label>X:</label><input type="range" id="v-x" min="-10" max="10" step="0.1" value="-2"><input type="number" id="num-v-x" min="-10" max="10" step="0.1" value="-2"></div>
                <div class="coord-input" id="panel-v-y"><label>Y:</label><input type="range" id="v-y" min="-10" max="10" step="0.1" value="4"><input type="number" id="num-v-y" min="-10" max="10" step="0.1" value="4"></div>
                <div class="coord-input" id="panel-v-z"><label>Z:</label><input type="range" id="v-z" min="-10" max="10" step="0.1" value="-1"><input type="number" id="num-v-z" min="-10" max="10" step="0.1" value="-1"></div>
            </div>
        </div>

        <div class="operations">
            <h3>Operazioni Vettoriali</h3>
            <div class="op-row" id="panel-sum">
                <div class="op-main">
                    <label class="color-sum"><input type="checkbox" id="show-sum"> <b>u + v</b></label>
                    <span id="mag-sum" class="op-mag">|u+v| = 0.00</span>
                </div>
                <label class="build-toggle"><input type="checkbox" id="show-sum-build"> Visualizza costruzione</label>
            </div>
            <div class="op-row" id="panel-diff">
                <div class="op-main">
                    <label class="color-diff"><input type="checkbox" id="show-diff"> <b>u - v</b></label>
                    <span id="mag-diff" class="op-mag">|u-v| = 0.00</span>
                </div>
                <label class="build-toggle"><input type="checkbox" id="show-diff-build"> Visualizza costruzione</label>
            </div>
            <div class="op-row" id="panel-cross">
                <div class="op-main">
                    <label class="color-cross"><input type="checkbox" id="show-cross"> <b>u × v</b></label>
                    <span id="mag-cross" class="op-mag">|u×v| = 0.00</span>
                </div>
                <label class="build-toggle"><input type="checkbox" id="show-cross-build"> Visualizza costruzione</label>
            </div>
        </div>

        <div class="result-box">
            <span>Prodotto scalare <b>u · v</b></span>
            <span id="dot-product" class="result-val">0.00</span>
        </div>
    </div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Dark equirectangular sky: deep navy above, a faint cool horizon, warm charcoal below.
        function createDarkSkyTexture() {
            const w = 1024;
            const h = 512;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');

            const sky = ctx.createLinearGradient(0, 0, 0, h);
            sky.addColorStop(0.00, '#070b16');
            sky.addColorStop(0.28, '#10182c');
            sky.addColorStop(0.46, '#1a2740');
            sky.addColorStop(0.50, '#2c3a52');
            sky.addColorStop(0.56, '#1a1824');
            sky.addColorStop(0.72, '#121016');
            sky.addColorStop(1.00, '#08060c');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, w, h);

            const glows = [
                { x: 0.18, y: 0.42, color: '80, 120, 170', alpha: 0.22, radius: 0.28 },
                { x: 0.62, y: 0.40, color: '150, 110, 80', alpha: 0.10, radius: 0.22 },
                { x: 0.84, y: 0.47, color: '70, 100, 150', alpha: 0.16, radius: 0.20 }
            ];
            glows.forEach((glow) => {
                const cx = glow.x * w;
                const cy = glow.y * h;
                const radius = glow.radius * w;
                const grd = ctx.createRadialGradient(cx, cy, radius * 0.08, cx, cy, radius);
                grd.addColorStop(0, `rgba(${glow.color}, ${glow.alpha})`);
                grd.addColorStop(1, `rgba(${glow.color}, 0)`);
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, w, h);
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // 1. Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const skyTexture = createDarkSkyTexture();
        const flatBackground = new THREE.Color(0x030407);
        scene.background = skyTexture;
        scene.backgroundBlurriness = 0.25;
        scene.backgroundIntensity = 1;

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 12, 18);
        camera.lookAt(0, 0, 0);

        const orthoCamera = new THREE.OrthographicCamera(-16, 16, 16, -16, 0.1, 200);
        orthoCamera.position.set(0, 0, 40);
        orthoCamera.lookAt(0, 0, 0);

        let viewMode = '3d';
        let viewCamera = camera;
        const savedView = {
            position: new THREE.Vector3(15, 12, 18),
            target: new THREE.Vector3(0, 0, 0)
        };
        const savedZ = { u: 3, v: -1 };

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        const perspectiveZoom = { min: 0.35, max: 8 };
        const planarZoom = { min: 0.05, max: 80 };
        controls.minZoom = perspectiveZoom.min;
        controls.maxZoom = perspectiveZoom.max;

        // 2. Grid (Axes are now drawn in 2D overlay)
        // Adjust grid colors to be slightly more visible against the HDRI background
        const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
        gridHelper.position.y = -0.01;
        gridHelper.material.toneMapped = false;
        scene.add(gridHelper);

        const planarGridGeom = new THREE.BufferGeometry();
        const planarGrid = new THREE.LineSegments(
            planarGridGeom,
            new THREE.LineBasicMaterial({
                color: 0xa0a8b4,
                transparent: true,
                opacity: 0.18,
                toneMapped: false
            })
        );
        planarGrid.frustumCulled = false;
        planarGrid.position.z = -1.2;
        planarGrid.visible = false;
        scene.add(planarGrid);

        const planarFrame = { x0: -16, x1: 16, y0: -16, y1: 16 };
        let planarGridKey = '';

        function updatePlanarGrid(x0, x1, y0, y1) {
            const span = Math.max(x1 - x0, y1 - y0);
            let step = 1;
            if (span > 50) step = 2;
            if (span > 100) step = 5;
            if (span > 200) step = 10;
            const key = [x0, x1, y0, y1, step].map((n) => n.toFixed(2)).join('|');
            if (key === planarGridKey) return;
            planarGridKey = key;

            const pad = step;
            const gx0 = x0 - pad;
            const gx1 = x1 + pad;
            const gy0 = y0 - pad;
            const gy1 = y1 + pad;
            const xStart = Math.floor(gx0 / step) * step;
            const yStart = Math.floor(gy0 / step) * step;
            const verts = [];
            for (let x = xStart; x <= gx1 + step * 0.01; x += step) {
                if (Math.abs(x) < step * 0.05) continue;
                verts.push(x, gy0, 0, x, gy1, 0);
            }
            for (let y = yStart; y <= gy1 + step * 0.01; y += step) {
                if (Math.abs(y) < step * 0.05) continue;
                verts.push(gx0, y, 0, gx1, y, 0);
            }
            planarGridGeom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        }

        // 3. Vectors (Math only, rendering is done in 2D overlay)
        const origin = new THREE.Vector3(0, 0, 0);

        const vecU = new THREE.Vector3();
        const vecV = new THREE.Vector3();
        const vecSum = new THREE.Vector3();
        const vecDiff = new THREE.Vector3();
        const vecCross = new THREE.Vector3();

        // 3.5 3D Arrows
        function create3DArrow(colorHex, thickness = 0.085, headLength = 0.82, headRadius = 0.26) {
            const group = new THREE.Group();
            const material = new THREE.MeshBasicMaterial({ color: colorHex, toneMapped: false });
            
            const cylGeom = new THREE.CylinderGeometry(thickness, thickness, 1, 16);
            cylGeom.translate(0, 0.5, 0);
            const cylinder = new THREE.Mesh(cylGeom, material);
            group.add(cylinder);
            
            const coneGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            coneGeom.translate(0, headLength / 2, 0);
            const cone = new THREE.Mesh(coneGeom, material);
            group.add(cone);
            
            return { group, cylinder, cone, headLength, material };
        }

        const arrows3D = {
            x: create3DArrow(0xdddddd, 0.05, 0.7, 0.16),
            y: create3DArrow(0xdddddd, 0.05, 0.7, 0.16),
            z: create3DArrow(0xdddddd, 0.05, 0.7, 0.16),
            u: create3DArrow(0xcc0000),
            v: create3DArrow(0x009900),
            sum: create3DArrow(0x3333ff),
            diff: create3DArrow(0xff8800),
            cross: create3DArrow(0xcc33cc),
            sumBuild: create3DArrow(0x009900),
            diffBuild: create3DArrow(0x009900),
            crossBuildU: create3DArrow(0xcc0000),
            crossBuildV: create3DArrow(0x009900)
        };

        Object.values(arrows3D).forEach((arrow) => {
            arrow.group.renderOrder = 3;
            arrow.group.traverse((obj) => obj.layers.set(2));
        });
        ['sumBuild', 'diffBuild', 'crossBuildU', 'crossBuildV'].forEach((name) => {
            const material = arrows3D[name].material;
            material.polygonOffset = true;
            material.polygonOffsetFactor = -2;
            material.polygonOffsetUnits = -2;
        });

        Object.values(arrows3D).forEach(arrow => scene.add(arrow.group));

        function updateArrow(arrowObj, vEnd, visible, alpha = 1, thicknessScale = 1, vStart = null, headWorld = null) {
            const delta = vStart ? vEnd.clone().sub(vStart) : vEnd;
            if (!visible || delta.lengthSq() < 0.000001) {
                arrowObj.group.visible = false;
                return;
            }
            arrowObj.group.visible = true;
            if (vStart) arrowObj.group.position.copy(vStart);
            else arrowObj.group.position.set(0, 0, 0);
            
            const length = delta.length();
            const dir = delta.clone().normalize();
            
            const headCap = headWorld == null ? arrowObj.headLength : headWorld;
            const headLen = Math.min(headCap, length * 0.48);
            const shaftLen = Math.max(0, length - headLen);
            
            arrowObj.cylinder.scale.set(thicknessScale, shaftLen, thicknessScale);
            arrowObj.cone.position.set(0, shaftLen, 0);
            arrowObj.cone.scale.set(thicknessScale, headLen / arrowObj.headLength, thicknessScale);

            const transparent = alpha < 0.999;
            if (arrowObj.material.opacity !== alpha || arrowObj.material.transparent !== transparent) {
                arrowObj.material.opacity = alpha;
                arrowObj.material.transparent = transparent;
                arrowObj.material.depthWrite = !transparent;
                arrowObj.material.needsUpdate = true;
            }
            
            // To prevent errors when direction is exactly down
            const axis = new THREE.Vector3(0, 1, 0);
            arrowObj.group.quaternion.setFromUnitVectors(axis, dir);
        }

        // 3.6 Hand Emoji for Cross Product
        const emojiCanvas = document.createElement('canvas');
        emojiCanvas.width = 512;
        emojiCanvas.height = 512;
        const emojiCtx = emojiCanvas.getContext('2d');
        emojiCtx.font = '360px sans-serif';
        emojiCtx.textAlign = 'center';
        emojiCtx.textBaseline = 'middle';
        emojiCtx.fillText('✋', 256, 280);
        const handTexture = new THREE.CanvasTexture(emojiCanvas);
        handTexture.minFilter = THREE.LinearFilter;
        handTexture.magFilter = THREE.LinearFilter;
        handTexture.generateMipmaps = false;
        handTexture.wrapS = THREE.RepeatWrapping;
        
        const handMaterial = new THREE.MeshBasicMaterial({ 
            map: handTexture, 
            transparent: true,
            opacity: 0.5,
            side: THREE.FrontSide, 
            depthTest: false,
            depthWrite: false,
            toneMapped: false
        });
        const handPlaneSize = 3.5;
        const handGeometry = new THREE.PlaneGeometry(handPlaneSize, handPlaneSize);
        // Translate slightly downwards so the "center of the palm" of the emoji
        // is at the origin (0,0,0) rather than the center of the square canvas
        handGeometry.translate(0, 0.4, 0); 
        const handMesh = new THREE.Mesh(handGeometry, handMaterial);
        handMesh.renderOrder = 2;
        handMesh.layers.set(1);
        handMesh.visible = false;
        scene.add(handMesh);
        const handNdc = new THREE.Vector3();
        const handWorldA = new THREE.Vector3();
        const handWorldB = new THREE.Vector3();
        const handToCam = new THREE.Vector3();
        const handX = new THREE.Vector3();
        const handY = new THREE.Vector3();
        const handZ = new THREE.Vector3();

        // Face-on size in CSS pixels: a fixed fraction of the viewport, so the
        // hand stays recognizable without covering the canvas when vectors grow or the camera zooms.
        function handScreenScale() {
            const height = Math.max(container.clientHeight, 1);
            const shortSide = Math.min(container.clientWidth, height);
            const targetPx = THREE.MathUtils.clamp(0.28 * shortSide, 160, 280);
            viewCamera.updateMatrixWorld();
            handNdc.set(0, 0, 0).project(viewCamera);
            if (handNdc.z < -1 || handNdc.z > 1) return 1;
            const dy = (targetPx / height) * 2;
            handWorldA.set(handNdc.x, handNdc.y, handNdc.z).unproject(viewCamera);
            handWorldB.set(handNdc.x, handNdc.y + dy, handNdc.z).unproject(viewCamera);
            const worldSize = handWorldA.distanceTo(handWorldB);
            if (!(worldSize > 1e-6)) return 1;
            return worldSize / handPlaneSize;
        }

        const paraPositions = new Float32Array(18);
        const paraGeom = new THREE.BufferGeometry();
        paraGeom.setAttribute('position', new THREE.BufferAttribute(paraPositions, 3));
        const paraMat = new THREE.MeshBasicMaterial({
            color: 0xcc33cc,
            transparent: true,
            opacity: 0.5,
            side: THREE.FrontSide,
            depthTest: true,
            depthWrite: false,
            toneMapped: false
        });
        const paraMesh = new THREE.Mesh(paraGeom, paraMat);
        paraMesh.renderOrder = 1;
        paraMesh.visible = false;
        scene.add(paraMesh);

        // 4. UI Elements, Interaction State, and Event Listeners
        const inputs = {
            u: {
                x: { range: document.getElementById('u-x'), num: document.getElementById('num-u-x') },
                y: { range: document.getElementById('u-y'), num: document.getElementById('num-u-y') },
                z: { range: document.getElementById('u-z'), num: document.getElementById('num-u-z') }
            },
            v: {
                x: { range: document.getElementById('v-x'), num: document.getElementById('num-v-x') },
                y: { range: document.getElementById('v-y'), num: document.getElementById('num-v-y') },
                z: { range: document.getElementById('v-z'), num: document.getElementById('num-v-z') }
            }
        };

        const hdriBrightnessSlider = document.getElementById('hdri-brightness');
        function applyBrightness(value) {
            scene.backgroundIntensity = value;
            if (viewMode === '2d') {
                flatBackground.setRGB((3 / 255) * value, (4 / 255) * value, (7 / 255) * value);
            }
        }
        hdriBrightnessSlider.addEventListener('input', (e) => {
            applyBrightness(parseFloat(e.target.value));
        });

        const checks = {
            u: document.getElementById('show-u'),
            v: document.getElementById('show-v'),
            sum: document.getElementById('show-sum'),
            diff: document.getElementById('show-diff'),
            cross: document.getElementById('show-cross')
        };

        const constructionChecks = {
            sum: document.getElementById('show-sum-build'),
            diff: document.getElementById('show-diff-build'),
            cross: document.getElementById('show-cross-build')
        };

        const labels = {
            u: document.getElementById('mag-u'),
            v: document.getElementById('mag-v'),
            coordsU: document.getElementById('coords-u'),
            coordsV: document.getElementById('coords-v'),
            sum: document.getElementById('mag-sum'),
            diff: document.getElementById('mag-diff'),
            cross: document.getElementById('mag-cross'),
            dot: document.getElementById('dot-product')
        };

        const interactionState = {
            hoveredVector: null,
            hoveredAxis: null,
            draggingVector: null,
            draggingAxis: null,
            editingVector: null,
            editingAxis: null,
            editTimeout: null
        };

        let focusedVector = null;

        const focusPanels = {
            u: { id: 'panel-u', color: '#cc0000' },
            v: { id: 'panel-v', color: '#009900' },
            sum: { id: 'panel-sum', color: '#3333ff' },
            diff: { id: 'panel-diff', color: '#ff8800' },
            cross: { id: 'panel-cross', color: '#cc33cc' }
        };

        function activeConstructions() {
            return {
                sum: constructionChecks.sum.checked && checks.sum.checked,
                diff: constructionChecks.diff.checked && checks.diff.checked,
                cross: constructionChecks.cross.checked && checks.cross.checked
            };
        }

        function partOfActiveConstruction(name) {
            const active = activeConstructions();
            const any = active.sum || active.diff || active.cross;
            if ((name === 'u' || name === 'v') && any && checks[name].checked) return true;
            if (name === 'sum') return active.sum;
            if (name === 'diff') return active.diff;
            if (name === 'cross') return active.cross;
            return false;
        }

        function vectorAlpha(name) {
            if (partOfActiveConstruction(name)) return 1;
            if (focusedVector == null) return 1;
            return focusedVector === name ? 1 : 0.62;
        }

        function segmentAlreadyShown(start, delta) {
            if (start.lengthSq() > 1e-4) return false;
            const same = (v) => delta.distanceTo(v) < 1e-3;
            if (checks.u.checked && same(vecU)) return true;
            if (checks.v.checked && same(vecV)) return true;
            if (checks.sum.checked && same(vecSum)) return true;
            if (checks.diff.checked && same(vecDiff)) return true;
            if (checks.cross.checked && viewMode === '3d' && same(vecCross)) return true;
            return false;
        }

        function constructionPieces() {
            const active = activeConstructions();
            const drawSumGhost = active.sum && vecV.lengthSq() > 1e-6 && !segmentAlreadyShown(vecU, vecV);
            const negV = vecV.clone().negate();
            const drawDiffGhost = active.diff && vecV.lengthSq() > 1e-6 && !segmentAlreadyShown(vecU, negV);
            const drawCrossU = active.cross && vecU.lengthSq() > 1e-6 && !segmentAlreadyShown(vecV, vecU);
            const drawCrossV = active.cross && vecV.lengthSq() > 1e-6 && !drawSumGhost && !segmentAlreadyShown(vecU, vecV);
            return { ...active, drawSumGhost, drawDiffGhost, drawCrossU, drawCrossV };
        }

        function vectorThickness(name) {
            return focusedVector === name ? 1.35 : 1;
        }

        // 2D arrows stay in world units, but thicker and with larger heads than the 3D ones.
        const PLANAR_ARROW_SCALE = 1.65;

        function vectorDrawScale(name) {
            const focusScale = vectorThickness(name);
            return viewMode === '2d' ? focusScale * PLANAR_ARROW_SCALE : focusScale;
        }

        function vectorHeadWorld(arrowObj) {
            return viewMode === '2d' ? arrowObj.headLength * PLANAR_ARROW_SCALE : null;
        }

        function updateFocusedCardStyling() {
            Object.entries(focusPanels).forEach(([name, info]) => {
                const card = document.getElementById(info.id);
                if (!card) return;
                if (focusedVector === name) {
                    card.style.boxShadow = `0 0 10px ${info.color}`;
                    card.style.backgroundColor = '#444';
                } else {
                    card.style.boxShadow = 'none';
                    card.style.backgroundColor = '#333';
                }
            });
        }

        function scrollToPanel(vecName) {
            setTimeout(() => {
                const info = focusPanels[vecName];
                const card = info && document.getElementById(info.id);
                const sidebar = document.getElementById('control-panel');
                if (!card || !sidebar) return;
                const sidebarRect = sidebar.getBoundingClientRect();
                const cardRect = card.getBoundingClientRect();
                const top = cardRect.top - sidebarRect.top + sidebar.scrollTop - 12;
                sidebar.scrollTo({
                    top: Math.max(0, top),
                    behavior: 'smooth'
                });
            }, 50);
        }

        function focusVector(vecName, { scroll = true, expand = true } = {}) {
            if (!focusPanels[vecName]) return;
            focusedVector = vecName;
            if (expand && (vecName === 'u' || vecName === 'v')) {
                const panel = document.getElementById(focusPanels[vecName].id);
                if (panel) panel.classList.add('expanded');
            }
            updateFocusedCardStyling();
            if (scroll) scrollToPanel(vecName);
        }

        function clearFocus() {
            if (focusedVector == null) return;
            focusedVector = null;
            updateFocusedCardStyling();
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointermove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = e.clientX - rect.left;
            const clientY = e.clientY - rect.top;
            
            const mouse2D = { x: clientX, y: clientY };
            
            mouse.x = (clientX / rect.width) * 2 - 1;
            mouse.y = -(clientY / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, viewCamera);

            if (viewMode === '2d' && e.buttons === 1 && !interactionState.draggingVector) {
                planarUserAdjusted = true;
            }

            if (interactionState.draggingVector && interactionState.draggingAxis) {
                const clampCoord = (value) => {
                    const clamped = Math.max(-10, Math.min(10, value));
                    return Math.round(clamped * 10) / 10;
                };

                if (interactionState.draggingAxis === 'tip' && viewMode === '2d') {
                    const ray = raycaster.ray;
                    if (Math.abs(ray.direction.z) > 1e-8) {
                        const t = -ray.origin.z / ray.direction.z;
                        const x = clampCoord(ray.origin.x + ray.direction.x * t);
                        const y = clampCoord(ray.origin.y + ray.direction.y * t);
                        const vecInputs = inputs[interactionState.draggingVector];
                        vecInputs.x.range.value = x;
                        vecInputs.x.num.value = x;
                        vecInputs.y.range.value = y;
                        vecInputs.y.num.value = y;
                        updateVectors();
                    }
                    return;
                }

                const axisDir = new THREE.Vector3();
                if (interactionState.draggingAxis === 'x') axisDir.set(1, 0, 0);
                else if (interactionState.draggingAxis === 'y') axisDir.set(0, 1, 0);
                else if (interactionState.draggingAxis === 'z') axisDir.set(0, 0, 1);
                
                const w0 = raycaster.ray.origin;
                const a = 1;
                const b = raycaster.ray.direction.dot(axisDir);
                const c = 1;
                const d = raycaster.ray.direction.dot(w0);
                const e = axisDir.dot(w0);
                const D = a * c - b * b;
                
                if (D > 1e-6) {
                    const tc = clampCoord((a * e - b * d) / D);
                    
                    const vecInputs = inputs[interactionState.draggingVector][interactionState.draggingAxis];
                    vecInputs.range.value = tc;
                    vecInputs.num.value = tc;
                    updateVectors();
                }
                return;
            }

            let foundVector = null;
            let foundAxis = null;
            let bestDist = Infinity;

            function considerHit(dist, limit, vecName, axis) {
                if (dist <= limit && dist < bestDist) {
                    bestDist = dist;
                    foundVector = vecName;
                    foundAxis = axis;
                }
            }

            function getScreenPos(p3d) {
                const p = p3d.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                if (p.z > -viewCamera.near) return { z: 2 };
                p.applyMatrix4(viewCamera.projectionMatrix);
                return {
                    x: (p.x * 0.5 + 0.5) * rect.width,
                    y: (-(p.y) * 0.5 + 0.5) * rect.height,
                    z: p.z
                };
            }

            function distToSegment(p, v, w) {
                const l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
                if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
                let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
            }

            const checkHover = (vecName, vecObj) => {
                if (!checks[vecName].checked) return;
                const editable = vecName === 'u' || vecName === 'v';

                if (viewMode === '2d' && editable) {
                    const tip = getScreenPos(vecObj);
                    if (tip.z < 1) {
                        const zoom = Math.max(orthoCamera.zoom, 0.0001);
                        const halfH = (orthoCamera.top - orthoCamera.bottom) / (2 * zoom);
                        const worldPerPx = (halfH * 2) / Math.max(rect.height, 1);
                        const headRadiusPx = (0.26 * vectorDrawScale(vecName)) / worldPerPx;
                        const tipLimit = Math.max(28, headRadiusPx);
                        considerHit(Math.hypot(mouse2D.x - tip.x, mouse2D.y - tip.y), tipLimit, vecName, 'tip');
                    }
                }
                
                const px = getScreenPos(new THREE.Vector3(vecObj.x, 0, 0));
                const py = getScreenPos(new THREE.Vector3(0, vecObj.y, 0));
                const pz = getScreenPos(new THREE.Vector3(0, 0, vecObj.z));
                
                if (px.z < 1) considerHit(Math.hypot(mouse2D.x - px.x, mouse2D.y - px.y), 20, vecName, 'x');
                if (py.z < 1) considerHit(Math.hypot(mouse2D.x - py.x, mouse2D.y - py.y), 20, vecName, 'y');
                if (viewMode !== '2d' && pz.z < 1) considerHit(Math.hypot(mouse2D.x - pz.x, mouse2D.y - pz.y), 20, vecName, 'z');
                
                if (!foundAxis) {
                    const o2D = getScreenPos(origin);
                    const v2D = getScreenPos(vecObj);
                    if (o2D.z < 1 && v2D.z < 1) {
                        considerHit(distToSegment(mouse2D, o2D, v2D), 20, vecName, null);
                    }
                }
            };

            checkHover('u', vecU);
            checkHover('v', vecV);
            checkHover('sum', vecSum);
            checkHover('diff', vecDiff);
            checkHover('cross', vecCross);

            if (interactionState.hoveredVector !== foundVector || interactionState.hoveredAxis !== foundAxis) {
                interactionState.hoveredVector = foundVector;
                interactionState.hoveredAxis = foundAxis;
                
                const isEditableAxis = foundAxis && foundAxis !== 'tip' && (foundVector === 'u' || foundVector === 'v');
                const cursor = foundAxis === 'tip' ? 'grab' : (isEditableAxis ? 'pointer' : (foundVector ? 'crosshair' : 'default'));
                renderer.domElement.style.cursor = cursor;
            }
        });

        renderer.domElement.addEventListener('pointerleave', (e) => {
            if (!interactionState.draggingVector) {
                interactionState.hoveredVector = null;
                interactionState.hoveredAxis = null;
                renderer.domElement.style.cursor = 'default';
            }
        });

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (interactionState.hoveredVector) {
                focusVector(interactionState.hoveredVector);
                const canDrag = interactionState.hoveredAxis &&
                    (interactionState.hoveredVector === 'u' || interactionState.hoveredVector === 'v');
                if (canDrag) {
                    interactionState.draggingVector = interactionState.hoveredVector;
                    interactionState.draggingAxis = interactionState.hoveredAxis;
                    if (interactionState.draggingAxis === 'tip') {
                        renderer.domElement.style.cursor = 'grabbing';
                    }
                    if (renderer.domElement.setPointerCapture) {
                        renderer.domElement.setPointerCapture(e.pointerId);
                    }
                }
                controls.enabled = false;
                e.preventDefault();
                e.stopImmediatePropagation();
            } else {
                clearFocus();
            }
        }, true);

        window.addEventListener('pointerup', () => {
            if (interactionState.draggingVector) {
                interactionState.draggingVector = null;
                interactionState.draggingAxis = null;
            }
            controls.enabled = true;
        });

        // Sync inputs
        function syncInputs(source, target, vecName, axis) {
            target.value = source.value;
            
            if (focusedVector !== vecName) {
                focusVector(vecName, { scroll: false, expand: false });
            }
            interactionState.editingVector = vecName;
            interactionState.editingAxis = axis;
            clearTimeout(interactionState.editTimeout);
            interactionState.editTimeout = setTimeout(() => {
                interactionState.editingVector = null;
                interactionState.editingAxis = null;
            }, 1500);
            
            updateVectors();
        }

        ['u', 'v'].forEach(vec => {
            ['x', 'y', 'z'].forEach(axis => {
                inputs[vec][axis].range.addEventListener('input', (e) => syncInputs(e.target, inputs[vec][axis].num, vec, axis));
                inputs[vec][axis].num.addEventListener('input', (e) => syncInputs(e.target, inputs[vec][axis].range, vec, axis));
            });
        });

        Object.entries(checks).forEach(([name, check]) => {
            check.addEventListener('change', () => {
                if (!check.checked && constructionChecks[name]) {
                    constructionChecks[name].checked = false;
                }
                if (focusedVector !== name) {
                    focusVector(name, { scroll: false, expand: false });
                }
                updateVectors();
            });
        });

        Object.entries(constructionChecks).forEach(([name, check]) => {
            check.addEventListener('change', () => {
                if (check.checked && !checks[name].checked) checks[name].checked = true;
                if (focusedVector !== name) focusVector(name, { scroll: false, expand: false });
                updateVectors();
            });
        });

        const PLANAR_VIEW_SIZE = 16;
        let planarUserAdjusted = false;
        const planarHome = { cx: 0, cy: 0, zoom: 1 };

        function applyPlanarHome() {
            orthoCamera.zoom = planarHome.zoom;
            orthoCamera.position.set(planarHome.cx, planarHome.cy, 40);
            orthoCamera.up.set(0, 1, 0);
            orthoCamera.lookAt(planarHome.cx, planarHome.cy, 0);
            controls.target.set(planarHome.cx, planarHome.cy, 0);
            orthoCamera.updateProjectionMatrix();
        }

        function resizeCamera() {
            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 1);
            const aspect = w / h;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            orthoCamera.left = -PLANAR_VIEW_SIZE * aspect;
            orthoCamera.right = PLANAR_VIEW_SIZE * aspect;
            orthoCamera.top = PLANAR_VIEW_SIZE;
            orthoCamera.bottom = -PLANAR_VIEW_SIZE;
            orthoCamera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function fitPlanarView() {
            resizeCamera();
            // Room for u, v and the planar results (u+v, u-v), whether or not they are shown.
            const pts = [origin, vecU, vecV, vecSum, vecDiff];

            let x0 = Infinity;
            let x1 = -Infinity;
            let y0 = Infinity;
            let y1 = -Infinity;
            pts.forEach((p) => {
                x0 = Math.min(x0, p.x);
                x1 = Math.max(x1, p.x);
                y0 = Math.min(y0, p.y);
                y1 = Math.max(y1, p.y);
            });

            let bw = x1 - x0;
            let bh = y1 - y0;
            if (bw < 1e-4 && bh < 1e-4) {
                bw = 4;
                bh = 4;
            }

            const aspect = container.clientWidth / Math.max(container.clientHeight, 1);
            const fill = 0.8;
            const zoomW = bw > 1e-4 ? (fill * 2 * PLANAR_VIEW_SIZE * aspect) / bw : Infinity;
            const zoomH = bh > 1e-4 ? (fill * 2 * PLANAR_VIEW_SIZE) / bh : Infinity;
            let zoom = Math.min(zoomW, zoomH);
            if (!Number.isFinite(zoom)) zoom = 1;
            zoom = THREE.MathUtils.clamp(zoom, controls.minZoom, controls.maxZoom);

            planarHome.cx = (x0 + x1) / 2;
            planarHome.cy = (y0 + y1) / 2;
            planarHome.zoom = zoom;
            applyPlanarHome();
            controls.update();
        }

        function setAxisValue(vecName, axis, value) {
            const pair = inputs[vecName][axis];
            pair.range.value = value;
            pair.num.value = value;
        }

        function setViewMode(mode) {
            if (mode === viewMode) return;
            viewMode = mode;
            document.body.classList.toggle('is-2d', mode === '2d');

            if (mode === '2d') {
                savedZ.u = parseFloat(inputs.u.z.num.value) || 0;
                savedZ.v = parseFloat(inputs.v.z.num.value) || 0;
                setAxisValue('u', 'z', 0);
                setAxisValue('v', 'z', 0);

                savedView.position.copy(camera.position);
                savedView.target.copy(controls.target);

                orthoCamera.position.set(0, 0, 40);
                orthoCamera.up.set(0, 1, 0);
                orthoCamera.zoom = 1;
                orthoCamera.lookAt(0, 0, 0);
                viewCamera = orthoCamera;
                controls.object = orthoCamera;
                controls.target.set(0, 0, 0);
                controls.enableRotate = false;
                controls.minZoom = planarZoom.min;
                controls.maxZoom = planarZoom.max;
                controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
                controls.touches.ONE = THREE.TOUCH.PAN;
                planarUserAdjusted = false;

                gridHelper.rotation.set(Math.PI / 2, 0, 0);
                gridHelper.position.set(0, 0, -0.01);
                scene.background = flatBackground;
            } else {
                setAxisValue('u', 'z', savedZ.u);
                setAxisValue('v', 'z', savedZ.v);

                camera.position.copy(savedView.position);
                viewCamera = camera;
                controls.object = camera;
                controls.target.copy(savedView.target);
                controls.enableRotate = true;
                controls.minZoom = perspectiveZoom.min;
                controls.maxZoom = perspectiveZoom.max;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.touches.ONE = THREE.TOUCH.ROTATE;

                gridHelper.rotation.set(0, 0, 0);
                gridHelper.position.set(0, -0.01, 0);
                scene.background = skyTexture;
                camera.lookAt(controls.target);
            }

            applyBrightness(parseFloat(hdriBrightnessSlider.value));
            controls.update();
            resizeCamera();
            updateVectors();
            if (mode === '2d') fitPlanarView();
        }

        document.querySelectorAll('input[name="view-mode"]').forEach((radio) => {
            radio.addEventListener('change', () => {
                if (radio.checked) setViewMode(radio.value);
            });
        });

        // Setup side panel hover effects
        const panelHoverSetup = [
            { id: 'panel-u', vec: 'u' },
            { id: 'panel-v', vec: 'v' },
            { id: 'panel-sum', vec: 'sum' },
            { id: 'panel-diff', vec: 'diff' },
            { id: 'panel-cross', vec: 'cross' }
        ];

        panelHoverSetup.forEach(item => {
            const el = document.getElementById(item.id);
            if (el) {
                el.addEventListener('mouseenter', () => {
                    if (!interactionState.draggingVector) {
                        interactionState.hoveredVector = item.vec;
                    }
                });
                el.addEventListener('mouseleave', () => {
                    if (!interactionState.draggingVector && interactionState.hoveredVector === item.vec) {
                        interactionState.hoveredVector = null;
                        interactionState.hoveredAxis = null;
                    }
                });
                el.addEventListener('click', (e) => {
                    if (e.target.closest('input[type="range"], input[type="number"]')) return;
                    if (focusedVector === item.vec) return;
                    focusVector(item.vec, { scroll: false, expand: false });
                });
            }
        });

        // Setup side panel axis hover effects
        ['u', 'v'].forEach(vec => {
            ['x', 'y', 'z'].forEach(axis => {
                const el = document.getElementById(`panel-${vec}-${axis}`);
                if (el) {
                    el.addEventListener('mouseenter', (e) => {
                        if (!interactionState.draggingVector) {
                            interactionState.hoveredVector = vec;
                            interactionState.hoveredAxis = axis;
                        }
                    });
                    el.addEventListener('mouseleave', (e) => {
                        if (!interactionState.draggingVector) {
                            interactionState.hoveredAxis = null;
                            interactionState.hoveredVector = vec;
                        }
                    });
                }
            });
        });

        function updateVectors() {
            vecU.set(
                parseFloat(inputs.u.x.num.value) || 0,
                parseFloat(inputs.u.y.num.value) || 0,
                parseFloat(inputs.u.z.num.value) || 0
            );
            vecV.set(
                parseFloat(inputs.v.x.num.value) || 0,
                parseFloat(inputs.v.y.num.value) || 0,
                parseFloat(inputs.v.z.num.value) || 0
            );

            vecSum.addVectors(vecU, vecV);
            vecDiff.subVectors(vecU, vecV);
            vecCross.crossVectors(vecU, vecV);
            const dotProduct = vecU.dot(vecV);

            labels.u.textContent = `|u| = ${vecU.length().toFixed(2)}`;
            labels.v.textContent = `|v| = ${vecV.length().toFixed(2)}`;
            const formatCoords = (v) => viewMode === '2d'
                ? `${v.x}; ${v.y}`
                : `${v.x}; ${v.y}; ${v.z}`;
            labels.coordsU.textContent = `u=(${formatCoords(vecU)})`;
            labels.coordsV.textContent = `v=(${formatCoords(vecV)})`;
            labels.sum.textContent = `|u+v| = ${vecSum.length().toFixed(2)}`;
            labels.diff.textContent = `|u-v| = ${vecDiff.length().toFixed(2)}`;
            labels.cross.textContent = `|u×v| = ${vecCross.length().toFixed(2)}`;
            labels.dot.textContent = dotProduct.toFixed(2);
        }

        window.addEventListener('resize', () => {
            if (viewMode === '2d' && !planarUserAdjusted) fitPlanarView();
            else resizeCamera();
        });
        renderer.domElement.addEventListener('wheel', () => {
            if (viewMode === '2d') planarUserAdjusted = true;
        }, { passive: true });
        resizeCamera();

        // Initial update
        updateVectors();

        // 6. 2D Overlay for Vectors and Axes
        const overlayCanvas = document.getElementById('overlay-canvas');
        const ctx = overlayCanvas.getContext('2d');

        function renderOverlay() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            
            if (overlayCanvas.width !== Math.floor(width * dpr) || overlayCanvas.height !== Math.floor(height * dpr)) {
                overlayCanvas.width = Math.floor(width * dpr);
                overlayCanvas.height = Math.floor(height * dpr);
                ctx.scale(dpr, dpr);
            }
            
            ctx.clearRect(0, 0, width, height);
            
            const near = viewCamera.near;

            function projectSegment(vStart, vEnd) {
                if (vStart.distanceTo(vEnd) < 0.001) return null;
                const p1 = vStart.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                const p2 = vEnd.clone().applyMatrix4(viewCamera.matrixWorldInverse);

                if (p1.z > -near && p2.z > -near) return null;

                let clipped1 = p1.clone();
                let clipped2 = p2.clone();
                if (p1.z > -near || p2.z > -near) {
                    const t = (-near - p1.z) / (p2.z - p1.z);
                    const intersection = p1.clone().lerp(p2, t);
                    if (p1.z > -near) clipped1 = intersection;
                    else clipped2 = intersection;
                }

                const proj1 = clipped1.applyMatrix4(viewCamera.projectionMatrix);
                const proj2 = clipped2.applyMatrix4(viewCamera.projectionMatrix);

                return {
                    x1: (proj1.x * 0.5 + 0.5) * width,
                    y1: (-(proj1.y) * 0.5 + 0.5) * height,
                    x2: (proj2.x * 0.5 + 0.5) * width,
                    y2: (-(proj2.y) * 0.5 + 0.5) * height
                };
            }

            function drawLine3D(vStart, vEnd, color, thickness, isDashed = false) {
                const seg = projectSegment(vStart, vEnd);
                if (!seg) return;

                ctx.beginPath();
                ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
                ctx.strokeStyle = color;
                ctx.lineWidth = thickness;
                if (isDashed) ctx.setLineDash([10, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawComponentArrow(vEnd, color) {
                const seg = projectSegment(origin, vEnd);
                if (!seg) return 0;
                const dx = seg.x2 - seg.x1;
                const dy = seg.y2 - seg.y1;
                const len = Math.hypot(dx, dy);
                if (len < 8) return 0;
                const ux = dx / len;
                const uy = dy / len;
                const headLen = Math.min(20, Math.max(12, len * 0.34));
                const shaftWidth = viewMode === '2d' ? 9 : 4;
                const headW = Math.max(shaftWidth * 0.78, headLen * 0.46);
                const bx = seg.x2 - ux * headLen;
                const by = seg.y2 - uy * headLen;
                const tuck = Math.min(shaftWidth * 0.45, headLen * 0.28);

                ctx.save();
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = shaftWidth;
                ctx.lineCap = 'butt';
                ctx.lineJoin = 'miter';
                ctx.beginPath();
                ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(bx + ux * tuck, by + uy * tuck);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(seg.x2, seg.y2);
                ctx.lineTo(bx - uy * headW, by + ux * headW);
                ctx.lineTo(bx + uy * headW, by - ux * headW);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                return len;
            }

            function drawProjections(vecObj, color, activeAxis, hoveredAxis, isEditable = true, labelBase = '') {
                const planar = viewMode === '2d';
                const { x, y, z } = vecObj;
                const pX = new THREE.Vector3(x, 0, 0);
                const pY = new THREE.Vector3(0, y, 0);
                const pZ = new THREE.Vector3(0, 0, z);
                const pXY = new THREE.Vector3(x, y, 0);
                const pXZ = new THREE.Vector3(x, 0, z);
                const pYZ = new THREE.Vector3(0, y, z);

                ctx.globalAlpha = 0.92;
                drawLine3D(pX, pXY, color, 2.6, true);
                drawLine3D(pY, pXY, color, 2.6, true);
                drawLine3D(pXY, vecObj, color, 2.6, true);
                if (!planar) {
                    drawLine3D(pX, pXZ, color, 2.6, true);
                    drawLine3D(pZ, pXZ, color, 2.6, true);
                    drawLine3D(pY, pYZ, color, 2.6, true);
                    drawLine3D(pZ, pYZ, color, 2.6, true);
                    drawLine3D(pXZ, vecObj, color, 2.6, true);
                    drawLine3D(pYZ, vecObj, color, 2.6, true);
                }
                ctx.globalAlpha = 1.0;

                function showComponent(end, axisName) {
                    const screenLen = drawComponentArrow(end, color);
                    if (screenLen < 26 || !labelBase) return;
                    const away = vecObj.clone().sub(end);
                    if (away.lengthSq() < 1e-4) {
                        if (axisName === 'x') away.set(0, 1, 0);
                        else away.set(1, 0, 0);
                    } else {
                        away.negate();
                    }
                    queueLabel(end.clone().multiplyScalar(0.55), color, labelBase, false, 1, axisName, away);
                }

                showComponent(pX, 'x');
                showComponent(pY, 'y');
                if (!planar) showComponent(pZ, 'z');
                
                function drawHandle(p3d, axis) {
                    if (!(isEditable && (activeAxis === axis || hoveredAxis === axis))) return;
                    const p2 = p3d.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                    if (p2.z > -near) return;
                    p2.applyMatrix4(viewCamera.projectionMatrix);
                    
                    const sx = (p2.x * 0.5 + 0.5) * width;
                    const sy = (-(p2.y) * 0.5 + 0.5) * height;
                    
                    ctx.beginPath();
                    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(sx, sy, 12, 0, Math.PI * 2);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                }
                
                drawHandle(pX, 'x');
                drawHandle(pY, 'y');
                if (!planar) drawHandle(pZ, 'z');
                if (planar && isEditable && (activeAxis === 'tip' || hoveredAxis === 'tip')) {
                    drawHandle(vecObj, 'tip');
                }
            }
            
            function drawLabel(vEnd, color, labelText, isAxis = false, alpha = 1, subscript = null, labelAway = null) {
                if (!labelText || vEnd.lengthSq() < 0.000001) return;
                
                const p = vEnd.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                if (p.z > -near) return; // Behind camera
                
                p.applyMatrix4(viewCamera.projectionMatrix);
                
                const x = (p.x * 0.5 + 0.5) * width;
                const y = (-(p.y) * 0.5 + 0.5) * height;
                
                ctx.font = "bold 16px sans-serif";
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;
                ctx.shadowColor = 'rgba(34,34,34,0.8)';
                ctx.shadowBlur = 4;

                if (!subscript) {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                    if (viewMode === '2d' && isAxis && labelText === 'X') {
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(labelText, x, y + 12);
                    } else {
                        ctx.fillText(labelText, x + 8, y + 8);
                    }
                } else {
                    const axis = subscript === 'y' ? new THREE.Vector3(0, 1, 0)
                        : subscript === 'z' ? new THREE.Vector3(0, 0, 1)
                        : new THREE.Vector3(1, 0, 0);
                    const hint = (labelAway && labelAway.lengthSq() > 1e-8)
                        ? labelAway.clone().normalize()
                        : axis.clone();
                    const q = vEnd.clone().add(hint).applyMatrix4(viewCamera.matrixWorldInverse);
                    let ox = 18;
                    let oy = -18;
                    if (q.z <= -near) {
                        q.applyMatrix4(viewCamera.projectionMatrix);
                        const qx = (q.x * 0.5 + 0.5) * width;
                        const qy = (-(q.y) * 0.5 + 0.5) * height;
                        let dx = qx - x;
                        let dy = qy - y;
                        const dlen = Math.hypot(dx, dy);
                        if (dlen > 0.5) {
                            ox = dx / dlen * 22;
                            oy = dy / dlen * 22;
                        } else {
                            const qAlt = vEnd.clone().add(axis).applyMatrix4(viewCamera.matrixWorldInverse);
                            if (qAlt.z <= -near) {
                                qAlt.applyMatrix4(viewCamera.projectionMatrix);
                                const ax = (qAlt.x * 0.5 + 0.5) * width;
                                const ay = (-(qAlt.y) * 0.5 + 0.5) * height;
                                let adx = ax - x;
                                let ady = ay - y;
                                const alen = Math.hypot(adx, ady);
                                if (alen > 0.5) {
                                    adx /= alen;
                                    ady /= alen;
                                    let px = -ady;
                                    let py = adx;
                                    if (py > 0) {
                                        px = -px;
                                        py = -py;
                                    }
                                    ox = px * 22;
                                    oy = py * 22;
                                }
                            }
                        }
                    }
                    if (viewMode === '2d' && subscript === 'x') {
                        oy = Math.abs(oy) + 10;
                    }
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    const baseW = ctx.measureText(labelText).width;
                    ctx.font = 'bold 11px sans-serif';
                    const subW = ctx.measureText(subscript).width;
                    const gap = 1;
                    const startX = x + ox - (baseW + gap + subW) / 2;
                    const ty = y + oy;
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText(labelText, startX, ty);
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(subscript, startX + baseW + gap, ty + 5);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
            
            const pieces = constructionPieces();
            const showCrossHover = (interactionState.hoveredVector === 'cross' || focusedVector === 'cross') && checks.cross.checked;
            if (!pieces.cross && showCrossHover && vecU.lengthSq() > 1e-6 && vecV.lengthSq() > 1e-6) {
                const p0 = origin.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                const pu = vecU.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                const pv = vecV.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                const puv = new THREE.Vector3().addVectors(vecU, vecV).applyMatrix4(viewCamera.matrixWorldInverse);
                
                // Only draw if all points are in front of camera
                if (p0.z <= -near && pu.z <= -near && pv.z <= -near && puv.z <= -near) {
                    p0.applyMatrix4(viewCamera.projectionMatrix);
                    pu.applyMatrix4(viewCamera.projectionMatrix);
                    pv.applyMatrix4(viewCamera.projectionMatrix);
                    puv.applyMatrix4(viewCamera.projectionMatrix);
                    
                    const x0 = (p0.x * 0.5 + 0.5) * width;
                    const y0 = (-(p0.y) * 0.5 + 0.5) * height;
                    const xu = (pu.x * 0.5 + 0.5) * width;
                    const yu = (-(pu.y) * 0.5 + 0.5) * height;
                    const xv = (pv.x * 0.5 + 0.5) * width;
                    const yv = (-(pv.y) * 0.5 + 0.5) * height;
                    const xuv = (puv.x * 0.5 + 0.5) * width;
                    const yuv = (-(puv.y) * 0.5 + 0.5) * height;
                    
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.lineTo(xu, yu);
                    ctx.lineTo(xuv, yuv);
                    ctx.lineTo(xv, yv);
                    ctx.closePath();
                    
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(204, 51, 204, 0.85)';
                    ctx.setLineDash([10, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            const drawQueue = [];
            const camDir = viewCamera.position.clone().normalize();

            const componentSymbol = {
                u: 'u',
                v: 'v',
                sum: '(u+v)',
                diff: '(u-v)',
                cross: '(u×v)'
            };

            // Draw projections (Background layer)
            ['u', 'v', 'sum', 'diff', 'cross'].forEach(vecName => {
                if (checks[vecName].checked) {
                    if (focusedVector === vecName ||
                        interactionState.hoveredVector === vecName || 
                        interactionState.draggingVector === vecName ||
                        interactionState.editingVector === vecName) {
                        
                        let vecObj, color;
                        switch(vecName) {
                            case 'u': vecObj = vecU; color = '#cc0000'; break;
                            case 'v': vecObj = vecV; color = '#009900'; break;
                            case 'sum': vecObj = vecSum; color = '#3333ff'; break;
                            case 'diff': vecObj = vecDiff; color = '#ff8800'; break;
                            case 'cross': vecObj = vecCross; color = '#cc33cc'; break;
                        }

                        const activeAxis = (interactionState.draggingVector === vecName) ? interactionState.draggingAxis :
                                           (interactionState.editingVector === vecName) ? interactionState.editingAxis : null;
                        const hoveredAxis = (interactionState.hoveredVector === vecName) ? interactionState.hoveredAxis : null;
                        const isEditable = vecName === 'u' || vecName === 'v';
                        
                        drawProjections(vecObj, color, activeAxis, hoveredAxis, isEditable, componentSymbol[vecName]);
                    }
                }
            });

            function queueLabel(vEnd, color, labelText, isAxis, alpha = 1, subscript = null, labelAway = null) {
                if (vEnd.lengthSq() < 0.000001) return; // Skip very small vectors
                
                const dir = vEnd.clone().normalize();
                const dot = camDir.dot(dir);
                
                drawQueue.push({
                    vEnd, color, labelText, isAxis, dot, alpha, subscript, labelAway
                });
            }

            if (viewMode === '2d') {
                const insetX = (planarFrame.x1 - planarFrame.x0) * 0.045;
                const insetY = (planarFrame.y1 - planarFrame.y0) * 0.07;
                queueLabel(new THREE.Vector3(planarFrame.x1 - insetX, 0, 0), '#eeeeee', 'X', true);
                queueLabel(new THREE.Vector3(0, planarFrame.y1 - insetY, 0), '#eeeeee', 'Y', true);
            } else {
                queueLabel(new THREE.Vector3(10, 0, 0), '#aaaaaa', 'X', true);
                queueLabel(new THREE.Vector3(0, 10, 0), '#aaaaaa', 'Y', true);
                queueLabel(new THREE.Vector3(0, 0, 10), '#aaaaaa', 'Z', true);
            }

            // Queue vectors
            if (checks.u.checked) queueLabel(vecU, '#cc0000', 'u', false, vectorAlpha('u'));
            if (checks.v.checked) queueLabel(vecV, '#009900', 'v', false, vectorAlpha('v'));
            if (checks.sum.checked) queueLabel(vecSum, '#3333ff', 'u+v', false, vectorAlpha('sum'));
            if (checks.diff.checked) queueLabel(vecDiff, '#ff8800', 'u-v', false, vectorAlpha('diff'));
            if (checks.cross.checked && viewMode === '3d') queueLabel(vecCross, '#cc33cc', 'u×v', false, vectorAlpha('cross'));

            if (pieces.drawSumGhost) {
                queueLabel(vecU.clone().addScaledVector(vecV, 0.62), '#009900', 'v', false, 0.5);
            }
            if (pieces.drawDiffGhost) {
                queueLabel(vecU.clone().addScaledVector(vecV, -0.62), '#009900', '−v', false, 0.5);
            }
            if (pieces.drawCrossU) queueLabel(vecV.clone().addScaledVector(vecU, 0.62), '#cc0000', 'u', false, 0.5);
            if (pieces.drawCrossV) queueLabel(vecU.clone().addScaledVector(vecV, 0.62), '#009900', 'v', false, 0.5);

            // Sort so that those pointing away from camera (lower dot product) are drawn first
            drawQueue.sort((a, b) => a.dot - b.dot);

            // Draw sorted labels
            drawQueue.forEach(item => {
                drawLabel(item.vEnd, item.color, item.labelText, item.isAxis, item.alpha, item.subscript, item.labelAway);
            });

            if (viewMode === '2d' && checks.cross.checked && vecCross.lengthSq() > 1e-8) {
                const p = origin.clone().applyMatrix4(viewCamera.matrixWorldInverse);
                if (p.z <= -near) {
                    p.applyMatrix4(viewCamera.projectionMatrix);
                    const sx = (p.x * 0.5 + 0.5) * width;
                    const sy = (-p.y * 0.5 + 0.5) * height;
                    const radius = Math.max(11, Math.min(34, 7 + vecCross.length() * 0.65));
                    ctx.save();
                    ctx.globalAlpha = vectorAlpha('cross');
                    ctx.beginPath();
                    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#cc33cc';
                    ctx.stroke();
                    if (vecCross.z >= 0) {
                        ctx.beginPath();
                        ctx.arc(sx, sy, Math.max(2.5, radius * 0.16), 0, Math.PI * 2);
                        ctx.fillStyle = '#cc33cc';
                        ctx.fill();
                    } else {
                        const d = radius * 0.42;
                        ctx.beginPath();
                        ctx.moveTo(sx - d, sy - d);
                        ctx.lineTo(sx + d, sy + d);
                        ctx.moveTo(sx + d, sy - d);
                        ctx.lineTo(sx - d, sy + d);
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    }
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillStyle = '#cc33cc';
                    ctx.shadowColor = 'rgba(34,34,34,0.8)';
                    ctx.shadowBlur = 4;
                    ctx.fillText('u×v', sx + radius + 6, sy + 5);
                    ctx.restore();
                }
            }
        }

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (viewMode === '2d' && !planarUserAdjusted) applyPlanarHome();
            
            const pieces = constructionPieces();
            const buildMode = pieces.sum || pieces.diff || pieces.cross;
            const hoverCross = viewMode === '3d' && (interactionState.hoveredVector === 'cross' || focusedVector === 'cross') && checks.cross.checked;

            let axisXEnd = new THREE.Vector3(10, 0, 0);
            let axisYEnd = new THREE.Vector3(0, 10, 0);
            let axisXStart = null;
            let axisYStart = null;
            let axisThick = 1;
            let axisHead = null;

            if (viewMode === '2d') {
                const zoom = Math.max(orthoCamera.zoom, 0.0001);
                const halfW = (orthoCamera.right - orthoCamera.left) / (2 * zoom);
                const halfH = (orthoCamera.top - orthoCamera.bottom) / (2 * zoom);
                const cx = controls.target.x;
                const cy = controls.target.y;
                planarFrame.x0 = cx - halfW;
                planarFrame.x1 = cx + halfW;
                planarFrame.y0 = cy - halfH;
                planarFrame.y1 = cy + halfH;
                updatePlanarGrid(planarFrame.x0, planarFrame.x1, planarFrame.y0, planarFrame.y1);
                gridHelper.visible = false;
                planarGrid.visible = true;

                const worldPerPx = (halfH * 2) / Math.max(container.clientHeight, 1);
                axisThick = (2.4 * worldPerPx) / 0.05;
                axisHead = 16 * worldPerPx;
                axisXStart = new THREE.Vector3(planarFrame.x0, 0, 0);
                axisYStart = new THREE.Vector3(0, planarFrame.y0, 0);
                axisXEnd = new THREE.Vector3(planarFrame.x1 - axisHead * 0.15, 0, 0);
                axisYEnd = new THREE.Vector3(0, planarFrame.y1 - axisHead * 0.15, 0);
