            } else {
                gridHelper.visible = true;
                planarGrid.visible = false;
            }

            updateArrow(arrows3D.x, axisXEnd, true, 1, axisThick, axisXStart, axisHead);
            updateArrow(arrows3D.y, axisYEnd, true, 1, axisThick, axisYStart, axisHead);
            updateArrow(arrows3D.z, new THREE.Vector3(0, 0, 10), viewMode === '3d');
            const ghostScale = viewMode === '2d' ? PLANAR_ARROW_SCALE : 1;
            updateArrow(arrows3D.u, vecU, checks.u.checked || buildMode, checks.u.checked ? vectorAlpha('u') : 0.5, vectorDrawScale('u'), null, vectorHeadWorld(arrows3D.u));
            updateArrow(arrows3D.v, vecV, checks.v.checked || buildMode, checks.v.checked ? vectorAlpha('v') : 0.5, vectorDrawScale('v'), null, vectorHeadWorld(arrows3D.v));
            updateArrow(arrows3D.sum, vecSum, checks.sum.checked, vectorAlpha('sum'), vectorDrawScale('sum'), null, vectorHeadWorld(arrows3D.sum));
            updateArrow(arrows3D.diff, vecDiff, checks.diff.checked, vectorAlpha('diff'), vectorDrawScale('diff'), null, vectorHeadWorld(arrows3D.diff));
            updateArrow(arrows3D.cross, vecCross, checks.cross.checked && viewMode === '3d', vectorAlpha('cross'), vectorDrawScale('cross'), null, vectorHeadWorld(arrows3D.cross));
            updateArrow(arrows3D.sumBuild, vecSum, pieces.drawSumGhost, 0.5, ghostScale, vecU, viewMode === '2d' ? arrows3D.sumBuild.headLength * PLANAR_ARROW_SCALE : null);
            updateArrow(arrows3D.diffBuild, vecDiff, pieces.drawDiffGhost, 0.5, ghostScale, vecU, viewMode === '2d' ? arrows3D.diffBuild.headLength * PLANAR_ARROW_SCALE : null);
            updateArrow(arrows3D.crossBuildU, vecSum, pieces.drawCrossU, 0.5, ghostScale, vecV, viewMode === '2d' ? arrows3D.crossBuildU.headLength * PLANAR_ARROW_SCALE : null);
            updateArrow(arrows3D.crossBuildV, vecSum, pieces.drawCrossV, 0.5, ghostScale, vecU, viewMode === '2d' ? arrows3D.crossBuildV.headLength * PLANAR_ARROW_SCALE : null);

            const showArea = (pieces.cross || hoverCross) && vecU.lengthSq() > 1e-6 && vecV.lengthSq() > 1e-6 && vecCross.lengthSq() > 1e-6;
            paraMesh.visible = showArea;
            if (showArea) {
                paraMat.opacity = pieces.cross ? 0.28 : 0.22;
                const away = viewCamera.position.clone().sub(controls.target);
                if (away.lengthSq() < 1e-8) away.set(0, 0, 1);
                away.normalize().multiplyScalar(-0.95);
                const towardCam = viewCamera.position.clone().sub(controls.target);
                let pu = vecU.clone();
                let pv = vecV.clone();
                if (pu.clone().cross(pv).dot(towardCam) < 0) {
                    const swap = pu;
                    pu = pv;
                    pv = swap;
                }
                const o = away.clone();
                const a = pu.clone().add(away);
                const b = pv.clone().add(away);
                const c = pu.clone().add(pv).add(away);
                const pts = [o, a, c, o, c, b];
                for (let i = 0; i < pts.length; i++) {
                    paraPositions[i * 3] = pts[i].x;
                    paraPositions[i * 3 + 1] = pts[i].y;
                    paraPositions[i * 3 + 2] = pts[i].z;
                }
                paraGeom.attributes.position.needsUpdate = true;
                paraGeom.computeBoundingSphere();
            }

            const showHand = (pieces.cross || hoverCross) && vecU.lengthSq() > 1e-4 && vecV.lengthSq() > 1e-4 && vecCross.lengthSq() > 1e-4;
            if (showHand) {
                handToCam.copy(viewCamera.position).sub(controls.target);
                if (handToCam.lengthSq() < 1e-8) handToCam.set(0, 0, 1);
                handToCam.normalize();
                const palmTowardCamera = vecCross.dot(handToCam) >= 0;
                handY.copy(vecV).normalize();
                handZ.copy(vecCross).normalize();
                if (!palmTowardCamera) handZ.negate();
                handX.crossVectors(handY, handZ);
                if (handX.lengthSq() > 1e-8) {
                    handX.normalize();
                    handTexture.repeat.x = palmTowardCamera ? 1 : -1;
                    handTexture.offset.x = palmTowardCamera ? 0 : 1;
                    handMesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(handX, handY, handZ));
                    handMesh.scale.setScalar(handScreenScale());
                    handMesh.position.set(0, 0, 0);
                    handMesh.visible = true;
                } else {
                    handMesh.visible = false;
                }
            } else {
                handMesh.visible = false;
            }

            const sceneBackground = scene.background;
            renderer.autoClear = true;
            viewCamera.layers.set(0);
            renderer.render(scene, viewCamera);
            scene.background = null;
            renderer.autoClear = false;
            if (handMesh.visible) {
                renderer.clearDepth();
                viewCamera.layers.set(1);
                renderer.render(scene, viewCamera);
            }
            renderer.clearDepth();
            viewCamera.layers.set(2);
            renderer.render(scene, viewCamera);
            scene.background = sceneBackground;
            renderer.autoClear = true;
            viewCamera.layers.enableAll();
            renderOverlay();
        }
        animate();
    </script>
</body>
</html>
