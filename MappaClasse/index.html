        function initResizeHandles() {
            const classroom = document.getElementById('classroom-container');
            const resizers = classroom.querySelectorAll('.resizer');
            
            let original_width = 0;
            let original_height = 0;
            let original_mouse_x = 0;
            let original_mouse_y = 0;
            
            resizers.forEach(resizer => {
                resizer.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    original_width = parseFloat(getComputedStyle(classroom, null).getPropertyValue('width').replace('px', ''));
                    original_height = parseFloat(getComputedStyle(classroom, null).getPropertyValue('height').replace('px', ''));
                    original_mouse_x = e.pageX;
                    original_mouse_y = e.pageY;
                    
                    const onMouseMove = (e) => {
                        const dx = e.pageX - original_mouse_x;
                        const dy = e.pageY - original_mouse_y;

                        if (resizer.classList.contains('resizer-r')) {
                            // Cambia larghezza verso destra
                            const width = original_width + dx;
                            if (width > 200) classroom.style.width = width + 'px';
                        }
                        else if (resizer.classList.contains('resizer-b')) {
                            // Cambia altezza verso il basso
                            const height = original_height + dy;
                            if (height > 200) classroom.style.height = height + 'px';
                        }
                        else if (resizer.classList.contains('resizer-t')) {
                            // Cambia altezza verso l'alto (sottraiamo DY perché se andiamo su DY è negativo, Height deve aumentare)
                            const height = original_height - dy;
                            if (height > 200) {
                                classroom.style.height = height + 'px';
                                // Dobbiamo spostare fisicamente tutti gli oggetti all'interno verso il BASSO 
                                // della stessa quantità di pixel che abbiamo aggiunto in alto,
                                // per dare l'illusione che il bordo si sposti ma gli oggetti stiano fermi
                                // (in realtà se Height aumenta, e Top objects resta uguale, loro stanno attaccati al bordo Top.
                                //  Se il bordo Top sale, loro salgono con lui. Noi vogliamo che stiano fermi nello schermo,
                                //  quindi devono scendere (aumentare Top) di quanto il bordo è salito).
                                
                                // Tuttavia, update continuo in mousemove è complesso per i delta relativi.
                                // Calcoliamo la variazione rispetto all'ULTIMO frame? No, usiamo dx/dy totali e reset?
                                // Meglio approccio incrementale o ricalcolo da original?
                                
                                // Approccio semplice: ricalcolo tutto da original ogni frame, ma per top/left shift 
                                // dobbiamo sapere la posizione "originale" dei banchi al mousedown.
                                // Questo richiede di salvare lo stato iniziale di tutti i banchi al mousedown.
                            }
                        }
                        else if (resizer.classList.contains('resizer-l')) {
                            // Idem per sinistra
                            const width = original_width - dx;
                            if (width > 200) {
                                classroom.style.width = width + 'px';
                            }
                        }
                    }

                    // Logica specializzata per Top e Left che richiedono lo spostamento degli oggetti
                    // Per semplificare e rendere fluido, implementiamo una logica 'delta' passo-passo
                    // o meglio, aggiorniamo solo width/height per R/B, e width/height+shift per L/T.
                    // Per fare shift consistente, salviamo snapshot posizioni.
                    
                    let initialObjectPositions = [];
                    if (resizer.classList.contains('resizer-t') || resizer.classList.contains('resizer-l')) {
                        document.querySelectorAll('.desk, .teacher-desk').forEach(el => {
                            initialObjectPositions.push({
                                el: el,
                                top: parseFloat(el.style.top),
                                left: parseFloat(el.style.left)
                            });
                        });
                    }

                    const onMouseMoveComplex = (e) => {
                        const dx = e.pageX - original_mouse_x;
                        const dy = e.pageY - original_mouse_y;

                        if (resizer.classList.contains('resizer-r')) {
                            const width = original_width + dx;
                            if (width > 200) classroom.style.width = width + 'px';
                        }
                        else if (resizer.classList.contains('resizer-b')) {
                            const height = original_height + dy;
                            if (height > 200) classroom.style.height = height + 'px';
                        }
                        else if (resizer.classList.contains('resizer-t')) {
                            const newHeight = original_height - dy;
                            if (newHeight > 200) {
                                classroom.style.height = newHeight + 'px';
                                // Shift objects: Top aumenta di -dy (che è positivo se vado su)
                                const shiftY = -dy; 
                                initialObjectPositions.forEach(obj => {
                                    obj.el.style.top = (obj.top + shiftY) + 'px';
                                });
                            }
                        }
                        else if (resizer.classList.contains('resizer-l')) {
                            const newWidth = original_width - dx;
                            if (newWidth > 200) {
                                classroom.style.width = newWidth + 'px';
                                // Shift objects: Left aumenta di -dx
                                const shiftX = -dx;
                                initialObjectPositions.forEach(obj => {
                                    obj.el.style.left = (obj.left + shiftX) + 'px';
                                });
                            }
                        }
                    };

                    const onMouseUp = () => {
                        window.removeEventListener('mousemove', onMouseMoveComplex);
                        window.removeEventListener('mouseup', onMouseUp);
                    }

                    window.addEventListener('mousemove', onMouseMoveComplex);
                    window.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        function initSidebarResizer() {
            const sidebar = document.getElementById('sidebar');
            const resizer = document.getElementById('sidebar-resizer-handle');
            
            if (!resizer || !sidebar) return;

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                // Blocca selezione testo durante il drag
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'col-resize';
                resizer.classList.add('active');
                
                const startX = e.clientX;
                const startWidth = parseFloat(window.getComputedStyle(sidebar).width);

                function onMouseMove(e) {
                    const newWidth = startWidth + (e.clientX - startX);
                    // Limiti min/max (coerenti con CSS)
                    if (newWidth >= 150 && newWidth <= 600) {
                        sidebar.style.width = newWidth + 'px';
                    }
                }

                function onMouseUp() {
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                    resizer.classList.remove('active');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        // Funzione per decifrare e mostrare contatti autore
        function toggleAuthorInfo() {
            const footer = document.getElementById('author-footer');
            const isExpanded = footer.getAttribute('data-expanded') === 'true';
            
            if (isExpanded) {
                // Ripristina stato iniziale
                footer.innerHTML = "contatta l'autore";
                footer.setAttribute('data-expanded', 'false');
            } else {
                // Decifra e mostra
                const revEmail = "moc.liamg@ecsidocram";
                const email = reverseString(revEmail);
                const name = "Marco Discendenti";
                
                footer.innerHTML = `<a href="mailto:${email}">${email}</a>`;
                footer.setAttribute('data-expanded', 'true');
            }
        }

        function reverseString(str) {
            return str.split("").reverse().join("");
        }

        // --- LOGICA SMART PER NOMI/COGNOMI E SESSO ---
        // N.B. Le costanti MALE_NAMES, FEMALE_NAMES e SURNAME_PREFIXES sono definite in nomi.js

        function isCommonName(str) {
            return MALE_NAMES.has(str) || FEMALE_NAMES.has(str);
        }

        function getGenderFromToken(token) {
            if (MALE_NAMES.has(token)) return 'male';
            if (FEMALE_NAMES.has(token)) return 'female';
            return null;
        }

        // Rileva se la lista è "COGNOME NOME" o "NOME COGNOME"
        function detectListFormat(lines) {
            let scoreSurnameFirst = 0;
            let scoreNameFirst = 0;
            
            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length < 2) return;
                
                const first = parts[0];
                const last = parts[parts.length - 1];
                
                // Prefissi Cognome (es. DE, DI) all'inizio -> probabile Cognome Nome
                if (SURNAME_PREFIXES.has(first) || first.includes("'")) {
                    scoreSurnameFirst += 2;
                }
                
                const firstIsName = isCommonName(first);
                const lastIsName = isCommonName(last);
                
                if (firstIsName && !lastIsName) scoreNameFirst++;
                else if (!firstIsName && lastIsName) scoreSurnameFirst++;
            });
            
            return scoreSurnameFirst >= scoreNameFirst ? 'surname_first' : 'name_first';
        }

        // Estrae parti nome/cognome da una stringa completa in base al formato
        function parseFullName(fullName, format) {
            const parts = fullName.trim().split(/\s+/);
            // Se ha meno di 2 parti, ritorniamo tutto come nome per sicurezza, o gestiamo come errore
            if (parts.length < 2) return { nameParts: parts, surnameParts: [], full: fullName };

            let nameParts = [];
            let surnameParts = [];

            if (format === 'surname_first') {
                // FORMATO: COGNOME NOME (cerca nomi dalla fine)
                let splitIndex = -1;
                let i = parts.length - 1;
                let foundName = false;
                
                while (i > 0) {
                    if (isCommonName(parts[i])) {
                        foundName = true;
                        i--;
                    } else {
                        if (foundName) break;
                        break;
                    }
                }
                
                if (!foundName) {
                    splitIndex = parts.length - 1; // Fallback: ultimo è nome
                } else {
                    splitIndex = i + 1;
                }
                
                surnameParts = parts.slice(0, splitIndex);
                nameParts = parts.slice(splitIndex);

            } else {
                // FORMATO: NOME COGNOME (cerca nomi dall'inizio)
                let splitIndex = 1; 
                let i = 0;
                let foundName = false;

                while (i < parts.length - 1) {
                    if (isCommonName(parts[i])) {
                        foundName = true;
                        i++;
                    } else {
                        if (foundName) break;
                        break;
                    }
                }

                if (!foundName) {
                    splitIndex = 1; 
                } else {
                    splitIndex = i;
                }

                nameParts = parts.slice(0, splitIndex);
                surnameParts = parts.slice(splitIndex);
            }

            return { nameParts, surnameParts, full: fullName };
        }

        // --- GESTIONE VISUALIZZAZIONE NOMI ---

        let currentDisplayMode = 'surname_only'; // surname_only, name_only, surname_initial, name_initial, full
        
        const DISPLAY_MODES = [
            { id: 'surname_only', label: '👁️ Solo Cognomi' },
            { id: 'name_only', label: '👁️ Solo Nomi' },
            { id: 'surname_initial', label: '👁️ Cognome + Iniz.' },
            { id: 'name_initial', label: '👁️ Nome + Iniz.' },
            { id: 'full', label: '👁️ Completi' }
        ];

        function toggleDisplayMode() {
            // Trova indice corrente
            const currentIndex = DISPLAY_MODES.findIndex(m => m.id === currentDisplayMode);
            // Prossimo
            const nextIndex = (currentIndex + 1) % DISPLAY_MODES.length;
            currentDisplayMode = DISPLAY_MODES[nextIndex].id;
            
            // Aggiorna UI Tasto
            document.getElementById('btn-display-mode').innerText = DISPLAY_MODES[nextIndex].label;
            
            // Applica
            applyDisplayMode();
        }

        function applyDisplayMode() {
            const students = document.querySelectorAll('.student');
            if (students.length === 0) return;

            const simplify = document.getElementById('simplify-names').checked;

            // Rileva formato globale (per parsing corretto)
            // Usiamo i FullName salvati se possibile per l'analisi statistica, altrimenti innerText
            // Ma l'analisi statistica ha senso sulla lista completa originale. 
            // Se abbiamo già i dati salvati, possiamo usare parseFullName sul singolo elemento usando il formato 
            // che ricalcoliamo al volo o (meglio) ricalcoliamo su tutto il set di full names.
            
            const rawNames = Array.from(students).map(s => s.dataset.fullName || s.innerText);
            const format = detectListFormat(rawNames);

            students.forEach(s => {
                let sourceText = s.dataset.fullName;
                if (!sourceText) {
                    sourceText = s.innerText.trim();
                    s.dataset.fullName = sourceText;
                }

                const parsed = parseFullName(sourceText, format);
                let textToShow = "";

                // Funzione locale per ottenere la versione semplificata di un array di parti
                const getSmartPart = (parts) => {
                    if (!simplify || parts.length <= 1) return parts.join(" ");
                    
                    // Logica "Smart Abbreviate"
                    // Accumula token finché non trovi un NON-Prefisso
                    let result = [];
                    for (let token of parts) {
                        result.push(token);
                        // Se questo token NON è un prefisso, abbiamo finito il "primo" cognome
                        // (es. DE (pref) LA (pref) CRUZ (no-pref) -> Stop)
                        if (!SURNAME_PREFIXES.has(token) && !token.includes("'")) {
                            break;
                        }
                    }
                    return result.join(" ");
                };

                const getInitial = (parts) => {
                    if (parts.length === 0) return "";
                    return parts[0].charAt(0) + ".";
                };

                const surnameStr = getSmartPart(parsed.surnameParts);
                const nameStr = getSmartPart(parsed.nameParts); // Per i nomi vale stessa logica (es. Gian Marco -> Gian)
                
                // Nota: per i nomi propri la logica prefissi è meno rilevante ma non dannosa. 
                // "ANNA MARIA" -> ANNA non è prefisso -> Stop -> "ANNA". OK.
                
                const fullSurname = parsed.surnameParts.join(" ");
                const fullName = parsed.nameParts.join(" ");

                switch (currentDisplayMode) {
                    case 'surname_only':
                        textToShow = surnameStr;
                        break;
                    case 'name_only':
                        textToShow = nameStr;
                        break;
                    case 'surname_initial':
                        textToShow = surnameStr + " " + getInitial(parsed.nameParts);
                        break;
                    case 'name_initial':
                        textToShow = nameStr + " " + getInitial(parsed.surnameParts);
                        break;
                    case 'full':
                    default:
                        // Se simplify è on, mostriamo comunque tutto o semplifichiamo le parti?
                        // "Completi" di solito intende tutto. Ma se l'utente spunta "Abbrevia", forse vuole "Cognome1 Nome1"?
                        // Interpretiamo "Completi" come "Tutte le parti, senza tagli". 
                        // Ma se l'utente vuole Nome1 Cognome1?
                        // Facciamo che 'full' ignora simplify, mostra TUTTO originale.
                        // Se vuole Nome1 Cognome1 non c'è una modalità esplicita, ma Nome+Iniziale si avvicina.
                        // Modifica: Rispettiamo la logica dei tasti precedenti.
                        // Se simplify è attivo:
                        // Solo Cognomi -> Cognome1
                        // Solo Nomi -> Nome1
                        // Cognome+Iniz -> Cognome1 + N.
                        // Nome+Iniz -> Nome1 + C.
                        // Completi -> Tutto originale.
                        textToShow = parsed.surnameParts.join(" ") + " " + parsed.nameParts.join(" ");
                        // Ricostruzione nell'ordine originale? parseFullName ha diviso.
                        // Meglio usare sourceText se è Full
                        textToShow = sourceText;
                        break;
                }

                s.innerText = textToShow;
                fitText(s);
            });
            
            // La sidebar deve sempre mostrare il nome completo, quindi non la tocchiamo qui 
            // (renderSidebar usa dataset.fullName)
            // Ma se abbiamo appena fatto un import massivo, la sidebar potrebbe non essere aggiornata?
            // processBulkAdd chiama renderSidebar.
            // Qui stiamo solo cambiando visualizzazione banchi.
        }
    </script>
