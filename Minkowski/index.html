<html lang="it">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramma di Minkowski</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            overflow: hidden;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        #sidebar {
            width: 350px;
            background-color: #2a2a2a;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #sidebar h2 {
            margin-top: 0;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        #add-line-btn, #add-event-btn {
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #add-line-btn {
            background-color: #4CAF50;
        }

        #add-line-btn:hover {
            background-color: #45a049;
        }

        #add-event-btn {
            background-color: #ff9800;
        }

        #add-event-btn:hover {
            background-color: #f57c00;
        }

        .sidebar-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-bottom: 20px;
            gap: 10px;
        }

        .sidebar-header-actions #add-line-btn,
        .sidebar-header-actions #add-event-btn {
            margin-bottom: 0;
            flex-grow: 1;
        }

        .history-preset-stack {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-self: stretch;
            flex-shrink: 0;
        }

        .undo-redo-container {
            display: flex;
            gap: 5px;
            flex: 1;
            min-height: 0;
        }

        .undo-redo-container .icon-btn {
            flex: 1;
        }

        .icon-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.2rem;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-width: 0;
        }

        .icon-btn:hover:not(:disabled) {
            background-color: #555;
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .element-card {
            background-color: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 5px solid;
            position: relative;
        }

        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delete-btn {
            background: transparent;
            color: #ff5555;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
            padding: 0 5px;
        }
        .delete-btn:hover {
            color: #ff0000;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.9rem;
            justify-content: space-between;
        }

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .velocity-params {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 5px;
            font-size: 0.9rem;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #222;
            overflow: hidden;
        }

        .velocity-params-row {
            display: flex;
            align-items: stretch;
        }

        .velocity-params-row + .velocity-params-row {
            border-top: 1px solid #555;
        }

        .velocity-prime-rows {
            display: contents;
        }

        /* display:contents non rende la prima riga primata sibling DOM della riga β/γ */
        .velocity-prime-rows > .velocity-params-row:first-child {
            border-top: 1px solid #555;
        }

        .velocity-params-row > span {
            min-width: 0;
            padding: 6px 10px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* β = v/c = … è più lungo di γ = …: più spazio a sinistra */
        .velocity-params-row > span:first-child {
            flex: 1.7 1 0;
        }

        .velocity-params-row > span:last-child {
            flex: 1 1 0;
        }

        .velocity-params-row > span + span {
            border-left: 1px solid #555;
        }

        .velocity-params .inline-edit-input {
            width: 3em;
            max-width: 100%;
            padding: 0 2px;
            font-size: inherit;
            box-sizing: border-box;
        }

        .radio-switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.9rem;
        }

        .radio-switch-row > span {
            flex-shrink: 0;
        }

        .radio-switch {
            display: flex;
            position: relative;
            flex: 1;
            min-width: 0;
            background-color: #222;
            border: 1px solid #555;
            border-radius: 6px;
            overflow: hidden;
        }

        .radio-switch input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .radio-switch label {
            flex: 1;
            margin: 0 !important;
            padding: 5px 6px;
            text-align: center;
            justify-content: center !important;
            font-size: 0.8rem;
            cursor: pointer;
            color: #555;
            background: transparent;
            border: none;
            border-radius: 0;
            opacity: 0.45;
            transition: background-color 0.15s, color 0.15s, opacity 0.15s;
            user-select: none;
        }

        .radio-switch label:hover {
            color: #999;
            opacity: 0.7;
            background-color: rgba(255, 255, 255, 0.04);
        }

        .radio-switch input[type="radio"]:checked + label {
            background-color: #4a90d9;
            color: #fff;
            font-weight: 600;
            opacity: 1;
        }

        .radio-switch label + input[type="radio"] + label {
            border-left: 1px solid #555;
        }

        .state-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            margin: 0;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #222;
            color: #777;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
            user-select: none;
        }

        .state-toggle:hover {
            color: #bbb;
            background-color: #2a2a2a;
            border-color: #777;
        }

        .state-toggle .state-toggle-mark {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            border: 2px solid #666;
            border-radius: 3px;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .state-toggle .state-toggle-mark::after {
            content: '';
            width: 4px;
            height: 8px;
            border: solid transparent;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-0.5px, -0.5px);
            opacity: 0;
            transition: opacity 0.12s, border-color 0.12s;
        }

        .state-toggle .state-toggle-label {
            flex: 1;
            min-width: 0;
        }

        .state-toggle.is-on {
            background-color: #1e3a5f;
            border-color: #4a90d9;
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(74, 144, 217, 0.35);
        }

        .state-toggle.is-on:hover {
            background-color: #244a73;
            color: #fff;
            border-color: #5aa0e8;
        }

        .state-toggle.is-on .state-toggle-mark {
            border-color: #4a90d9;
            background-color: rgba(74, 144, 217, 0.15);
        }

        .state-toggle.is-on .state-toggle-mark::after {
            border-color: #4a90d9;
            opacity: 1;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .control-row div {
            display: flex;
            flex-direction: column;
        }

        .control-row input[type="number"] {
            width: 70px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 3px;
            padding: 4px;
        }

        .warning {
            color: #ffaa00;
            font-size: 0.8rem;
            display: none;
            margin-top: 5px;
        }

        .dep-hint {
            color: #ffcc66;
            font-size: 0.8rem;
            margin-top: 3px;
            display: none;
        }

        .editable-val {
            cursor: text;
            border-bottom: 1px dashed transparent;
            padding: 0 2px;
            border-radius: 2px;
        }

        .editable-val:hover {
            border-bottom-color: #aaa;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .inline-edit-input {
            width: 4.5em;
            background-color: #222;
            color: #fff;
            border: 1px solid #888;
            border-radius: 3px;
            padding: 1px 4px;
            font: inherit;
            font-size: 0.9rem;
            text-align: center;
        }

        .help-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 15px;
            text-align: center;
        }

        #context-menu {
            display: none;
            position: absolute;
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 5px 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-width: 150px;
        }

        .menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .menu-item:hover {
            background-color: #444;
        }

        .preset-menu-wrap {
            position: relative;
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .preset-menu-wrap #preset-btn {
            flex: 1;
            width: 100%;
        }

        #preset-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 5px 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);

        @media (max-width: 820px) {
            html, body, #app {
                height: 100dvh;
            }
            #app {
                flex-direction: column;
            }
            #canvas-container {
                flex: 1 1 auto;
                width: 100%;
                min-width: 0;
                min-height: 140px;
            }
            #sidebar {
                width: 100%;
                flex: 0 1 auto;
                max-height: 42vh;
                min-height: 0;
                border-left: none;

        @media (max-width: 820px) and (orientation: landscape) {
            #app {
                flex-direction: row;
            }
            #canvas-container {
                flex: 1 1 0;
                width: auto;
                min-width: 0;
            }
            #sidebar {
                flex: 0 0 min(320px, 42vw);

</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <canvas id="minkowski-canvas"></canvas>
            <div id="context-menu">
                <div class="menu-item" id="menu-create-event">Crea evento</div>
                <div class="menu-item" id="menu-create-line">Crea linea spazio-temporale</div>
            </div>
        </div>
        <div id="sidebar">
            <h2>Diagramma di Minkowski</h2>
            <!--<div class="help-text">Trascina con il tasto destro per creare una linea spazio-temporale.</div> -->
            <div class="sidebar-header-actions">
                <button id="add-line-btn">Crea linea spazio-temporale</button>
                <button id="add-event-btn">Crea evento</button>
                <div class="history-preset-stack">
                    <div class="preset-menu-wrap">
                        <button id="preset-btn" class="icon-btn" title="Preset">&#x1F4BE;</button>
                        <div id="preset-menu">
                            <div class="menu-item" id="menu-preset-twin">Twin</div>
                            <div class="menu-item" id="menu-preset-muone">Muone</div>
                            <div class="menu-item" id="menu-preset-treno">Treno</div>
                            <div class="menu-item" id="menu-preset-save">Salva</div>
                            <div class="menu-item" id="menu-preset-load">Carica</div>
                        </div>
                    </div>
                    <div class="undo-redo-container">
                        <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)" disabled>&#x21B6;</button>
                        <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Y)" disabled>&#x21B7;</button>
                    </div>
                </div>
            </div>
            <input type="file" id="preset-file-input" accept=".txt,text/plain" style="display:none">
            <div id="elements-list"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('minkowski-canvas');
        const ctx = canvas.getContext('2d');
        const sidebarList = document.getElementById('elements-list');
        const addBtn = document.getElementById('add-line-btn');
        const addEventBtn = document.getElementById('add-event-btn');

        // Use a longer minus (U+2212) in UI numbers — ASCII "-" looks too short
        const formatNum = (n, digits) => n.toFixed(digits).replace(/-/g, '\u2212');
        const toEditableNum = (n, digits) => n.toFixed(digits);

        let activeInlineEdit = null;
        let inlineEditLock = false;

        const colors = ['#ff5555', '#55ff55', '#5555ff', '#ffff55', '#ff55ff', '#55ffff', '#ffaa55', '#55aaff'];
        let colorIndex = 0;
        
        const eventColors = ['#ff9900', '#00ffcc', '#cc00ff', '#aaff00', '#ff00aa', '#00aaff', '#ffffff'];
        let eventColorIndex = 0;

        let elements = [];
        let nextId = 1;
        let focusedElementId = null;

        let view = {
            x: 0,
            t: 0,
            scale: 50
        };

        let currentAnimatedFrame = null;
        let animationTargetEl = null;
        let animationStartFrame = null;
        let animationStartTime = null;
        const ANIMATION_DURATION = 1000;

        let currentHoverSnap = null;
        let contextMenuSnap = null;
        
        let isCreatingLineClick = false;
        let lineClickStart = null;
        let lineClickCurrent = null;

        let isCreatingLineDrag = false;
        let lineDragStart = null;
        let lineDragCurrent = null;

        let isDraggingVelocityForEl = null;

        // Range in cui i calcoli del sistema proprio sono sospesi (|v| ≈ 1)
        const LIGHTLIKE_V_EPS = 0.005;
        const ENDPOINT_INF = 1e5;

        let history = [];
        let historyIndex = -1;

        function isNearLightSpeed(v) {
            return Number.isFinite(v) && Math.abs(Math.abs(v) - 1) < LIGHTLIKE_V_EPS;
        }

        function getLineVelocity(el) {
            let dt = el.t2 - el.t1;
            let dx = el.x2 - el.x1;
            if (Math.abs(dt) > 1e-15) return dx / dt;
            return dx > 0 ? Infinity : -Infinity;
        }

        function syncPreservedProperFromGeometry(el) {
            if (!el || el.type !== 'line') return;
            let dx = el.x2 - el.x1;
            let dt = el.t2 - el.t1;
            let I = dx * dx - dt * dt;
            let v = getLineVelocity(el);
            if (el.endpointAtInfinity || isNearLightSpeed(v) || Math.abs(I) < 1e-9) return;
            el.preservedProperAbs = Math.sqrt(Math.abs(I));
            el.preservedSignDt = dt >= 0 ? 1 : -1;
            el.preservedProperKind = I < 0 ? 'tau' : 'L0';
        }

        function placeEndpointAtInfinity(el, v, signDt) {
            const sDt = signDt >= 0 ? 1 : -1;
            let vv = v;
            if (!Number.isFinite(vv)) vv = vv > 0 ? 1 : -1;
            // Direzione del moto a velocità v; il 2° estremo resta fuori schermo
            el.x2 = el.x1 + vv * sDt * ENDPOINT_INF;
            el.t2 = el.t1 + sDt * ENDPOINT_INF;
            el.endpointAtInfinity = true;
            el.preservedSignDt = sDt;
        }

        function saveState() {
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            
            history.push({
                elements: JSON.parse(JSON.stringify(elements)),
                nextId: nextId,
                colorIndex: colorIndex,
                eventColorIndex: eventColorIndex,
                focusedElementId: focusedElementId
            });
            
            if (history.length > 50) {
                history.shift();
            } else {
                historyIndex++;
            }
            updateUndoRedoButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                draggingTarget = null;
                didChangeDuringDrag = false;
                restoreState();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                draggingTarget = null;
                didChangeDuringDrag = false;
                restoreState();
            }
        }

        function restoreState() {
            const state = history[historyIndex];
            
            // Mantieni le opzioni di visualizzazione attuali per gli elementi che esistono ancora
            const currentViewOptions = {};
            elements.forEach(el => {
                currentViewOptions[el.id] = {
                    showAxes: el.showAxes,
                    viewRestFrame: el.viewRestFrame,
                    showLightCone: el.showLightCone,
                    expanded: el.expanded
                };
            });

            elements = JSON.parse(JSON.stringify(state.elements));
            
            elements.forEach(el => {
                if (currentViewOptions[el.id]) {
                    if (currentViewOptions[el.id].showAxes !== undefined) el.showAxes = currentViewOptions[el.id].showAxes;
                    if (currentViewOptions[el.id].viewRestFrame !== undefined) el.viewRestFrame = currentViewOptions[el.id].viewRestFrame;
                    if (currentViewOptions[el.id].showLightCone !== undefined) el.showLightCone = currentViewOptions[el.id].showLightCone;
                    if (currentViewOptions[el.id].expanded !== undefined) el.expanded = currentViewOptions[el.id].expanded;
                }
            });

            nextId = state.nextId;
            colorIndex = state.colorIndex;
            eventColorIndex = state.eventColorIndex;
            focusedElementId = state.focusedElementId;
            
            // Aggiorna l'animazione se il sistema di riposo è attivo
            animationTargetEl = elements.find(el => el.viewRestFrame) || null;
            if (animationTargetEl) {
                animationStartTime = null; // Forza il rendering immediato sul target
                let v = 0, x0 = 0, t0 = 0;
                if (animationTargetEl.type === 'line') {
                    let dt = animationTargetEl.t2 - animationTargetEl.t1;
                    let dx = animationTargetEl.x2 - animationTargetEl.x1;
                    if (Math.abs(dt) > 1e-9) v = dx / dt;
                    else v = dx > 0 ? Infinity : -Infinity;
                    let u = Math.abs(v) < 1.0 ? v : (Math.abs(v) > 1.0 ? 1/v : 0);
                    v = u;
                    x0 = animationTargetEl.x1;
                    t0 = animationTargetEl.t1;
                }
                currentAnimatedFrame = { v: v, x0: x0, t0: t0 };
            } else {
                currentAnimatedFrame = null;
            }

            sidebarList.innerHTML = '';
            activeInlineEdit = null;
            inlineEditLock = false;
            elements.forEach(el => createElementSidebar(el));
            updateSidebarUI();
            draw();
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            if (undoBtn) undoBtn.disabled = historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = historyIndex >= history.length - 1;
        }

        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('redo-btn').addEventListener('click', redo);

        function formatCoord(n) {
            if (!Number.isFinite(n)) return String(n);
            const s = Math.abs(n) < 1e-12 ? '0' : String(Number(n.toPrecision(10)));
            return s;
        }

        function serializePointDep(dep) {
            if (!dep) return '';
            if (dep.type === 'fixed') return `fixed:${formatCoord(dep.x)},${formatCoord(dep.t)}`;
            if (dep.type === 'event') return `event:${dep.elId}`;
            if (dep.type === 'movement_point') {
                const kind = dep.pointType === 'movement_end' ? 'movement_end' : 'movement_start';
                return `${kind}:${dep.elId}`;
            }
            if (dep.type === 'intersection' && dep.lines && dep.lines.length === 2) {
                const a = dep.lines[0];
                const b = dep.lines[1];
                return `intersection(${a.lineType}:${a.elId},${b.lineType}:${b.elId})`;
            }
            return '';
        }

        function serializeLineDep(dep) {
            if (!dep) return null;
            if (dep.type === 'start_point') {
                return `start_point ${serializePointDep(dep.pt)}`;
            }
            if (dep.type === 'points') {
                return `points p1=${serializePointDep(dep.p1)} p2=${serializePointDep(dep.p2)}`;
            }
            // Event-style deps accidentally on a line
            const token = serializePointDep(dep);
            return token || null;
        }

        function serializeScene() {
            const lines = [];
            lines.push('# MinkowskiPreset');
            lines.push(`nextId: ${nextId}`);
            lines.push(`colorIndex: ${colorIndex}`);
            lines.push(`eventColorIndex: ${eventColorIndex}`);
            lines.push('');

            elements.forEach(el => {
                if (el.type === 'line') {
                    const flags = [
                        `id=${el.id}`,
                        `limited=${el.limited === true}`,
                        `visible=${el.visible !== false}`,
                        `color=${el.color}`
                    ];
                    if (el.showAxes) flags.push('showAxes=true');
                    if (el.viewRestFrame) flags.push('viewRestFrame=true');
                    if (el.endpointAtInfinity) flags.push('endpointAtInfinity=true');
                    if (el.preservedProperAbs !== undefined) flags.push(`preservedProperAbs=${formatCoord(el.preservedProperAbs)}`);
                    if (el.preservedProperKind) flags.push(`preservedProperKind=${el.preservedProperKind}`);
                    if (el.preservedSignDt !== undefined) flags.push(`preservedSignDt=${el.preservedSignDt}`);
                    lines.push(`LINE ${flags.join(' ')}`);
                    lines.push(`  start: ${formatCoord(el.x1)}, ${formatCoord(el.t1)}`);
                    lines.push(`  end: ${formatCoord(el.x2)}, ${formatCoord(el.t2)}`);
                    if (el.dependencies) {
                        const depStr = serializeLineDep(el.dependencies);
                        if (depStr) lines.push(`  dep: ${depStr}`);
                    }
                    lines.push('');
                } else if (el.type === 'event') {
                    const flags = [
                        `id=${el.id}`,
                        `visible=${el.visible !== false}`,
                        `color=${el.color}`,
                        `showLightCone=${el.showLightCone === true}`
                    ];
                    lines.push(`EVENT ${flags.join(' ')}`);
                    lines.push(`  at: ${formatCoord(el.x)}, ${formatCoord(el.t)}`);
                    if (el.dependencies) {
                        const depStr = serializePointDep(el.dependencies);
                        if (depStr) lines.push(`  dep: ${depStr}`);
                    }
                    lines.push('');
                }
            });

            return lines.join('\n').trim() + '\n';
        }

        function parsePointDep(token) {
            if (!token) return null;
            token = token.trim();
            let m = token.match(/^fixed:([-\d.eE+]+),([-\d.eE+]+)$/);
            if (m) return { type: 'fixed', x: parseFloat(m[1]), t: parseFloat(m[2]) };
            m = token.match(/^event:(\d+)$/);
            if (m) return { type: 'event', elId: parseInt(m[1], 10) };
            m = token.match(/^movement_start:(\d+)$/);
            if (m) return { type: 'movement_point', elId: parseInt(m[1], 10), pointType: 'movement_start' };
            m = token.match(/^movement_end:(\d+)$/);
            if (m) return { type: 'movement_point', elId: parseInt(m[1], 10), pointType: 'movement_end' };
            m = token.match(/^intersection\(([^:]+):(\d+),([^:]+):(\d+)\)$/);
            if (m) {
                return {
                    type: 'intersection',
                    lines: [
                        { lineType: m[1], elId: parseInt(m[2], 10) },
                        { lineType: m[3], elId: parseInt(m[4], 10) }
                    ]
                };
            }
            throw new Error(`Dipendenza punto non valida: ${token}`);
        }

        function parseLineDep(rest) {
            rest = rest.trim();
            if (rest.startsWith('start_point ')) {
                return { type: 'start_point', pt: parsePointDep(rest.slice('start_point '.length).trim()) };
            }
            if (rest.startsWith('points ')) {
                const p1m = rest.match(/\bp1=(\S+)/);
                const p2m = rest.match(/\bp2=(\S+)/);
                if (!p1m || !p2m) throw new Error(`Dipendenza points incompleta: ${rest}`);
                return {
                    type: 'points',
                    p1: parsePointDep(p1m[1]),
                    p2: parsePointDep(p2m[1])
                };
            }
            // bare point dep
            return parsePointDep(rest);
        }

        function parseFlags(flagStr) {
            const flags = {};
            const re = /(\w+)=(\S+)/g;
            let m;
            while ((m = re.exec(flagStr)) !== null) {
                flags[m[1]] = m[2];
            }
            return flags;
        }

        function parseBool(v, fallback) {
            if (v === undefined) return fallback;
            return v === 'true' || v === '1';
        }

        function parseScene(text) {
            const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            let parsedNextId = null;
            let parsedColorIndex = 0;
            let parsedEventColorIndex = 0;
            const parsedElements = [];
            let current = null;

            function finishCurrent() {
                if (!current) return;
                if (current.type === 'line') {
                    if (current.x1 === undefined || current.t1 === undefined || current.x2 === undefined || current.t2 === undefined) {
                        throw new Error(`LINE ${current.id}: mancano start/end`);
                    }
                } else if (current.type === 'event') {
                    if (current.x === undefined || current.t === undefined) {
                        throw new Error(`EVENT ${current.id}: manca at`);
                    }
                }
                parsedElements.push(current);
                current = null;
            }

            for (let i = 0; i < rawLines.length; i++) {
                const raw = rawLines[i];
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;

                let m = line.match(/^nextId:\s*(\d+)$/i);
                if (m) { parsedNextId = parseInt(m[1], 10); continue; }
                m = line.match(/^colorIndex:\s*(\d+)$/i);
                if (m) { parsedColorIndex = parseInt(m[1], 10); continue; }
                m = line.match(/^eventColorIndex:\s*(\d+)$/i);
                if (m) { parsedEventColorIndex = parseInt(m[1], 10); continue; }

                if (line.startsWith('LINE ')) {
                    finishCurrent();
                    const flags = parseFlags(line.slice(5));
                    if (!flags.id) throw new Error(`LINE senza id (riga ${i + 1})`);
                    current = {
                        id: parseInt(flags.id, 10),
                        type: 'line',
                        color: flags.color || colors[0],
                        limited: parseBool(flags.limited, false),
                        expanded: true,
                        visible: parseBool(flags.visible, true),
                        showAxes: parseBool(flags.showAxes, false),
                        viewRestFrame: parseBool(flags.viewRestFrame, false),
                        isValid: true
                    };
                    if (parseBool(flags.endpointAtInfinity, false)) current.endpointAtInfinity = true;
                    if (flags.preservedProperAbs !== undefined) current.preservedProperAbs = parseFloat(flags.preservedProperAbs);
                    if (flags.preservedProperKind) current.preservedProperKind = flags.preservedProperKind;
                    if (flags.preservedSignDt !== undefined) current.preservedSignDt = parseInt(flags.preservedSignDt, 10);
                    continue;
                }

                if (line.startsWith('EVENT ')) {
                    finishCurrent();
                    const flags = parseFlags(line.slice(6));
                    if (!flags.id) throw new Error(`EVENT senza id (riga ${i + 1})`);
                    current = {
                        id: parseInt(flags.id, 10),
                        type: 'event',
                        color: flags.color || eventColors[0],
                        expanded: true,
                        visible: parseBool(flags.visible, true),
                        showLightCone: parseBool(flags.showLightCone, false),
                        isValid: true
                    };
                    continue;
                }

                if (!current) throw new Error(`Riga fuori da un elemento (riga ${i + 1}): ${line}`);

                m = line.match(/^start:\s*([-\d.eE+]+)\s*,\s*([-\d.eE+]+)$/i);
                if (m) {
                    current.x1 = parseFloat(m[1]);
                    current.t1 = parseFloat(m[2]);
                    continue;
                }
                m = line.match(/^end:\s*([-\d.eE+]+)\s*,\s*([-\d.eE+]+)$/i);
                if (m) {
                    current.x2 = parseFloat(m[1]);
                    current.t2 = parseFloat(m[2]);
                    continue;
                }
                m = line.match(/^at:\s*([-\d.eE+]+)\s*,\s*([-\d.eE+]+)$/i);
                if (m) {
                    current.x = parseFloat(m[1]);
                    current.t = parseFloat(m[2]);
                    continue;
                }
                m = line.match(/^dep:\s*(.+)$/i);
                if (m) {
                    if (current.type === 'line') current.dependencies = parseLineDep(m[1]);
                    else current.dependencies = parsePointDep(m[1].trim());
                    continue;
                }

                throw new Error(`Riga non riconosciuta (riga ${i + 1}): ${line}`);
            }
            finishCurrent();

            if (parsedElements.length === 0) throw new Error('Nessun elemento nel file');

            const maxId = parsedElements.reduce((mx, el) => Math.max(mx, el.id), 0);
            if (parsedNextId === null || parsedNextId <= maxId) parsedNextId = maxId + 1;

            return {
                elements: parsedElements,
                nextId: parsedNextId,
                colorIndex: parsedColorIndex,
                eventColorIndex: parsedEventColorIndex,
                focusedElementId: null
            };
        }

        function applyScene(state, options) {
            const pushHistory = !options || options.pushHistory !== false;

            draggingTarget = null;
            didChangeDuringDrag = false;
            activeInlineEdit = null;
            inlineEditLock = false;
            focusedElementId = state.focusedElementId != null ? state.focusedElementId : null;

            elements = JSON.parse(JSON.stringify(state.elements));
            nextId = state.nextId;
            colorIndex = state.colorIndex != null ? state.colorIndex : 0;
            eventColorIndex = state.eventColorIndex != null ? state.eventColorIndex : 0;

            animationTargetEl = elements.find(el => el.viewRestFrame) || null;
            if (animationTargetEl) {
                animationStartTime = null;
                let v = 0, x0 = 0, t0 = 0;
                if (animationTargetEl.type === 'line') {
                    let dt = animationTargetEl.t2 - animationTargetEl.t1;
                    let dx = animationTargetEl.x2 - animationTargetEl.x1;
                    if (Math.abs(dt) > 1e-9) v = dx / dt;
                    else v = dx > 0 ? Infinity : -Infinity;
                    let u = Math.abs(v) < 1.0 ? v : (Math.abs(v) > 1.0 ? 1 / v : 0);
                    v = u;
                    x0 = animationTargetEl.x1;
                    t0 = animationTargetEl.t1;
                }
                currentAnimatedFrame = { v: v, x0: x0, t0: t0 };
            } else {
                currentAnimatedFrame = null;
            }

            updateDependencies();

            sidebarList.innerHTML = '';
            elements.forEach(el => createElementSidebar(el));
            updateSidebarUI();
            draw();

            if (pushHistory) saveState();
            else updateUndoRedoButtons();
        }

        function buildTwinPreset() {
            const c0 = colors[0];
            const c1 = colors[1 % colors.length];
            const c2 = colors[2 % colors.length];
            return {
                elements: [
                    {
                        id: 1,
                        type: 'line',
                        x1: 0, t1: 0,
                        x2: 3, t2: 5,

                        expanded: true,
                        visible: true,
                        showAxes: false,
                        viewRestFrame: false,
                        isValid: true
                    },
                    {
                        id: 2,
                        type: 'line',
                        x1: 3, t1: 5,
                        x2: 0, t2: 10,
                        color: c1,
                        limited: true,
                        expanded: true,
                        visible: true,
                        showAxes: false,
                        viewRestFrame: false,
                        isValid: true,
                        dependencies: {
                            type: 'start_point',
                            pt: { type: 'movement_point', elId: 1, pointType: 'movement_end' }
                        }
                    },
                    {
                        id: 3,
                        type: 'line',
                        x1: 0, t1: 0,
                        x2: 0, t2: 10,
                        color: c2,
                        limited: true,
                        expanded: true,
                        visible: true,
                        showAxes: false,
                        viewRestFrame: false,
                        isValid: true,
                        dependencies: {
                            type: 'points',
                            p1: { type: 'movement_point', elId: 1, pointType: 'movement_start' },
                            p2: { type: 'movement_point', elId: 2, pointType: 'movement_end' }
                        }
                    }
                ],
                nextId: 4,
                colorIndex: 3,
                eventColorIndex: 0,
                focusedElementId: null
            };
        }

        const MUONE_PRESET_TEXT = `# MinkowskiPreset
nextId: 4
colorIndex: 3
eventColorIndex: 0

LINE id=1 limited=false visible=true color=#ff5555 preservedProperAbs=0.7742893278 preservedProperKind=tau preservedSignDt=1
  start: 0, 0
  end: 0, 0.7742893278

  start: 4, 0

  start: 0, 0
  end: 4, 5

        const TRENO_PRESET_TEXT = `# MinkowskiPreset
nextId: 10
colorIndex: 5
eventColorIndex: 4

LINE id=1 limited=false visible=true color=#ff5555 preservedProperAbs=0.7742893278 preservedProperKind=tau preservedSignDt=1
  start: 0, 0
  end: 0.1580511472, 0.790255736

LINE id=4 limited=false visible=true color=#ffff55 preservedProperAbs=0.8891613869 preservedProperKind=tau preservedSignDt=1
  start: 4, 0
  end: 4.181499308, 0.9074965404

LINE id=5 limited=false visible=true color=#ff55ff preservedProperAbs=0.9592480596 preservedProperKind=tau preservedSignDt=1
  start: 8, 0
  end: 8.19580569, 0.9790284512

EVENT id=6 visible=true color=#ff9900 showLightCone=true
  at: 0, 0

EVENT id=7 visible=true color=#00ffcc showLightCone=true
  at: 8, 0

EVENT id=8 visible=true color=#cc00ff showLightCone=false
  at: 4.666666667, 3.333333333
  dep: intersection(line:4,lightcone_left:7)

EVENT id=9 visible=true color=#aaff00 showLightCone=false
  at: 5, 5
  dep: intersection(line:4,lightcone_right:6)
`;

        function buildMuonePreset() {
            return parseScene(MUONE_PRESET_TEXT);
        }

        function buildTrenoPreset() {
            return parseScene(TRENO_PRESET_TEXT);
        }

        function downloadPresetFile(text) {
            let n = parseInt(localStorage.getItem('minkowskiPresetCounter') || '0', 10);
            if (!Number.isFinite(n) || n < 0) n = 0;
            n += 1;
            localStorage.setItem('minkowskiPresetCounter', String(n));
            const filename = `MinkowskiPreset#${n}.txt`;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        const presetBtn = document.getElementById('preset-btn');
        const presetMenu = document.getElementById('preset-menu');
        const presetFileInput = document.getElementById('preset-file-input');

        function closePresetMenu() {
            presetMenu.style.display = 'none';
        }

        presetBtn.addEventListener('click', e => {
            e.stopPropagation();
            const open = presetMenu.style.display === 'block';
            presetMenu.style.display = open ? 'none' : 'block';

        });

        document.getElementById('menu-preset-treno').addEventListener('click', e => {

        });

        document.getElementById('menu-preset-save').addEventListener('click', e => {

        });

        document.getElementById('menu-preset-load').addEventListener('click', e => {

            presetFileInput.click();
        });

        presetFileInput.addEventListener('change', () => {
            const file = presetFileInput.files && presetFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const state = parseScene(String(reader.result || ''));
                    applyScene(state, { pushHistory: true });
                } catch (err) {
                    alert('Impossibile caricare il preset:\n' + (err && err.message ? err.message : String(err)));
                }
            };
            reader.onerror = () => {
                alert('Errore nella lettura del file.');
            };

        });

        document.addEventListener('click', e => {
            if (!presetMenu.contains(e.target) && e.target !== presetBtn) {

        window.addEventListener('keydown', e => {
            if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
            } else if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                redo(); // Some applications use Ctrl+Shift+Z for redo
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (isTypingTarget(e.target)) return;
                if (focusedElementId === null) return;
                e.preventDefault();
                deleteElementById(focusedElementId);
            }
        });

        const contextMenu = document.getElementById('context-menu');
        const menuCreateEvent = document.getElementById('menu-create-event');
        const menuCreateLine = document.getElementById('menu-create-line');

        function updateAnimation(timestamp) {
            if (animationStartTime === null) return;
            
            let progress = (timestamp - animationStartTime) / ANIMATION_DURATION;
            if (progress >= 1) {
                progress = 1;
                animationStartTime = null;
                currentAnimatedFrame = null;
            } else {
                let ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                let startV = animationStartFrame ? animationStartFrame.v : 0;
                let startX0 = animationStartFrame ? animationStartFrame.x0 : 0;
                let startT0 = animationStartFrame ? animationStartFrame.t0 : 0;
                
                let endV = 0, endX0 = 0, endT0 = 0;
                if (animationTargetEl) {
                    let v = 0, x0 = 0, t0 = 0;
                    if (animationTargetEl.type === 'line') {
                        let dt = animationTargetEl.t2 - animationTargetEl.t1;
                        let dx = animationTargetEl.x2 - animationTargetEl.x1;
                        if (Math.abs(dt) > 1e-9) v = dx / dt;
                        else v = dx > 0 ? Infinity : -Infinity;
                        x0 = animationTargetEl.x1;
                        t0 = animationTargetEl.t1;
                    }
                    let targetU = 0;
                    if (Math.abs(v) < 1.0) targetU = v;
                    else if (Math.abs(v) > 1.0) targetU = 1/v;

                    if (Math.abs(targetU) < 1.0) {
                        endV = targetU;
                        endX0 = x0;
                        endT0 = t0;
                    }
                }

                let startPhi = Math.atanh(startV);
                let endPhi = Math.atanh(endV);
                let currentPhi = startPhi + (endPhi - startPhi) * ease;

                currentAnimatedFrame = {
                    v: Math.tanh(currentPhi),
                    x0: startX0 + (endX0 - startX0) * ease,
                    t0: startT0 + (endT0 - startT0) * ease
                };
            }
            
            draw();
            
            if (animationStartTime !== null) {
                requestAnimationFrame(updateAnimation);
            }
        }

        function getDisplayFrameV() {
            if (animationStartTime !== null && currentAnimatedFrame) {
                return currentAnimatedFrame;
            }
            let restEl = elements.find(e => e.viewRestFrame && e.isValid !== false);
            if (restEl) {
                let v = (restEl.x2 - restEl.x1) / (restEl.t2 - restEl.t1);
                let u = Math.abs(v) < 1.0 ? v : (v !== 0 ? 1/v : 0);
                
                return { v: u, x0: restEl.x1, t0: restEl.t1 };
            }
            return null;
        }

        function getActiveRestFrameElement() {
            return elements.find(e => e.type === 'line' && e.viewRestFrame && e.isValid !== false) || null;
        }

        // Sistemi di riferimento per cui mostrare i dati primati: rest frame e/o assi.
        // Basta una delle due opzioni; entrambe sullo stesso oggetto ⇒ una sola riga.
        function getActivePrimeFrameElements() {
            return elements.filter(e =>
                e.type === 'line' &&
                e.isValid !== false &&
                (e.viewRestFrame || e.showAxes)
            );
        }

        function getRestFrameBoostVelocity(restEl) {
            if (!restEl) return null;
            const dt = restEl.t2 - restEl.t1;
            const dx = restEl.x2 - restEl.x1;
            let v = dt !== 0 ? dx / dt : (dx > 0 ? Infinity : -Infinity);
            if (!Number.isFinite(v)) return 0;
            return Math.abs(v) < 1.0 ? v : (v !== 0 ? 1 / v : 0);
        }

        // Trasforma β = dx/dt dal lab al sistema boostato con velocità u (|u|<1)
        function boostBeta(beta, u) {
            if (!Number.isFinite(u)) return beta;
            if (!Number.isFinite(beta)) {
                // lim |β|→∞ di (β−u)/(1−uβ) = −1/u; se u≈0 resta ±∞
                if (Math.abs(u) < 1e-12) return beta;
                return -1 / u;
            }
            const denom = 1 - u * beta;
            if (Math.abs(denom) < 1e-12) {
                const num = beta - u;
                if (Math.abs(num) < 1e-12) return 0;
                return num > 0 ? Infinity : -Infinity;
            }
            return (beta - u) / denom;
        }

        function formatBetaText(beta, fallbackSign) {
            if (beta === Infinity) return '+∞';
            if (beta === -Infinity) return '\u2212∞';
            if (!Number.isFinite(beta)) return fallbackSign >= 0 ? '+∞' : '\u2212∞';
            return formatNum(beta, 3);
        }

        function labToRestCoords(x, t, restEl) {
            if (!restEl) return null;
            const u = getRestFrameBoostVelocity(restEl);
            if (u == null) return null;
            return mapDisplayToFrame(x, t, null, { v: u, x0: restEl.x1, t0: restEl.t1 });
        }

        let draggingTarget = null;
        let currentHoverTarget = null;
        let isPanning = false;
        let startPan = { x: 0, y: 0 };
        let startView = { x: 0, t: 0 };

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        function screenToMathX(sx) { return (sx - canvas.width / 2) / view.scale + view.x; }
        function screenToMathY(sy) { return (canvas.height / 2 - sy) / view.scale + view.t; }
        function mathToScreenX(mx) { return (mx - view.x) * view.scale + canvas.width / 2; }
        function mathToScreenY(mt) { return canvas.height / 2 - (mt - view.t) * view.scale; }

        function mapFrameToDisplay(xg, tg, frameG, frameV) {
            let xa = xg, ta = tg;
            if (frameG) {
                let v = frameG.v;
                if (v > 0.9995) v = 0.9995;
                if (v < -0.9995) v = -0.9995;
                let gammaG = 1 / Math.sqrt(1 - v * v);
                xa = frameG.x0 + gammaG * (xg + v * tg);
                ta = frameG.t0 + gammaG * (tg + v * xg);
            }
            let xd = xa, td = ta;
            if (frameV) {
                let v = frameV.v;
                if (v > 0.9995) v = 0.9995;
                if (v < -0.9995) v = -0.9995;
                let gammaV = 1 / Math.sqrt(1 - v * v);
                let dx = xa - frameV.x0;
                let dt = ta - frameV.t0;
                xd = gammaV * (dx - v * dt);
                td = gammaV * (dt - v * dx);
            }
            return { x: xd, t: td };
        }

        function mapDisplayToFrame(xd, td, frameV, frameG) {
            let xa = xd, ta = td;
            if (frameV) {
                let v = frameV.v;
                if (v > 0.9995) v = 0.9995;
                if (v < -0.9995) v = -0.9995;
                let gammaV = 1 / Math.sqrt(1 - v * v);
                xa = frameV.x0 + gammaV * (xd + v * td);
                ta = frameV.t0 + gammaV * (td + v * xd);
            }
            let xg = xa, tg = ta;
            if (frameG) {
                let v = frameG.v;
                if (v > 0.9995) v = 0.9995;
                if (v < -0.9995) v = -0.9995;
                let gammaG = 1 / Math.sqrt(1 - v * v);
                let dx = xa - frameG.x0;
                let dt = ta - frameG.t0;
                xg = gammaG * (dx - v * dt);
                tg = gammaG * (dt - v * dx);
            }
            return { x: xg, t: tg };
        }

        function drawFrameGrid(frameG, frameV, isMain, drawGridLines) {
            let isLightlike = frameG && Math.abs(Math.abs(frameG.v) - 1.0) < 0.005;
            let isViewLightlike = frameV && Math.abs(Math.abs(frameV.v) - 1.0) < 0.005;
            
            const axisColor = isMain ? '#aaa' : (frameG ? frameG.color + 'aa' : '#aaa');

            if (isLightlike || isViewLightlike) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = axisColor;
                
                let large = 1e5;
                
                let x0 = frameG ? frameG.x0 : 0;
                let t0 = frameG ? frameG.t0 : 0;
                let v = frameG ? frameG.v : 0;
                
                // ct' axis (x = x0 + v*(t - t0))
                ctx.beginPath();
                let p1T = mapFrameToDisplay(x0 - v * large, t0 - large, null, frameV);
                let p2T = mapFrameToDisplay(x0 + v * large, t0 + large, null, frameV);
                ctx.moveTo(mathToScreenX(p1T.x), mathToScreenY(p1T.t));
                ctx.lineTo(mathToScreenX(p2T.x), mathToScreenY(p2T.t));
                ctx.stroke();
                
                // x' axis (t = t0 + v*(x - x0))
                ctx.beginPath();
                let p1X = mapFrameToDisplay(x0 - large, t0 - v * large, null, frameV);
                let p2X = mapFrameToDisplay(x0 + large, t0 + v * large, null, frameV);
                ctx.moveTo(mathToScreenX(p1X.x), mathToScreenY(p1X.t));
                ctx.lineTo(mathToScreenX(p2X.x), mathToScreenY(p2X.t));
                ctx.stroke();
                
                return;
            }

            if (drawGridLines === undefined) drawGridLines = true;
            
            const cornersScreen = [
                { sx: 0, sy: 0 },
                { sx: canvas.width, sy: 0 },
                { sx: 0, sy: canvas.height },
                { sx: canvas.width, sy: canvas.height }
            ];
            
            let minXg = Infinity, maxXg = -Infinity;
            let minTg = Infinity, maxTg = -Infinity;
            
            for (let c of cornersScreen) {
                let xd = screenToMathX(c.sx);
                let td = screenToMathY(c.sy);
                let g = mapDisplayToFrame(xd, td, frameV, frameG);
                if (g.x < minXg) minXg = g.x;
                if (g.x > maxXg) maxXg = g.x;
                if (g.t < minTg) minTg = g.t;
                if (g.t > maxTg) maxTg = g.t;
            }
            
            minXg = Math.floor(minXg) - 1;
            maxXg = Math.ceil(maxXg) + 1;
            minTg = Math.floor(minTg) - 1;
            maxTg = Math.ceil(maxTg) + 1;
            
            let rawStep = 50 / view.scale;
            let power = Math.round(Math.log2(rawStep));
            let step = Math.pow(2, power);
            
            minXg = Math.floor(minXg / step) * step;
            minTg = Math.floor(minTg / step) * step;

            const gridColor = isMain ? '#333' : (frameG ? frameG.color + '44' : '#333');
            
            ctx.lineWidth = 1;
            
            if (drawGridLines) {
                for (let x = minXg; x <= maxXg; x += step) {
                    if (Math.abs(x) < 1e-6) continue;
                    ctx.strokeStyle = gridColor;
                    ctx.beginPath();
                    let p1 = mapFrameToDisplay(x, minTg, frameG, frameV);
                    let p2 = mapFrameToDisplay(x, maxTg, frameG, frameV);
                    ctx.moveTo(mathToScreenX(p1.x), mathToScreenY(p1.t));
                    ctx.lineTo(mathToScreenX(p2.x), mathToScreenY(p2.t));
                    ctx.stroke();
                }
                
                for (let t = minTg; t <= maxTg; t += step) {
                    if (Math.abs(t) < 1e-6) continue;
                    ctx.strokeStyle = gridColor;
                    ctx.beginPath();
                    let p1 = mapFrameToDisplay(minXg, t, frameG, frameV);
                    let p2 = mapFrameToDisplay(maxXg, t, frameG, frameV);
                    ctx.moveTo(mathToScreenX(p1.x), mathToScreenY(p1.t));
                    ctx.lineTo(mathToScreenX(p2.x), mathToScreenY(p2.t));
                    ctx.stroke();
                }
            }
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = axisColor;
            
            ctx.beginPath();
            let p1T = mapFrameToDisplay(0, minTg, frameG, frameV);
            let p2T = mapFrameToDisplay(0, maxTg, frameG, frameV);
            ctx.moveTo(mathToScreenX(p1T.x), mathToScreenY(p1T.t));
            ctx.lineTo(mathToScreenX(p2T.x), mathToScreenY(p2T.t));
            ctx.stroke();
            
            ctx.beginPath();
            let p1X = mapFrameToDisplay(minXg, 0, frameG, frameV);
            let p2X = mapFrameToDisplay(maxXg, 0, frameG, frameV);
            ctx.moveTo(mathToScreenX(p1X.x), mathToScreenY(p1X.t));
            ctx.lineTo(mathToScreenX(p2X.x), mathToScreenY(p2X.t));
            ctx.stroke();
            
            ctx.fillStyle = axisColor;
            ctx.font = '12px Arial';
            
            function drawTick(xg, tg, isXAxis) {
                let pCenter = mapFrameToDisplay(xg, tg, frameG, frameV);
                let cx = mathToScreenX(pCenter.x);
                let cy = mathToScreenY(pCenter.t);
                
                // Direction along the axis in screen space, then rotate 90°
                // so ticks are Euclidean-perpendicular to the oblique axis.
                let pAlong = mapFrameToDisplay(
                    isXAxis ? xg + 1 : xg,
                    isXAxis ? tg : tg + 1,
                    frameG, frameV
                );
                let ax = mathToScreenX(pAlong.x) - cx;
                let ay = mathToScreenY(pAlong.t) - cy;
                let dx = -ay;
                let dy = ax;
                
                let len = Math.hypot(dx, dy);
                if (len > 0) {
                    dx /= len;
                    dy /= len;
                } else {
                    dx = isXAxis ? 0 : 1;
                    dy = isXAxis ? -1 : 0;
                }
                
                // Keep labels on the usual side: below x-axis, left of t-axis.
                if (isXAxis ? dy > 0 : dx < 0) {
                    dx = -dx;
                    dy = -dy;
                }
                
                let tickLen = 5;
                ctx.strokeStyle = axisColor;
                ctx.fillStyle = axisColor;
                ctx.beginPath();
                ctx.moveTo(cx - dx * tickLen, cy - dy * tickLen);
                ctx.lineTo(cx + dx * tickLen, cy + dy * tickLen);
                ctx.stroke();
                
                let textX = isXAxis ? xg : tg;
                textX = parseFloat(textX.toPrecision(12));
                let text = String(textX);
                
                let vx = -dx;
                let vy = -dy;
                
                if (vx > 0.1) ctx.textAlign = 'left';
                else if (vx < -0.1) ctx.textAlign = 'right';
                else ctx.textAlign = 'center';
                
                if (vy > 0.1) ctx.textBaseline = 'top';
                else if (vy < -0.1) ctx.textBaseline = 'bottom';
                else ctx.textBaseline = 'middle';
                
                let padding = 8;
                ctx.fillText(text, cx + vx * (tickLen + padding), cy + vy * (tickLen + padding));
                
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }
            
            for (let x = minXg; x <= maxXg; x += step) {
                if (Math.abs(x) >= 1e-6) drawTick(x, 0, true);
            }
            for (let t = minTg; t <= maxTg; t += step) {
                if (Math.abs(t) >= 1e-6) drawTick(0, t, false);
            }
            
            let pLabelX = mapFrameToDisplay(maxXg - step * 0.5, step * 0.2, frameG, frameV);
            ctx.fillText(isMain ? 'x' : "x'", mathToScreenX(pLabelX.x), mathToScreenY(pLabelX.t));
            
            let pLabelT = mapFrameToDisplay(step * 0.2, maxTg - step * 0.5, frameG, frameV);
            ctx.fillText(isMain ? 'ct' : "ct'", mathToScreenX(pLabelT.x), mathToScreenY(pLabelT.t));
        }

        function drawGrid() {
            let frameV = getDisplayFrameV();
            
            let axesElements = elements.filter(e => {
                if (!e.showAxes || e.isValid === false) return false;
                return true;
            });
            
            if (axesElements.length > 0) {
                ctx.globalAlpha = 0.6;
                drawFrameGrid(null, frameV, true, false);
                ctx.globalAlpha = 1.0;
                for (let el of axesElements) {
                    let v = (el.x2 - el.x1) / (el.t2 - el.t1);
                    let frameG;
                    if (Math.abs(v) < 1.0) {
                        frameG = { v: v, x0: el.x1, t0: el.t1, color: el.color };
                    } else {
                        frameG = { v: 1/v, x0: el.x1, t0: el.t1, color: el.color };
                    }
                    drawFrameGrid(frameG, frameV, false, true);
                }
            } else {
                drawFrameGrid(null, frameV, true, true);
            }
            
            ctx.strokeStyle = '#555';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1;
            
            let large = 1e5;
            ctx.beginPath();
            let pL1 = mapFrameToDisplay(-large, -large, null, frameV);
            let pL2 = mapFrameToDisplay(large, large, null, frameV);
            ctx.moveTo(mathToScreenX(pL1.x), mathToScreenY(pL1.t));
            ctx.lineTo(mathToScreenX(pL2.x), mathToScreenY(pL2.t));
            ctx.stroke();
            
            ctx.beginPath();
            let pL3 = mapFrameToDisplay(large, -large, null, frameV);
            let pL4 = mapFrameToDisplay(-large, large, null, frameV);
            ctx.moveTo(mathToScreenX(pL3.x), mathToScreenY(pL3.t));
            ctx.lineTo(mathToScreenX(pL4.x), mathToScreenY(pL4.t));
            ctx.stroke();
            
            ctx.setLineDash([]);
        }

        function drawElement(el) {
            let frameV = getDisplayFrameV();
            
            const isFocused = focusedElementId === el.id;
            const isAnyFocused = focusedElementId !== null;

            if (isFocused) {
                ctx.lineWidth = 5;
                ctx.globalAlpha = 1.0;
            } else if (isAnyFocused) {
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.3;
            } else {
                ctx.lineWidth = 3;
                ctx.globalAlpha = 1.0;
            }

            ctx.strokeStyle = el.color;
            ctx.fillStyle = el.color;

            if (el.type === 'event') {
                let p = mapFrameToDisplay(el.x, el.t, null, frameV);
                const sx = mathToScreenX(p.x);
                const sy = mathToScreenY(p.t);
                
                if (el.showLightCone) {
                    let dx = Math.max(Math.abs(sx), Math.abs(sx - canvas.width));
                    let dy = Math.max(Math.abs(sy), Math.abs(sy - canvas.height));
                    let large = dx + dy + 100;
                    
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.02)';
                    
                    // Future cone
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx - large, sy - large);
                    ctx.lineTo(sx + large, sy - large);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Past cone
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx - large, sy + large);
                    ctx.lineTo(sx + large, sy + large);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Light lines
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(sx - large, sy - large);
                    ctx.lineTo(sx + large, sy + large);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(sx - large, sy + large);
                    ctx.lineTo(sx + large, sy - large);
                    ctx.stroke();
                    
                    ctx.restore();
                }

                if (isFocused) {
                    let activeFrameG = null;
                    let axesElements = elements.filter(e => {
                        if (!e.showAxes || e.isValid === false) return false;
                        return true;
                    });
                    if (axesElements.length > 0) {
                        let e = axesElements[axesElements.length - 1];
                        let v = (e.x2 - e.x1) / (e.t2 - e.t1);
                        let u = Math.abs(v) < 1.0 ? v : 1/v;
                        activeFrameG = { v: u, x0: e.x1, t0: e.t1, color: e.color };
                    }

                    let gCoords;
                    let frameColor;
                    let sx_x, sy_x, sx_t, sy_t;

                    if (activeFrameG && Math.abs(Math.abs(activeFrameG.v) - 1.0) >= 0.005) {
                        gCoords = mapDisplayToFrame(el.x, el.t, null, activeFrameG);
                        
                        let p_x_axis = mapFrameToDisplay(gCoords.x, 0, activeFrameG, frameV);
                        let p_t_axis = mapFrameToDisplay(0, gCoords.t, activeFrameG, frameV);

                        sx_x = mathToScreenX(p_x_axis.x);
                        sy_x = mathToScreenY(p_x_axis.t);
                        sx_t = mathToScreenX(p_t_axis.x);
                        sy_t = mathToScreenY(p_t_axis.t);

                        frameColor = activeFrameG.color;

                        ctx.save();
                        ctx.strokeStyle = frameColor;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6, 4]);
                        
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx_x, sy_x);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx_t, sy_t);
                        ctx.stroke();
                        
                        ctx.restore();
                    } else {
                        gCoords = mapDisplayToFrame(el.x, el.t, null, null);
                        
                        let p_x_axis = mapFrameToDisplay(gCoords.x, 0, null, frameV);
                        let p_t_axis = mapFrameToDisplay(0, gCoords.t, null, frameV);

                        sx_x = mathToScreenX(p_x_axis.x);
                        sy_x = mathToScreenY(p_x_axis.t);
                        sx_t = mathToScreenX(p_t_axis.x);
                        sy_t = mathToScreenY(p_t_axis.t);

                        frameColor = '#aaaaaa';

                        ctx.save();
                        ctx.strokeStyle = frameColor;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6, 4]);
                        
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx_x, sy_x);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx_t, sy_t);
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                    
                    ctx.font = 'bold 14px Arial';
                    const xText = gCoords.x.toFixed(2);
                    const tText = gCoords.t.toFixed(2);
                    
                    const drawTextWithOutline = (text, x, y) => {
                        ctx.strokeStyle = '#1e1e1e';
                        ctx.lineWidth = 4;
                        ctx.lineJoin = 'round';
                        ctx.strokeText(text, x, y);
                        ctx.fillStyle = frameColor;
                        ctx.fillText(text, x, y);
                    };

                    drawTextWithOutline(xText, sx_x - ctx.measureText(xText).width / 2, sy_x + 20);
                    drawTextWithOutline(tText, sx_t - ctx.measureText(tText).width - 10, sy_t + 5);
                    
                    const pairText = `(${xText}, ${tText})`;
                    drawTextWithOutline(pairText, sx + 15, sy - 15);
                }

                ctx.beginPath();
                ctx.moveTo(sx, sy - 8);
                ctx.lineTo(sx + 8, sy);
                ctx.lineTo(sx, sy + 8);
                ctx.lineTo(sx - 8, sy);
                ctx.closePath();
                ctx.fillStyle = el.color;
                ctx.fill();
                ctx.strokeStyle = isFocused ? '#fff' : '#ccc';
                ctx.lineWidth = isFocused ? 3 : 1;
                ctx.stroke();
                
                ctx.globalAlpha = 1.0;
                return;
            }

            if (el.isValid === false) return;

            let v = (el.x2 - el.x1) / (el.t2 - el.t1);
            let isSpacelikeOrLightlike = Math.abs(v) >= 1.0;

            let tMin, tMax, xMin, xMax;
            
            if (el.limited && !el.endpointAtInfinity) {
                tMin = el.t1;
                tMax = el.t2;
                xMin = el.x1;
                xMax = el.x2;
            } else {
                let minT = Infinity, maxT = -Infinity;
                let minX = Infinity, maxX = -Infinity;
                const cornersScreen = [
                    { sx: 0, sy: 0 },
                    { sx: canvas.width, sy: 0 },
                    { sx: 0, sy: canvas.height },
                    { sx: canvas.width, sy: canvas.height }
                ];
                for (let c of cornersScreen) {
                    let xd = screenToMathX(c.sx);
                    let td = screenToMathY(c.sy);
                    let g = mapDisplayToFrame(xd, td, frameV, null);
                    if (g.t < minT) minT = g.t;
                    if (g.t > maxT) maxT = g.t;
                    if (g.x < minX) minX = g.x;
                    if (g.x > maxX) maxX = g.x;
                }
                
                let dt = el.t2 - el.t1;
                let dx = el.x2 - el.x1;
                
                if (el.limited && el.endpointAtInfinity) {
                    // Raggio da (x1,t1) verso l'infinito nella direzione di v
                    tMin = el.t1;
                    xMin = el.x1;
                    if (Math.abs(dt) < 1e-9) {
                        tMax = el.t1;
                        xMax = dx >= 0 ? maxX + 1000 : minX - 1000;
                    } else {
                        let tFar = dt > 0 ? maxT + 1000 : minT - 1000;
                        tMax = tFar;
                        xMax = el.x1 + (dx / dt) * (tFar - el.t1);
                    }
                } else if (Math.abs(dt) < 1e-9) {
                    tMin = el.t1;
                    tMax = el.t1;
                    if (dx >= 0) {
                        xMin = minX - 1000;
                        xMax = maxX + 1000;
                    } else {
                        xMin = maxX + 1000;
                        xMax = minX - 1000;
                    }
                } else {
                    tMin = minT - 1000;
                    tMax = maxT + 1000;
                    xMin = el.x1 + (dx/dt) * (tMin - el.t1);
                    xMax = el.x1 + (dx/dt) * (tMax - el.t1);
                }
            }

            let pMin = mapFrameToDisplay(xMin, tMin, null, frameV);
            let pMax = mapFrameToDisplay(xMax, tMax, null, frameV);
            
            let sx1 = mathToScreenX(pMin.x);
            let sy1 = mathToScreenY(pMin.t);
            let sx2 = mathToScreenX(pMax.x);
            let sy2 = mathToScreenY(pMax.t);
            
            let arrowX = sx2;
            let arrowY = sy2;
            let lineEndX = sx2;
            let lineEndY = sy2;
            const hideArrow = !!el.endpointAtInfinity;

            if (!el.limited) {
                let dx = sx2 - sx1;
                let dy = sy2 - sy1;
                
                let tTop = dy !== 0 ? (0 - sy1) / dy : -1;
                let tBottom = dy !== 0 ? (canvas.height - sy1) / dy : -1;
                let tLeft = dx !== 0 ? (0 - sx1) / dx : -1;
                let tRight = dx !== 0 ? (canvas.width - sx1) / dx : -1;
                
                let validIntersections = [];
                if (tTop > 0 && tTop < 1) { let x = sx1 + tTop * dx; if (x >= 0 && x <= canvas.width) validIntersections.push(tTop); }
                if (tBottom > 0 && tBottom < 1) { let x = sx1 + tBottom * dx; if (x >= 0 && x <= canvas.width) validIntersections.push(tBottom); }
                if (tLeft > 0 && tLeft < 1) { let y = sy1 + tLeft * dy; if (y >= 0 && y <= canvas.height) validIntersections.push(tLeft); }
                if (tRight > 0 && tRight < 1) { let y = sy1 + tRight * dy; if (y >= 0 && y <= canvas.height) validIntersections.push(tRight); }
                
                if (validIntersections.length > 0) {
                    let tIntersect = Math.max(...validIntersections);
                    tIntersect -= 15 / Math.hypot(dx, dy);
                    arrowX = sx1 + tIntersect * dx;
                    arrowY = sy1 + tIntersect * dy;
                }
            } else if (!hideArrow) {
                let angle = Math.atan2(sy2 - sy1, sx2 - sx1);
                let arrowSize = 16;
                let dist = Math.hypot(sx2 - sx1, sy2 - sy1);
                if (dist > arrowSize) {
                    lineEndX = sx2 - (arrowSize * 0.5) * Math.cos(angle);
                    lineEndY = sy2 - (arrowSize * 0.5) * Math.sin(angle);
                }
            }
            // endpointAtInfinity: segmento fino oltre il bordo (sx2/sy2), nessuna freccia

            if (isSpacelikeOrLightlike) {
                ctx.setLineDash([16, 10]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.beginPath();
            ctx.moveTo(sx1, sy1);
            ctx.lineTo(lineEndX, lineEndY);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!hideArrow) {
                let angle = Math.atan2(sy2 - sy1, sx2 - sx1);
                let arrowSize = 16;
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - arrowSize * Math.cos(angle - Math.PI / 6), arrowY - arrowSize * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(arrowX - arrowSize * Math.cos(angle + Math.PI / 6), arrowY - arrowSize * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            }

            if (isAnyFocused && !isFocused) {
                ctx.globalAlpha = 0.3;
            } else {
                ctx.globalAlpha = 1.0;
            }

            let p0 = mapFrameToDisplay(el.x1, el.t1, null, frameV);
            const sx0 = mathToScreenX(p0.x);
            const sy0 = mathToScreenY(p0.t);
            
            let showStart = false;
            let showEnd = false;
            
            if (currentHoverTarget && currentHoverTarget.el === el) {
                if (currentHoverTarget.type === 'start') showStart = true;
                if (currentHoverTarget.type === 'end') showEnd = true;
            }
            if (draggingTarget && draggingTarget.el === el) {
                if (draggingTarget.type === 'start') showStart = true;
                if (draggingTarget.type === 'end') showEnd = true;
            }

            if (showStart) {
                ctx.beginPath();
                ctx.arc(sx0, sy0, 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            if (el.limited && !el.endpointAtInfinity) {
                let p2 = mapFrameToDisplay(el.x2, el.t2, null, frameV);
                const sx2_pt = mathToScreenX(p2.x);
                const sy2_pt = mathToScreenY(p2.t);
                if (showEnd) {
                    ctx.beginPath();
                    ctx.arc(sx2_pt, sy2_pt, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            const isDraggingThisLine = (draggingTarget && draggingTarget.el === el && draggingTarget.type === 'line') || isDraggingVelocityForEl === el;

            if (isDraggingThisLine) {
                ctx.save();
                
                let dx = Math.max(Math.abs(sx0), Math.abs(sx0 - canvas.width));
                let dy = Math.max(Math.abs(sy0), Math.abs(sy0 - canvas.height));
                let large = dx + dy + 100;

                ctx.globalAlpha = 0.02;
                ctx.fillStyle = el.color;

                ctx.beginPath();
                ctx.moveTo(sx0, sy0);
                ctx.lineTo(sx0 - large, sy0 - large);
                ctx.lineTo(sx0 + large, sy0 - large);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(sx0, sy0);
                ctx.lineTo(sx0 - large, sy0 + large);
                ctx.lineTo(sx0 + large, sy0 + large);
                ctx.closePath();
                ctx.fill();

                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = el.color;
                ctx.setLineDash([10, 10]);
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(sx0 - large, sy0 - large);
                ctx.lineTo(sx0 + large, sy0 + large);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(sx0 - large, sy0 + large);
                ctx.lineTo(sx0 + large, sy0 - large);
                ctx.stroke();
                
                ctx.restore();
            }

            // Guida di velocità infinita: visibile sul vettore limitato in focus
            if (el.limited && (isFocused || isDraggingThisLine)) {
                let minT = Infinity, maxT = -Infinity;
                const cornersScreen = [
                    { sx: 0, sy: 0 },
                    { sx: canvas.width, sy: 0 },
                    { sx: 0, sy: canvas.height },
                    { sx: canvas.width, sy: canvas.height }
                ];
                for (let c of cornersScreen) {
                    let xd = screenToMathX(c.sx);
                    let td = screenToMathY(c.sy);
                    let g = mapDisplayToFrame(xd, td, frameV, null);
                    if (g.t < minT) minT = g.t;
                    if (g.t > maxT) maxT = g.t;
                }
                let tMinInf = minT - 100;
                let tMaxInf = maxT + 100;

                let xMinInf = el.x1 + v * (tMinInf - el.t1);
                let xMaxInf = el.x1 + v * (tMaxInf - el.t1);

                let pMinInf = mapFrameToDisplay(xMinInf, tMinInf, null, frameV);
                let pMaxInf = mapFrameToDisplay(xMaxInf, tMaxInf, null, frameV);

                ctx.save();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = el.color;
                ctx.setLineDash([]);
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(mathToScreenX(pMinInf.x), mathToScreenY(pMinInf.t));
