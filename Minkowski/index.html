        function applyLineVelocity(el, newV) {
            if (!Number.isFinite(newV)) return;
            let dx0 = el.x2 - el.x1;
            let dt0 = el.t2 - el.t1;
            let I = dx0 * dx0 - dt0 * dt0;
            let v0 = Math.abs(dt0) > 1e-15 ? dx0 / dt0 : (dx0 > 0 ? Infinity : -Infinity);
            let signDt = (el.endpointAtInfinity && el.preservedSignDt != null)
                ? el.preservedSignDt
                : (dt0 >= 0 ? 1 : -1);

            // Misura propria da preservare (tempo proprio / lunghezza propria in valore assoluto)
            let measure;
            if (el.endpointAtInfinity || isNearLightSpeed(v0) || Math.abs(I) < 1e-9) {
                measure = el.preservedProperAbs != null ? el.preservedProperAbs : 0;
            } else {
                measure = Math.sqrt(Math.abs(I));
                el.preservedProperAbs = measure;
                el.preservedProperKind = I < 0 ? 'tau' : 'L0';
            }
            el.preservedSignDt = signDt;

            // Vicino a c: sospendi il calcolo del 2° punto e collegalo all'infinito
            if (isNearLightSpeed(newV)) {
                placeEndpointAtInfinity(el, newV, signDt);
                // Aggiorna solo il 2° estremo: i vincoli sul 1° restano
                syncFixedEndpoint(el, 2);
                return;
            }

            el.endpointAtInfinity = false;

            if (measure < 1e-12) {
                // Intervallo nullo genuino: resta lungo il nuovo v con lunghezza euclidea unitaria
                let L = Math.sqrt(dx0 * dx0 + dt0 * dt0) || 1;
                let dt = signDt * L / Math.sqrt(1 + newV * newV);
                el.x2 = el.x1 + newV * dt;
                el.t2 = el.t1 + dt;
            } else {
                // Preserva |I| = measure²; il segno di I segue il tipo (tempo/spazio) di newV
                // I = dt²(v² - 1) ⇒ dt = ±√(measure² / |v² - 1|)
                let dt = signDt * measure / Math.sqrt(Math.abs(newV * newV - 1));
                el.x2 = el.x1 + newV * dt;
                el.t2 = el.t1 + dt;
                el.preservedProperAbs = measure;
                el.preservedProperKind = Math.abs(newV) < 1 ? 'tau' : 'L0';
            }

            // Come per τ/L₀: muove il 2° punto, senza rompere un vincolo sul 1°
            syncFixedEndpoint(el, 2);
        }

        function isCoordEditable(dep) {
            return !describeDependency(dep);
        }

        function isSpanBeingEdited(span) {
            return !!(span && activeInlineEdit && activeInlineEdit.span === span);
        }

        function updateEditableDisplay(span, text, editable) {
            if (!span) return;
            if (!isSpanBeingEdited(span)) {
                span.textContent = text;
            }
            span.classList.toggle('editable-val', !!editable);
            span.title = editable ? 'Clicca per modificare' : '';
        }

        function parseInlineNumber(raw) {
            const cleaned = String(raw).trim().replace(/\u2212/g, '-').replace(/,/g, '.');
            if (cleaned === '') return NaN;
            return parseFloat(cleaned);
        }

        function syncFixedEndpoint(el, which) {
            if (!el.dependencies || el.dependencies.type !== 'points') return;
            const dep = which === 1 ? el.dependencies.p1 : el.dependencies.p2;
            if (dep && dep.type === 'fixed') {
                if (which === 1) {
                    dep.x = el.x1;
                    dep.t = el.t1;
                } else {
                    dep.x = el.x2;
                    dep.t = el.t2;
                }
            }
        }

        function applyProperIntervalValue(el, kind, val) {
            if (!Number.isFinite(val)) return;
            let dx = el.x2 - el.x1;
            let dt = el.t2 - el.t1;

            if (kind === 'tau') {
                let v = Math.abs(dt) > 1e-9 ? dx / dt : 0;
                if (Math.abs(v) >= 1) v = 0;
                const s = Math.sqrt(Math.max(0, 1 - v * v));
                if (s < 1e-12) return;
                const dtNew = val / s;
                const dxNew = v * dtNew;
                el.x2 = el.x1 + dxNew;
                el.t2 = el.t1 + dtNew;
            } else if (kind === 'L0') {
                if (Math.abs(dt) < 1e-9) {
                    el.x2 = el.x1 + val;
                    el.t2 = el.t1;
                } else {
                    let v = dx / dt;
                    if (Math.abs(v) <= 1) {
                        el.x2 = el.x1 + val;
                        el.t2 = el.t1;
                    } else {
                        const s = Math.sqrt(Math.max(0, 1 - 1 / (v * v)));
                        if (s < 1e-12) return;
                        const dxNew = val / s;
                        const dtNew = dxNew / v;
                        el.x2 = el.x1 + dxNew;
                        el.t2 = el.t1 + dtNew;
                    }
                }
            }

            el.endpointAtInfinity = false;
            el.preservedProperAbs = Math.abs(val);
            el.preservedProperKind = kind;
            el.preservedSignDt = (el.t2 - el.t1) >= 0 ? 1 : -1;
            syncFixedEndpoint(el, 2);
        }

        function applyEditedProp(el, prop, val) {
            if (prop === 'v') {
                applyLineVelocity(el, val);
                return;
            }
            if (prop === 'gamma') {
                if (!Number.isFinite(val) || val < 1) return;
                const dt = el.t2 - el.t1;
                const dx = el.x2 - el.x1;
                const vPrev = dt !== 0 ? dx / dt : (dx >= 0 ? 1 : -1);
                const sign = vPrev < 0 ? -1 : 1;
                const beta = val === 1 ? 0 : sign * Math.sqrt(Math.max(0, 1 - 1 / (val * val)));
                applyLineVelocity(el, beta);
                return;
            }
            if (prop === 'tau' || prop === 'L0') {
                applyProperIntervalValue(el, prop, val);
                return;
            }
            el[prop] = val;
            if (prop === 'x1' || prop === 't1') syncFixedEndpoint(el, 1);
            if (prop === 'x2' || prop === 't2') {
                el.endpointAtInfinity = false;
                syncPreservedProperFromGeometry(el);
                syncFixedEndpoint(el, 2);
            }
            if (prop === 'x1' || prop === 't1') {
                syncPreservedProperFromGeometry(el);
            }
        }

        function getPropDigits(prop) {
            return (prop === 'v' || prop === 'gamma') ? 3 : 2;
        }

        function getPropValue(el, prop) {
            if (prop === 'v') {
                let dt = el.t2 - el.t1;
                let dx = el.x2 - el.x1;
                return dt !== 0 ? dx / dt : (dx > 0 ? Infinity : -Infinity);
            }
            if (prop === 'gamma') {
                const v = getPropValue(el, 'v');
                if (!Number.isFinite(v) || Math.abs(v) >= 1) return Infinity;
                return 1 / Math.sqrt(1 - v * v);
            }
            if (prop === 'tau' || prop === 'L0') {
                if (el.endpointAtInfinity && el.preservedProperAbs != null) {
                    const sign = el.preservedSignDt != null ? el.preservedSignDt : 1;
                    return sign * el.preservedProperAbs;
                }
                let dx = el.x2 - el.x1;
                let dt = el.t2 - el.t1;
                let I = dx * dx - dt * dt;
                if (prop === 'tau') {
                    return (dt >= 0 ? 1 : -1) * Math.sqrt(Math.max(0, -I));
                }
                return (dx >= 0 ? 1 : -1) * Math.sqrt(Math.max(0, I));
            }
            return el[prop];
        }

        function cancelInlineEdit() {
            if (!activeInlineEdit || inlineEditLock) return;
            inlineEditLock = true;
            activeInlineEdit = null;
            updateSidebarUI();
            inlineEditLock = false;
        }

        function commitInlineEdit() {
            if (!activeInlineEdit || inlineEditLock) return;
            inlineEditLock = true;
            const { el, prop, input } = activeInlineEdit;
            const val = parseInlineNumber(input.value);
            activeInlineEdit = null;

            if (Number.isFinite(val)) {
                applyEditedProp(el, prop, val);
                updateDependencies();
                updateSidebarUI();
                draw();
                saveState();
            } else {
                updateSidebarUI();
            }
            inlineEditLock = false;
        }

        function startInlineEdit(span, el, prop) {
            if (!span || isSpanBeingEdited(span)) return;
            if (activeInlineEdit) cancelInlineEdit();

            const digits = getPropDigits(prop);
            const current = getPropValue(el, prop);
            if (!Number.isFinite(current) && (prop === 'v' || prop === 'gamma')) return;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-edit-input';
            input.value = toEditableNum(current, digits);
            input.setAttribute('aria-label', 'Modifica valore');

            span.textContent = '';
            span.appendChild(input);
            activeInlineEdit = { span, el, prop, input };

            focusedElementId = el.id;
            updateFocusedCardStyling();

            input.addEventListener('keydown', e => {
                e.stopPropagation();
                if (e.key === 'Enter') {
                    e.preventDefault();
                    commitInlineEdit();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelInlineEdit();
                }
            });
            input.addEventListener('click', e => e.stopPropagation());
            input.addEventListener('mousedown', e => e.stopPropagation());
            input.addEventListener('blur', () => cancelInlineEdit());

            input.focus();
            input.select();
        }

        sidebarList.addEventListener('click', e => {
            const span = e.target.closest('.editable-val');
            if (!span || !sidebarList.contains(span)) return;
            if (span.querySelector('input.inline-edit-input')) return;

            const match = span.id && span.id.match(/^(x|t|x1|t1|x2|t2|v|gamma|proper)-val-(\d+)$/);
            if (!match) return;

            const prop = match[1] === 'proper' ? span.dataset.properKind : match[1];
            if (!prop) return;
            const elId = parseInt(match[2], 10);
            const el = elements.find(item => item.id === elId);
            if (!el) return;

            e.preventDefault();
            e.stopPropagation();
            startInlineEdit(span, el, prop);
        });

        function describeLineRef(elId, lineType) {
            if (lineType === 'lightcone_right' || lineType === 'lightcone_left') {
                return `cono di luce ${elId}`;
            }
            return `linea ${elId}`;
        }

        function describeDependency(dep) {
            if (!dep || dep.type === 'fixed') return null;
            if (dep.type === 'event') {
                return `evento ${dep.elId}`;
            }
            if (dep.type === 'movement_point') {
                if (dep.pointType === 'movement_start') return `inizio linea ${dep.elId}`;
                if (dep.pointType === 'movement_end') return `fine linea ${dep.elId}`;
                return `linea ${dep.elId}`;
            }
            if (dep.type === 'intersection' && dep.lines && dep.lines.length >= 2) {
                return `${describeLineRef(dep.lines[0].elId, dep.lines[0].lineType)} ∩ ${describeLineRef(dep.lines[1].elId, dep.lines[1].lineType)}`;
            }
            return null;
        }

        function getLineEndpointDependencies(el) {
            let startDep = null;
            let endDep = null;
            if (!el.dependencies) return { startDep, endDep };
            if (el.dependencies.type === 'start_point') {
                startDep = el.dependencies.pt;
            } else if (el.dependencies.type === 'points') {
                startDep = el.dependencies.p1;
                endDep = el.dependencies.p2;
            }
            return { startDep, endDep };
        }

        function setDepHint(elId, suffix, dep) {
            const hint = document.getElementById(`dep${suffix}-val-${elId}`);
            if (!hint) return;
            const label = describeDependency(dep);
            if (label) {
                hint.textContent = `Vincolato a: ${label}`;
                hint.style.display = 'block';
            } else {
                hint.textContent = '';
                hint.style.display = 'none';
            }
        }

        function syncPrimeRows(container, frameEls, ensureRow, updateRow) {
            if (!container) return;
            const wanted = new Set(frameEls.map(f => String(f.id)));
            [...container.children].forEach(child => {
                if (!wanted.has(child.dataset.frameId)) child.remove();
            });
            frameEls.forEach((frameEl, index) => {
                let row = container.querySelector(`[data-frame-id="${frameEl.id}"]`);
                if (!row) {
                    row = ensureRow(frameEl);
                    row.dataset.frameId = String(frameEl.id);
                }
                const current = container.children[index];
                if (current !== row) {
                    container.insertBefore(row, current || null);
                }
                updateRow(row, frameEl);
            });
        }

        // Dopo un cambio di layout nella sidebar, ripristina lo scroll così che
        // l'elemento cliccato resti nella stessa posizione assoluta sullo schermo.
        function preserveSidebarAnchor(anchorEl, beforeTop) {
            if (!anchorEl || beforeTop == null || !anchorEl.isConnected) return;
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            const delta = anchorEl.getBoundingClientRect().top - beforeTop;
            if (delta !== 0) sidebar.scrollTop += delta;
        }

        function updateSidebarUI(anchorEl) {
            const sidebar = document.getElementById('sidebar');
            const beforeTop = (anchorEl && sidebar) ? anchorEl.getBoundingClientRect().top : null;
            const primeFrames = getActivePrimeFrameElements();

            elements.forEach(el => {
                if (el.type === 'event') {
                    const xVal = document.getElementById(`x-val-${el.id}`);
                    const tVal = document.getElementById(`t-val-${el.id}`);
                    const eventEditable = isCoordEditable(el.dependencies);
                    const lcBtn = document.getElementById(`lightcone-btn-${el.id}`);
                    const primeRows = document.getElementById(`event-prime-rows-${el.id}`);

                    updateEditableDisplay(xVal, formatNum(el.x, 2), eventEditable);
                    updateEditableDisplay(tVal, formatNum(el.t, 2), eventEditable);
                    setDepHint(el.id, '', el.dependencies);
                    setStateToggle(lcBtn, el.showLightCone);

                    syncPrimeRows(
                        primeRows,
                        primeFrames,
                        () => {
                            const row = document.createElement('div');
                            row.style.display = 'flex';
                            row.style.justifyContent = 'flex-start';
                            row.style.marginBottom = '5px';
                            row.style.fontSize = '0.9rem';
                            row.innerHTML = '( x′ ; ct′ ) = ( <span class="x-prime-val"></span> ; <span class="t-prime-val"></span> )';
                            return row;
                        },
                        (row, frameEl) => {
                            const xPrimeVal = row.querySelector('.x-prime-val');
                            const tPrimeVal = row.querySelector('.t-prime-val');
                            const primed = labToRestCoords(el.x, el.t, frameEl);
                            if (primed && xPrimeVal && tPrimeVal) {
                                xPrimeVal.textContent = formatNum(primed.x, 2);
                                tPrimeVal.textContent = formatNum(primed.t, 2);
                                row.style.display = 'flex';
                                row.style.color = frameEl.color || '';
                            } else {
                                row.style.display = 'none';
                                row.style.color = '';
                                if (xPrimeVal) xPrimeVal.textContent = '';
                                if (tPrimeVal) tPrimeVal.textContent = '';
                            }
                        }
                    );
                } else {
                    const x1Val = document.getElementById(`x1-val-${el.id}`);
                    const t1Val = document.getElementById(`t1-val-${el.id}`);
                    const x2Val = document.getElementById(`x2-val-${el.id}`);
                    const t2Val = document.getElementById(`t2-val-${el.id}`);
                    const restBtn = document.getElementById(`rest-btn-${el.id}`);
                    const axesBtn = document.getElementById(`axes-btn-${el.id}`);
                    const intervalVal = document.getElementById(`interval-val-${el.id}`);
                    const intervalType = document.getElementById(`interval-type-${el.id}`);
                    const restLabel = document.getElementById(`rest-label-${el.id}`);
                    const vVal = document.getElementById(`v-val-${el.id}`);
                    const gammaVal = document.getElementById(`gamma-val-${el.id}`);
                    const vSlider = document.getElementById(`v-slider-${el.id}`);
                    const primeRows = document.getElementById(`velocity-prime-rows-${el.id}`);

                    const { startDep, endDep } = getLineEndpointDependencies(el);
                    const startEditable = isCoordEditable(startDep);
                    const endEditable = isCoordEditable(endDep);

                    updateEditableDisplay(x1Val, formatNum(el.x1, 2), startEditable);
                    updateEditableDisplay(t1Val, formatNum(el.t1, 2), startEditable);
                    if (el.endpointAtInfinity) {
                        updateEditableDisplay(x2Val, '∞', false);
                        updateEditableDisplay(t2Val, '∞', false);
                    } else {
                        updateEditableDisplay(x2Val, formatNum(el.x2, 2), endEditable);
                        updateEditableDisplay(t2Val, formatNum(el.t2, 2), endEditable);
                    }

                    setDepHint(el.id, '1', startDep);
                    setDepHint(el.id, '2', endDep);
                    
                    let dt = el.t2 - el.t1;
                    let dx = el.x2 - el.x1;
                    let v = dt !== 0 ? dx / dt : Infinity;
                    let isTimeLike = Math.abs(v) < 1.0;
                    let isSpaceLike = Math.abs(v) > 1.0;
                    // v è editabile se il 2° estremo è libero (anche con il 1° vincolato)
                    const velocityEditable = endEditable && Number.isFinite(v);
                    
                    if (vVal) {
                        if (Math.abs(v) <= 1.0) {
                            updateEditableDisplay(vVal, formatNum(v, 3), velocityEditable);
                            if (vSlider) {
                                vSlider.style.display = 'block';
                                vSlider.value = v;
                                vSlider.disabled = !velocityEditable;
                            }
                        } else {
                            const vText = Math.abs(v) === Infinity ? (dx > 0 ? "+∞" : "\u2212∞") : formatNum(v, 3);
                            updateEditableDisplay(vVal, vText, velocityEditable);
                            if (vSlider) vSlider.style.display = 'none';
                        }
                    }

                    if (gammaVal) {
                        let gammaText;
                        const gammaEditable = velocityEditable && Math.abs(v) < 1.0;
                        if (Math.abs(v) < 1.0) {
                            gammaText = formatNum(1 / Math.sqrt(1 - v * v), 3);
                        } else {
                            gammaText = '∞';
                        }
                        updateEditableDisplay(gammaVal, gammaText, gammaEditable);
                    }

                    const betaLab = dt !== 0 ? dx / dt : (dx > 0 ? Infinity : -Infinity);
                    syncPrimeRows(
                        primeRows,
                        primeFrames,
                        () => {
                            const row = document.createElement('div');
                            row.className = 'velocity-params-row';
                            row.innerHTML =
                                '<span>β′ = v′/c = <span class="v-prime-val"></span></span>' +
                                '<span>γ′ = <span class="gamma-prime-val"></span></span>';
                            return row;
                        },
                        (row, frameEl) => {
                            const vPrimeVal = row.querySelector('.v-prime-val');
                            const gammaPrimeVal = row.querySelector('.gamma-prime-val');
                            const boostU = getRestFrameBoostVelocity(frameEl);
                            if (boostU != null && vPrimeVal && gammaPrimeVal) {
                                const betaPrime = boostBeta(betaLab, boostU);
                                vPrimeVal.textContent = formatBetaText(betaPrime, dx);
                                if (Number.isFinite(betaPrime) && Math.abs(betaPrime) < 1.0) {
                                    gammaPrimeVal.textContent = formatNum(1 / Math.sqrt(1 - betaPrime * betaPrime), 3);
                                } else {
                                    gammaPrimeVal.textContent = '∞';
                                }
                                row.style.display = '';
                                row.style.color = frameEl.color || '';
                            } else {
                                row.style.display = 'none';
                                row.style.color = '';
                                if (vPrimeVal) vPrimeVal.textContent = '';
                                if (gammaPrimeVal) gammaPrimeVal.textContent = '';
                            }
                        }
                    );

                    if (restLabel) {
                        if (isTimeLike) {
                            restLabel.textContent = "Sistema di riposo";
                        } else if (isSpaceLike) {
                            restLabel.textContent = "Sistema di simultaneità";
                        } else {
                            restLabel.textContent = "Sistema di riposo";
                        }
                    }
                    
                    if (restBtn) {
                        setStateToggle(restBtn, el.viewRestFrame);
                    }
                    if (axesBtn) {
                        setStateToggle(axesBtn, el.showAxes);
                    }
                    
                    if (intervalVal && intervalType) {
                        const intervalLabel = document.getElementById(`interval-label-${el.id}`);
                        const properVal = document.getElementById(`proper-val-${el.id}`);
                        let ds2 = dx*dx - dt*dt;
                        const endFree = isCoordEditable(endDep);

                        // Endpoint sospeso vicino a c: misura propria tenuta in preservedProperAbs
                        // (non mostrata se tipo luce: non ha senso fisico, ma serve al cambio di v)
                        if (el.endpointAtInfinity && el.preservedProperAbs != null) {
                            const sign = el.preservedSignDt != null ? el.preservedSignDt : 1;
                            const nearLight = isNearLightSpeed(v);
                            if (nearLight) {
                                intervalType.textContent = "Intervallo di tipo LUCE";
                                intervalType.style.color = "#ffff55";
                                intervalVal.style.display = 'none';
                                if (properVal) updateEditableDisplay(properVal, '', false);
                            } else if (Math.abs(v) < 1) {
                                intervalType.textContent = "Intervallo di tipo TEMPO";
                                intervalType.style.color = "#55ff55";
                                el.preservedProperKind = 'tau';
                                if (el.limited) {
                                    intervalVal.style.display = '';
                                    if (intervalLabel) intervalLabel.textContent = 'tempo proprio = ';
                                    if (properVal) properVal.dataset.properKind = 'tau';
                                    updateEditableDisplay(properVal, formatNum(sign * el.preservedProperAbs, 2), endFree);
                                } else {
                                    intervalVal.style.display = 'none';
                                    if (properVal) updateEditableDisplay(properVal, '', false);
                                }
                            } else {
                                intervalType.textContent = "Intervallo di tipo SPAZIO";
                                intervalType.style.color = "#ff5555";
                                el.preservedProperKind = 'L0';
                                if (el.limited) {
                                    intervalVal.style.display = '';
                                    if (intervalLabel) intervalLabel.textContent = 'lunghezza propria = ';
                                    if (properVal) properVal.dataset.properKind = 'L0';
                                    updateEditableDisplay(properVal, formatNum(sign * el.preservedProperAbs, 2), endFree);
                                } else {
                                    intervalVal.style.display = 'none';
                                    if (properVal) updateEditableDisplay(properVal, '', false);
                                }
                            }
                        } else if (ds2 > 1e-6) {
                            intervalType.textContent = "Intervallo di tipo SPAZIO";
                            intervalType.style.color = "#ff5555";
                            if (el.limited) {
                                let sign = dx >= 0 ? 1 : -1;
                                let L0 = sign * Math.sqrt(ds2);
                                intervalVal.style.display = '';
                                if (intervalLabel) intervalLabel.textContent = 'lunghezza propria = ';
                                if (properVal) properVal.dataset.properKind = 'L0';
                                updateEditableDisplay(properVal, formatNum(L0, 2), endFree);
                                el.preservedProperAbs = Math.abs(L0);
                                el.preservedProperKind = 'L0';
                            } else {
                                intervalVal.style.display = 'none';
                                if (properVal) updateEditableDisplay(properVal, '', false);
                            }
                        } else if (ds2 < -1e-6) {
                            intervalType.textContent = "Intervallo di tipo TEMPO";
                            intervalType.style.color = "#55ff55";
                            if (el.limited) {
                                let sign = dt >= 0 ? 1 : -1;
                                let tau = sign * Math.sqrt(-ds2);
                                intervalVal.style.display = '';
                                if (intervalLabel) intervalLabel.textContent = 'tempo proprio = ';
                                if (properVal) properVal.dataset.properKind = 'tau';
                                updateEditableDisplay(properVal, formatNum(tau, 2), endFree);
                                el.preservedProperAbs = Math.abs(tau);
                                el.preservedProperKind = 'tau';
                            } else {
                                intervalVal.style.display = 'none';
                                if (properVal) updateEditableDisplay(properVal, '', false);
                            }
                        } else {
                            intervalType.textContent = "Intervallo di tipo LUCE";
                            intervalType.style.color = "#ffff55";
                            intervalVal.style.display = 'none';
                            if (properVal) updateEditableDisplay(properVal, '', false);
                        }
                    }
                }
            });

            preserveSidebarAnchor(anchorEl, beforeTop);
        }

        addBtn.addEventListener('click', () => {
            const randomV = (Math.random() * 1.6 - 0.8); // Casuale tra -0.8 e 0.8
            const newElement = {
                id: nextId++,
                type: 'line',
                x1: 0,
                t1: 0,
                x2: randomV,
                t2: 1,
                color: colors[colorIndex % colors.length],
                limited: false,
                expanded: true,
                visible: true,
                showAxes: false,
                viewRestFrame: false,
                isValid: true
            };
            colorIndex++;
            focusedElementId = newElement.id;
            elements.push(newElement);
            updateDependencies();
            createElementSidebar(newElement);
            draw();
            
            saveState();

            setTimeout(() => {
                const card = document.getElementById(`element-card-${newElement.id}`);
                if (card) {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.scrollTo({
                        top: card.offsetTop - document.getElementById('add-line-btn').offsetTop - document.getElementById('add-line-btn').offsetHeight - 15,
                        behavior: 'smooth'
                    });
                }
            }, 50);
        });

        addEventBtn.addEventListener('click', () => {
            const marginX = canvas.width * 0.1;
            const marginY = canvas.height * 0.1;
            const sx = marginX + Math.random() * (canvas.width - 2 * marginX);
            const sy = marginY + Math.random() * (canvas.height - 2 * marginY);
            
            const mx = screenToMathX(sx);
            const mt = screenToMathY(sy);
            
            let frameV = getDisplayFrameV();
            let gCoords = mapDisplayToFrame(mx, mt, frameV, null);

            const newEvent = {
                id: nextId++,
                type: 'event',
                x: gCoords.x,
                t: gCoords.t,
                color: eventColors[eventColorIndex % eventColors.length],
                expanded: true,
                visible: true,
                showLightCone: false,
                isValid: true
            };
            eventColorIndex++;
            focusedElementId = newEvent.id;
            elements.push(newEvent);
            updateDependencies();
            createElementSidebar(newEvent);
            draw();
            
            saveState();

            setTimeout(() => {
                const card = document.getElementById(`element-card-${newEvent.id}`);
                if (card) {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.scrollTo({
                        top: card.offsetTop - document.getElementById('add-event-btn').offsetTop - document.getElementById('add-event-btn').offsetHeight - 15,
                        behavior: 'smooth'
                    });
                }
            }, 50);
        });

        // Inizializzazione
        resize();
        
        // Aggiungi un primo elemento di default
        addBtn.click();
    </script>
</body>
</html>
