                ctx.lineTo(mathToScreenX(pMaxInf.x), mathToScreenY(pMaxInf.t));
                ctx.stroke();
                ctx.restore();
            }
        }

        let viewAnimation = null;

        function cancelViewAnimation() {
            if (viewAnimation) {
                cancelAnimationFrame(viewAnimation.id);
                viewAnimation = null;
            }
        }

        function animateViewTo(targetX, targetT, targetScale) {
            cancelViewAnimation();
            
            let startX = view.x;
            let startT = view.t;
            let startScale = view.scale;
            let startTime = performance.now();
            let duration = 1000; // 1 second
            
            function step(currentTime) {
                let elapsed = currentTime - startTime;
                let progress = elapsed / duration;
                
                if (progress >= 1) {
                    view.x = targetX;
                    view.t = targetT;
                    view.scale = targetScale;
                    viewAnimation = null;
                    draw();
                    return;
                }
                
                let ease = 1 - Math.pow(1 - progress, 3);
                
                view.x = startX + (targetX - startX) * ease;
                view.t = startT + (targetT - startT) * ease;
                view.scale = startScale + (targetScale - startScale) * ease;
                
                draw();
                viewAnimation = { id: requestAnimationFrame(step) };
            }
            
            viewAnimation = { id: requestAnimationFrame(step) };
        }

        function ensureElementVisible(el, fromCanvasInteraction = false) {
            if (fromCanvasInteraction) return;

            let frameV = getDisplayFrameV();
            
            let marginX = canvas.width * 0.1 / view.scale;
            let marginY = canvas.height * 0.1 / view.scale;
            let visibleMinX = view.x - canvas.width / (2 * view.scale);
            let visibleMaxX = view.x + canvas.width / (2 * view.scale);
            let visibleMinT = view.t - canvas.height / (2 * view.scale);
            let visibleMaxT = view.t + canvas.height / (2 * view.scale);

            if (el.type === 'line' && !el.limited) {
                let originDisplay = mapFrameToDisplay(el.x1, el.t1, null, frameV);
                let originVisible = (
                    originDisplay.x >= visibleMinX &&
                    originDisplay.x <= visibleMaxX &&
                    originDisplay.t >= visibleMinT &&
                    originDisplay.t <= visibleMaxT
                );
                if (originVisible) return;
            }

            let points = [];
            if (el.type === 'event') {
                points.push({x: el.x, t: el.t});
            } else if (el.type === 'line') {
                if (el.limited) {
                    points.push({x: el.x1, t: el.t1});
                    points.push({x: el.x2, t: el.t2});
                } else {
                    let v = (el.x2 - el.x1) / (el.t2 - el.t1);
                    points.push({x: el.x1, t: el.t1});
                    points.push({x: el.x1 + v * 10, t: el.t1 + 10});
                    points.push({x: el.x1 - v * 10, t: el.t1 - 10});
                }
            }

            let displayPoints = points.map(p => mapFrameToDisplay(p.x, p.t, null, frameV));
            displayPoints.push({x: 0, t: 0}); // Include origin

            let minX = Math.min(...displayPoints.map(p => p.x));
            let maxX = Math.max(...displayPoints.map(p => p.x));
            let minT = Math.min(...displayPoints.map(p => p.t));
            let maxT = Math.max(...displayPoints.map(p => p.t));

            let allVisible = (
                minX >= visibleMinX + marginX &&
                maxX <= visibleMaxX - marginX &&
                minT >= visibleMinT + marginY &&
                maxT <= visibleMaxT - marginY
            );

            if (allVisible) {
                return;
            }

            let targetX = (minX + maxX) / 2;
            let targetT = (minT + maxT) / 2;

            let widthNeeded = maxX - minX;
            let heightNeeded = maxT - minT;

            widthNeeded *= 1.4;
            heightNeeded *= 1.4;

            if (widthNeeded < 10) widthNeeded = 10;
            if (heightNeeded < 10) heightNeeded = 10;

            let scaleX = canvas.width / widthNeeded;
            let scaleY = canvas.height / heightNeeded;

            let targetScale = Math.min(scaleX, scaleY);
            
            animateViewTo(targetX, targetT, targetScale);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            for (let el of elements) {
                if (el.isValid === false) continue;
                if (el.visible === false) continue;
                drawElement(el);
            }

            if (isCreatingLineClick && lineClickStart && lineClickCurrent) {
                let frameV = getDisplayFrameV();
                let pStart = mapFrameToDisplay(lineClickStart.x, lineClickStart.t, null, frameV);
                let pCurr = mapFrameToDisplay(lineClickCurrent.x, lineClickCurrent.t, null, frameV);
                
                let sx1 = mathToScreenX(pStart.x);
                let sy1 = mathToScreenY(pStart.t);
                let sx2 = mathToScreenX(pCurr.x);
                let sy2 = mathToScreenY(pCurr.t);

                let dt = lineClickCurrent.t - lineClickStart.t;
                let dx = lineClickCurrent.x - lineClickStart.x;
                let v = dt !== 0 ? dx / dt : (dx > 0 ? Infinity : -Infinity);
                
                ctx.beginPath();
                ctx.moveTo(sx1, sy1);
                ctx.lineTo(sx2, sy2);
                
                if (Math.abs(v) >= 1) {
                    ctx.strokeStyle = colors[colorIndex % colors.length];
                    ctx.setLineDash([5, 5]);
                } else {
                    ctx.strokeStyle = colors[colorIndex % colors.length];
                    ctx.setLineDash([]);
                }
                
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Draw arrow
                let angle = Math.atan2(sy2 - sy1, sx2 - sx1);
                let arrowSize = 16;
                ctx.beginPath();
                ctx.moveTo(sx2, sy2);
                ctx.lineTo(sx2 - arrowSize * Math.cos(angle - Math.PI / 6), sy2 - arrowSize * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(sx2 - arrowSize * Math.cos(angle + Math.PI / 6), sy2 - arrowSize * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fill();
            }
            
            if (isCreatingLineDrag && lineDragStart && lineDragCurrent) {
                let frameV = getDisplayFrameV();
                let pStart = mapFrameToDisplay(lineDragStart.x, lineDragStart.t, null, frameV);
                let pCurr = mapFrameToDisplay(lineDragCurrent.x, lineDragCurrent.t, null, frameV);
                
                let sx1 = mathToScreenX(pStart.x);
                let sy1 = mathToScreenY(pStart.t);
                let sx2 = mathToScreenX(pCurr.x);
                let sy2 = mathToScreenY(pCurr.t);
                
                ctx.strokeStyle = '#ffffaa';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(sx1, sy1);
                ctx.lineTo(sx2, sy2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            if (currentHoverSnap && !isPanning) {
                let frameV = getDisplayFrameV();
                let p = mapFrameToDisplay(currentHoverSnap.x, currentHoverSnap.t, null, frameV);
                let sx = mathToScreenX(p.x);
                let sy = mathToScreenY(p.t);
                
                let isCreating = isCreatingLineClick || isCreatingLineDrag;
                let isDragging = draggingTarget || isCreating;
                let snapColor = isDragging ? 
                    (draggingTarget && draggingTarget.el ? draggingTarget.el.color : colors[colorIndex % colors.length]) 
                    : null;
                let hasConstraint = !!(currentHoverSnap.snapInfo || currentHoverSnap.isIntersection);
                let snapRadius = hasConstraint ? 6 : 4;
                let defaultFill = currentHoverSnap.isIntersection ? '#ffff00' : (hasConstraint ? '#ffcc00' : '#fff');

                ctx.beginPath();
                ctx.arc(sx, sy, snapRadius, 0, 2 * Math.PI);
                ctx.fillStyle = snapColor || defaultFill;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (currentHoverSnap.label) {
                    ctx.fillStyle = snapColor || defaultFill;
                    ctx.font = '12px Arial';
                    ctx.fillText(currentHoverSnap.label, sx + 10, sy - 10);
                }
            }
        }

        function getHoveredTarget(screenX, screenY) {
            const threshold = 10;
            let frameV = getDisplayFrameV();
            
            function absToScreen(x, t) {
                let p = mapFrameToDisplay(x, t, null, frameV);
                return { x: mathToScreenX(p.x), y: mathToScreenY(p.t) };
            }

            function distToSegment(px, py, x1, y1, x2, y2) {
                let l2 = (x1 - x2)**2 + (y1 - y2)**2;
                if (l2 === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
            }

            function distToLine(px, py, x1, y1, x2, y2) {
                let l2 = (x1 - x2)**2 + (y1 - y2)**2;
                if (l2 === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
                return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
            }

            function checkElementPoints(el) {
                if (el.isValid === false) return null;
                if (el.type === 'event') {
                    let p = absToScreen(el.x, el.t);
                    if (Math.hypot(screenX - p.x, screenY - p.y) < threshold) {
                        return { type: 'x0', el };
                    }
                    return null;
                }
                
                let p1 = absToScreen(el.x1, el.t1);
                if (Math.hypot(screenX - p1.x, screenY - p1.y) < threshold) {
                    return { type: 'start', el };
                }
                
                if (el.limited && !el.endpointAtInfinity) {
                    let p2 = absToScreen(el.x2, el.t2);
                    if (Math.hypot(screenX - p2.x, screenY - p2.y) < threshold) {
                        return { type: 'end', el };
                    }
                }
                return null;
            }

            function checkElementLine(el) {
                if (el.isValid === false) return null;
                if (el.type === 'event') return null;
                
                let p1 = absToScreen(el.x1, el.t1);
                let p2 = absToScreen(el.x2, el.t2);
                const guideActive = focusedElementId === el.id && el.limited;
                
                if (el.limited && !el.endpointAtInfinity) {
                    if (distToSegment(screenX, screenY, p1.x, p1.y, p2.x, p2.y) < threshold) {
                        return { type: 'line', el };
                    }
                    // In focus: la guida infinita è draggabile come un vettore illimitato
                    if (guideActive && distToLine(screenX, screenY, p1.x, p1.y, p2.x, p2.y) < threshold) {
                        return { type: 'line', el };
                    }
                } else {
                    if (distToLine(screenX, screenY, p1.x, p1.y, p2.x, p2.y) < threshold) {
                        // Per raggio all'infinito: solo dal punto iniziale in avanti,
                        // tranne in focus dove la guida di velocità è bidirezionale
                        if (el.endpointAtInfinity && !guideActive) {
                            let dx = p2.x - p1.x, dy = p2.y - p1.y;
                            let along = (screenX - p1.x) * dx + (screenY - p1.y) * dy;
                            if (along < 0) return null;
                        }
                        return { type: 'line', el };
                    }
                }
                return null;
            }

            if (focusedElementId !== null) {
                let focusedEl = elements.find(e => e.id === focusedElementId);
                if (focusedEl) {
                    let hit = checkElementPoints(focusedEl);
                    if (hit) return hit;
                }
            }

            for (let i = elements.length - 1; i >= 0; i--) {
                let el = elements[i];
                if (el.id === focusedElementId) continue;
                let hit = checkElementPoints(el);
                if (hit) return hit;
            }
            
            if (focusedElementId !== null) {
                let focusedEl = elements.find(e => e.id === focusedElementId);
                if (focusedEl) {
                    let hit = checkElementLine(focusedEl);
                    if (hit) return hit;
                }
            }

            for (let i = elements.length - 1; i >= 0; i--) {
                let el = elements[i];
                if (el.id === focusedElementId) continue;
                let hit = checkElementLine(el);
                if (hit) return hit;
            }
            
            return null;
        }

        function scrollToElementCard(el) {
            setTimeout(() => {
                const card = document.getElementById(`element-card-${el.id}`);
                if (card) {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.scrollTo({
                        top: card.offsetTop - document.getElementById('add-line-btn').offsetTop - document.getElementById('add-line-btn').offsetHeight - 15,
                        behavior: 'smooth'
                    });
                }
            }, 50);
        }

        function resolveInteractionFromDependency(dep) {
            if (!dep || dep.type === 'fixed') return null;

            if (dep.type === 'event') {
                const el = elements.find(e => e.id === dep.elId);
                if (!el || el.isValid === false) return null;
                if (el.dependencies) {
                    return resolveInteractionFromDependency(el.dependencies);
                }
                return { focusEl: el, dragTarget: { type: 'x0', el } };
            }

            if (dep.type === 'movement_point') {
                const el = elements.find(e => e.id === dep.elId);
                if (!el || el.isValid === false) return null;

                let parentDep = null;
                if (el.dependencies) {
                    if (dep.pointType === 'movement_start') {
                        if (el.dependencies.type === 'start_point') parentDep = el.dependencies.pt;
                        else if (el.dependencies.type === 'points') parentDep = el.dependencies.p1;
                    } else if (dep.pointType === 'movement_end') {
                        if (el.dependencies.type === 'points') parentDep = el.dependencies.p2;
                    }
                }
                if (parentDep) {
                    const resolved = resolveInteractionFromDependency(parentDep);
                    if (resolved) return resolved;
                }

                if (dep.pointType === 'movement_start') {
                    if (el.dependencies && (el.dependencies.type === 'start_point' || el.dependencies.type === 'points')) {
                        return { focusEl: el, dragTarget: null };
                    }
                    return { focusEl: el, dragTarget: { type: 'start', el } };
                }
                if (dep.pointType === 'movement_end') {
                    if (el.dependencies && el.dependencies.type === 'points') {
                        return { focusEl: el, dragTarget: null };
                    }
                    if (!el.limited) return { focusEl: el, dragTarget: null };
                    return { focusEl: el, dragTarget: { type: 'end', el } };
                }
            }

            if (dep.type === 'intersection' && dep.lines && dep.lines.length > 0) {
                const el = elements.find(e => e.id === dep.lines[0].elId);
                if (!el || el.isValid === false) return null;
                return { focusEl: el, dragTarget: null };
            }

            return null;
        }

        function beginElementInteraction(target) {
            let focusEl = target.el;
            let dragTarget = null;
            let redirected = false;

            if (target.el.type === 'line' && (target.type === 'start' || target.type === 'end')) {
                const { startDep, endDep } = getLineEndpointDependencies(target.el);
                const dep = target.type === 'start' ? startDep : endDep;
                const resolved = resolveInteractionFromDependency(dep);
                if (resolved) {
                    focusEl = resolved.focusEl;
                    dragTarget = resolved.dragTarget;
                    redirected = true;
                }
            } else if (target.el.type === 'event' && target.el.dependencies) {
                const resolved = resolveInteractionFromDependency(target.el.dependencies);
                if (resolved) {
                    focusEl = resolved.focusEl;
                    dragTarget = resolved.dragTarget;
                    redirected = true;
                }
            }

            if (!redirected) {
                if (target.el.dependencies) {
                    if (target.el.type === 'line') {
                        if (target.el.dependencies.type === 'start_point') {
                            if (target.type === 'line' || target.type === 'end') {
                                dragTarget = target;
                            }
                        }
                    }
                } else {
                    dragTarget = target;
                }
            }

            if (dragTarget && dragTarget.el.type === 'line') {
                const lineEl = dragTarget.el;
                if (lineEl.endpointAtInfinity && lineEl.preservedProperAbs != null) {
                    const signI = lineEl.preservedProperKind === 'L0' ? 1 : -1;
                    dragTarget.initialI = signI * lineEl.preservedProperAbs * lineEl.preservedProperAbs;
                } else {
                    dragTarget.initialI = (lineEl.x2 - lineEl.x1)**2 - (lineEl.t2 - lineEl.t1)**2;
                    if (Math.abs(dragTarget.initialI) > 1e-9) {
                        lineEl.preservedProperAbs = Math.sqrt(Math.abs(dragTarget.initialI));
                        lineEl.preservedProperKind = dragTarget.initialI < 0 ? 'tau' : 'L0';
                        lineEl.preservedSignDt = (lineEl.t2 - lineEl.t1) >= 0 ? 1 : -1;
                    }
                }
            }

            draggingTarget = dragTarget;
            focusedElementId = focusEl.id;
            if (!focusEl.expanded) {
                focusEl.expanded = true;
                const card = document.getElementById(`element-card-${focusEl.id}`);
                if (card) {
                    const toggleExpand = card.querySelector('.toggle-expand');
                    const cardContent = card.querySelector('.card-content');
                    if (cardContent) cardContent.style.display = 'block';
                    if (toggleExpand) toggleExpand.textContent = '▼';
                }
            }
            updateSidebarUI();
            updateFocusedCardStyling();
            draw();
            scrollToElementCard(focusEl);
        }

        canvas.addEventListener('mousedown', e => {
            cancelViewAnimation();
            
            if (e.button === 2) {
                if (currentHoverSnap) {
                    isCreatingLineDrag = true;
                    lineDragStart = { x: currentHoverSnap.x, t: currentHoverSnap.t, snapInfo: currentHoverSnap.snapInfo };
                    lineDragCurrent = { x: currentHoverSnap.x, t: currentHoverSnap.t, snapInfo: currentHoverSnap.snapInfo };
                }
                return;
            }
            
            if (e.button !== 0) return; // Only handle left click here
            
            if (isCreatingLineClick) {
                if (lineClickStart && lineClickCurrent && (lineClickStart.x !== lineClickCurrent.x || lineClickStart.t !== lineClickCurrent.t)) {
                    isCreatingLineClick = false;
                    
                    const newLine = {
                        id: nextId++,
                        type: 'line',
                        x1: lineClickStart.x,
                        t1: lineClickStart.t,
                        x2: lineClickCurrent.x,
                        t2: lineClickCurrent.t,
                        color: colors[colorIndex % colors.length],
                        limited: false,
                        expanded: true,
                        visible: true,
                        showAxes: false,
                        viewRestFrame: false,
                        isValid: true
                    };
                    
                    let p1Dep = lineClickStart.snapInfo ? getDependencyFromSnap(lineClickStart.snapInfo) : null;
                    let p2Dep = lineClickCurrent.snapInfo ? getDependencyFromSnap(lineClickCurrent.snapInfo) : null;
                    
                    if (p1Dep && p2Dep) {
                        newLine.dependencies = {
                            type: 'points',
                            p1: p1Dep,
                            p2: p2Dep
                        };
                    } else if (p1Dep) {
                        newLine.dependencies = {
                            type: 'start_point',
                            pt: p1Dep
                        };
                    } else if (p2Dep) {
                        newLine.dependencies = {
                            type: 'points',
                            p1: { type: 'fixed', x: lineClickStart.x, t: lineClickStart.t },
                            p2: p2Dep
                        };
                    }
                    
                    colorIndex++;
                    focusedElementId = newLine.id;
                    elements.push(newLine);
                    updateDependencies();
                    createElementSidebar(newLine);
                    
                    saveState();

                    scrollToElementCard(newLine);
                } else {
                    return; // start and end points are the same, keep waiting
                }
                draw();
                return;
            }

            const target = getHoveredTarget(e.offsetX, e.offsetY);
            if (target) {
                beginElementInteraction(target);
            } else {
                isPanning = true;
                startPan = { x: e.offsetX, y: e.offsetY };
                startView = { x: view.x, t: view.t };
                canvas.style.cursor = 'grabbing';
                if (focusedElementId !== null) {
                    focusedElementId = null;
                    updateSidebarUI();
                    updateFocusedCardStyling();
                    draw();
                }
            }
        });

        canvas.addEventListener('dblclick', e => {
            if (e.button !== 0) return;
            const target = getHoveredTarget(e.offsetX, e.offsetY);
            if (target) {
                ensureElementVisible(target.el, true);
            }
        });

        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            if (isCreatingLineClick) {
                isCreatingLineClick = false;
                draw();
                return;
            }
            if (lineDragStart) {
                lineDragStart = null;
                return;
            }
            if (currentHoverSnap) {
                contextMenuSnap = { x: currentHoverSnap.x, t: currentHoverSnap.t, snapInfo: currentHoverSnap.snapInfo };
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            }
        });

        document.addEventListener('click', e => {
            if (e.target !== menuCreateEvent && e.target !== menuCreateLine) {
                contextMenu.style.display = 'none';
            }
        });

        menuCreateEvent.addEventListener('click', () => {
            contextMenu.style.display = 'none';
            if (contextMenuSnap) {
                const newEvent = {
                    id: nextId++,
                    type: 'event',
                    x: contextMenuSnap.x,
                    t: contextMenuSnap.t,
                    color: eventColors[eventColorIndex % eventColors.length],
                    expanded: true,
                    visible: true,
                    showLightCone: false,
                    isValid: true
                };
                
                if (contextMenuSnap.snapInfo) {
                    let dep = getDependencyFromSnap(contextMenuSnap.snapInfo);
                    if (dep) {
                        newEvent.dependencies = dep;
                    }
                }
                
                eventColorIndex++;
                focusedElementId = newEvent.id;
                elements.push(newEvent);
                updateDependencies();
                createElementSidebar(newEvent);
                draw();
                
                saveState();

                setTimeout(() => {
                    const card = document.getElementById(`element-card-${newEvent.id}`);
                    if (card) {
                        const sidebar = document.getElementById('sidebar');
                        sidebar.scrollTo({
                            top: card.offsetTop - document.getElementById('add-line-btn').offsetTop - document.getElementById('add-line-btn').offsetHeight - 15,
                            behavior: 'smooth'
                        });
                    }
                }, 50);
            }
        });

        menuCreateLine.addEventListener('click', () => {
            contextMenu.style.display = 'none';
            if (contextMenuSnap) {
                isCreatingLineClick = true;
                lineClickStart = { x: contextMenuSnap.x, t: contextMenuSnap.t, snapInfo: contextMenuSnap.snapInfo };
                lineClickCurrent = { x: contextMenuSnap.x, t: contextMenuSnap.t, snapInfo: contextMenuSnap.snapInfo };
                draw();
            }
        });

        let didChangeDuringDrag = false;

        canvas.addEventListener('mousemove', e => {
            processInteractionMove(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mouseup', e => {
            if (e.button === 2 && isCreatingLineDrag) {
                isCreatingLineDrag = false;
                if (lineDragStart && lineDragCurrent && (lineDragStart.x !== lineDragCurrent.x || lineDragStart.t !== lineDragCurrent.t)) {
                    const newLine = {
                        id: nextId++,
                        type: 'line',
                        visible: true,
                        expanded: true,
                        isValid: true,
                        limited: false,
                        showAxes: false,
                        viewRestFrame: false,
                        color: colors[colorIndex % colors.length]
                    };
                    colorIndex++;
                    
                    let p1Dep = lineDragStart.snapInfo ? getDependencyFromSnap(lineDragStart.snapInfo) : null;
                    let p2Dep = lineDragCurrent.snapInfo ? getDependencyFromSnap(lineDragCurrent.snapInfo) : null;
                    
                    if (p1Dep && p2Dep) {
                        newLine.dependencies = { type: 'points', p1: p1Dep, p2: p2Dep };
                    } else if (p1Dep) {
                        newLine.dependencies = { type: 'start_point', pt: p1Dep };
                    } else if (p2Dep) {
                        newLine.dependencies = { type: 'points', p1: { type: 'fixed', x: lineDragStart.x, t: lineDragStart.t }, p2: p2Dep };
                    } else {
                        // Nessuna dipendenza, linea libera
                    }
                    
                    newLine.x1 = lineDragStart.x;
                    newLine.t1 = lineDragStart.t;
                    newLine.x2 = lineDragCurrent.x;
                    newLine.t2 = lineDragCurrent.t;
                    
                    focusedElementId = newLine.id;
                    elements.push(newLine);
                    updateDependencies();
                    draw();
                    createElementSidebar(newLine);
                    
                    saveState();
                    
                    setTimeout(() => {
                        const card = document.getElementById(`element-card-${newLine.id}`);
                        if (card) {
                            const sidebar = document.getElementById('sidebar');
                            sidebar.scrollTo({
                                top: card.offsetTop - document.getElementById('add-line-btn').offsetTop - document.getElementById('add-line-btn').offsetHeight - 15,
                                behavior: 'smooth'
                            });
                        }
                    }, 50);
                } else {
                    lineDragStart = null;
                }
                draw();
                return;
            }

            if (didChangeDuringDrag) {
                saveState();
                didChangeDuringDrag = false;
            }
            draggingTarget = null;
            isPanning = false;
            canvas.style.cursor = 'grab';
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingVelocityForEl) {
                isDraggingVelocityForEl = null;
                draw();
            }
        });
        
        window.addEventListener('touchend', () => {
            if (isDraggingVelocityForEl) {
                isDraggingVelocityForEl = null;
                draw();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (didChangeDuringDrag) {
                saveState();
                didChangeDuringDrag = false;
            }
            isCreatingLineDrag = false;
            lineDragStart = null;
            draggingTarget = null;
            currentHoverTarget = null;
            isPanning = false;
            canvas.style.cursor = 'grab';
            draw();
        });

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            cancelViewAnimation();
            let factor;
            if (e.ctrlKey) {
                // Pinch to zoom su trackpad (Mac e alcuni Windows)
                factor = Math.exp(-e.deltaY / 100);
            } else {
                const zoomFactor = 1.1;
                const direction = e.deltaY < 0 ? 1 : -1;
                factor = Math.pow(zoomFactor, direction);
            }
            
            const xd = screenToMathX(e.offsetX);
            const td = screenToMathY(e.offsetY);
            
            view.scale *= factor;
            
            view.x = xd - (e.offsetX - canvas.width/2) / view.scale;
            view.t = td - (canvas.height/2 - e.offsetY) / view.scale;
            
            draw();
        }, { passive: false });

        let initialPinchDistance = null;
        let initialViewScale = null;
        let initialPinchMathX = null;
        let initialPinchMathT = null;

        function getTouchOffset(touch) {
            const rect = canvas.getBoundingClientRect();
            return {
                offsetX: touch.clientX - rect.left,
                offsetY: touch.clientY - rect.top
            };
        }

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            cancelViewAnimation();
            if (e.touches.length === 1) {
                const { offsetX, offsetY } = getTouchOffset(e.touches[0]);
                const target = getHoveredTarget(offsetX, offsetY);
                if (target) {
                    beginElementInteraction(target);
                } else {
                    isPanning = true;
                    startPan = { x: offsetX, y: offsetY };
                    startView = { x: view.x, t: view.t };
                    if (focusedElementId !== null) {
                        focusedElementId = null;
                        updateSidebarUI();
                        updateFocusedCardStyling();
                        draw();
                    }
                }
            } else if (e.touches.length === 2) {
                draggingTarget = null;
                isPanning = false;
                
                const t1 = getTouchOffset(e.touches[0]);
                const t2 = getTouchOffset(e.touches[1]);
                
                initialPinchDistance = Math.hypot(t2.offsetX - t1.offsetX, t2.offsetY - t1.offsetY);
                const centerX = (t1.offsetX + t2.offsetX) / 2;
                const centerY = (t1.offsetY + t2.offsetY) / 2;
                
                initialViewScale = view.scale;
                initialPinchMathX = screenToMathX(centerX);
                initialPinchMathT = screenToMathY(centerY);
            }
        }, { passive: false });

        function getLineFromElement(el, lineType) {
            if (el.type === 'event') {
                if (lineType === 'lightcone_right' && el.showLightCone) {
                    return { x0: el.x, t0: el.t, v: 1, isSegment: false };
                }
                if (lineType === 'lightcone_left' && el.showLightCone) {
                    return { x0: el.x, t0: el.t, v: -1, isSegment: false };
                }
            } else if (el.type === 'line' && lineType === 'line') {
                let v = (el.x2 - el.x1) / (el.t2 - el.t1);
                if (el.limited) {
                    let t1 = el.t1;
                    let t2 = el.t2;
                    return { x0: el.x1, t0: el.t1, v: v, isSegment: true, tMin: Math.min(t1, t2), tMax: Math.max(t1, t2) };
                } else {
                    return { x0: el.x1, t0: el.t1, v: v, isSegment: false };
                }
            }
            return null;
        }

        function resolveDependencyPoint(dep) {
            if (!dep) return null;
            if (dep.type === 'fixed') return { x: dep.x, t: dep.t };
            if (dep.type === 'event') {
                let parent = elements.find(e => e.id === dep.elId);
                if (parent && parent.isValid !== false) return { x: parent.x, t: parent.t };
                return null;
            }
            if (dep.type === 'movement_point') {
                let parent = elements.find(e => e.id === dep.elId);
                if (parent && parent.isValid !== false && parent.limited) {
                    if (dep.pointType === 'movement_start') return { x: parent.x1, t: parent.t1 };
                    if (dep.pointType === 'movement_end') return { x: parent.x2, t: parent.t2 };
                }
                return null;
            }
            if (dep.type === 'intersection') {
                let parent1 = elements.find(e => e.id === dep.lines[0].elId);
                let parent2 = elements.find(e => e.id === dep.lines[1].elId);
                if (!parent1 || !parent2 || parent1.isValid === false || parent2.isValid === false) return null;
                
                let l1 = getLineFromElement(parent1, dep.lines[0].lineType);
                let l2 = getLineFromElement(parent2, dep.lines[1].lineType);
                if (!l1 || !l2 || Math.abs(l1.v - l2.v) < 1e-6) return null;
                
                let c1 = l1.x0 - l1.v * l1.t0;
                let c2 = l2.x0 - l2.v * l2.t0;
                let t = (c2 - c1) / (l1.v - l2.v);
                let x = c1 + l1.v * t;
                
                if (l1.isSegment && (t < l1.tMin - 1e-5 || t > l1.tMax + 1e-5)) return null;
                if (l2.isSegment && (t < l2.tMin - 1e-5 || t > l2.tMax + 1e-5)) return null;
                
                return { x, t };
            }
            return null;
        }

        function updateDependencies() {
            for (let el of elements) {
                if (!el.dependencies) {
                    el.isValid = true;
                    continue;
                }
                
                if (el.dependencies.type === 'intersection' || el.dependencies.type === 'event' || el.dependencies.type === 'movement_point') {
                    let pt = resolveDependencyPoint(el.dependencies);
                    if (pt) {
                        el.x = pt.x;
                        el.t = pt.t;
                        el.isValid = true;
                    } else {
                        el.isValid = false;
                    }
                } else if (el.dependencies.type === 'start_point') {
                    let pt = resolveDependencyPoint(el.dependencies.pt);
                    if (pt) {
                        let dx = el.x2 - el.x1;
                        let dt = el.t2 - el.t1;
                        el.x1 = pt.x;
                        el.t1 = pt.t;
                        el.x2 = pt.x + dx;
                        el.t2 = pt.t + dt;
                        el.isValid = true;
                    } else {
                        el.isValid = false;
                    }
                } else if (el.dependencies.type === 'points') {
                    let p1 = resolveDependencyPoint(el.dependencies.p1);
                    let p2 = resolveDependencyPoint(el.dependencies.p2);
                    if (p1 && p2) {
                        el.x1 = p1.x;
                        el.t1 = p1.t;
                        el.x2 = p2.x;
                        el.t2 = p2.t;
                        el.isValid = true;
                    } else {
                        el.isValid = false;
                    }
                }
            }
        }

        function getDependencyFromSnap(snapInfo) {
            if (!snapInfo) return null;
            if (snapInfo.snapType === 'event') {
                return { type: 'event', elId: snapInfo.elId };
            } else if (snapInfo.snapType === 'movement_start' || snapInfo.snapType === 'movement_end') {
                return { type: 'movement_point', elId: snapInfo.elId, pointType: snapInfo.snapType };
            } else if (snapInfo.snapType === 'intersection') {
                return { 
                    type: 'intersection', 
                    lines: [
                        { elId: snapInfo.lines[0].elId, lineType: snapInfo.lines[0].lineType },
                        { elId: snapInfo.lines[1].elId, lineType: snapInfo.lines[1].lineType }
                    ] 
                };
            }
            return null;
        }

        function getSnapPoints() {
            let points = [];
            let lines = [];
            
            for (let el of elements) {
                if (el.isValid === false) continue;
                if (el.visible === false) continue;
                
                if (el.type === 'event') {
                    points.push({ x: el.x, t: el.t, label: `evento ${el.id}`, snapType: 'event', elId: el.id });
                    if (el.showLightCone) {
                        lines.push({ x0: el.x, t0: el.t, v: 1, isSegment: false, label: `cono di luce ${el.id}`, elId: el.id, lineType: 'lightcone_right' });
                        lines.push({ x0: el.x, t0: el.t, v: -1, isSegment: false, label: `cono di luce ${el.id}`, elId: el.id, lineType: 'lightcone_left' });
                    }
                } else if (el.type === 'line') {
                    if (el.limited) {
                        points.push({ x: el.x1, t: el.t1, label: `inizio linea ${el.id}`, snapType: 'movement_start', elId: el.id });
                        points.push({ x: el.x2, t: el.t2, label: `fine linea ${el.id}`, snapType: 'movement_end', elId: el.id });
                        
                        let v = (el.x2 - el.x1) / (el.t2 - el.t1);
                        lines.push({ x0: el.x1, t0: el.t1, v: v, isSegment: true, tMin: Math.min(el.t1, el.t2), tMax: Math.max(el.t1, el.t2), label: `linea ${el.id}`, elId: el.id, lineType: 'line' });
                    } else {
                        let v = (el.x2 - el.x1) / (el.t2 - el.t1);
                        lines.push({ x0: el.x1, t0: el.t1, v: v, isSegment: false, label: `linea ${el.id}`, elId: el.id, lineType: 'line' });
                    }
                }
            }
            
            for (let i = 0; i < lines.length; i++) {
                for (let j = i + 1; j < lines.length; j++) {
                    let l1 = lines[i];
                    let l2 = lines[j];
                    if (l1.elId === l2.elId) continue;
                    if (Math.abs(l1.v - l2.v) < 1e-6) continue;
                    let c1 = l1.x0 - l1.v * l1.t0;
                    let c2 = l2.x0 - l2.v * l2.t0;
                    let t = (c2 - c1) / (l1.v - l2.v);
                    let x = c1 + l1.v * t;
                    
                    if (l1.isSegment && (t < l1.tMin - 1e-5 || t > l1.tMax + 1e-5)) continue;
                    if (l2.isSegment && (t < l2.tMin - 1e-5 || t > l2.tMax + 1e-5)) continue;
                    
                    points.push({ x, t, label: `${l1.label} ∩ ${l2.label}`, snapType: 'intersection', lines: [l1, l2] });
                }
            }
            
            return points;
        }

        function getSnapPoint(mx, mt, excludeEl = null) {
            let points = getSnapPoints();
            let bestDist = Infinity;
            let bestPoint = null;
            let frameV = getDisplayFrameV();
            
            let mDisp = mapFrameToDisplay(mx, mt, null, frameV);
            let mScreenX = mathToScreenX(mDisp.x);
            let mScreenY = mathToScreenY(mDisp.t);

            for (let p of points) {
                if (excludeEl) {
                    if (p.elId === excludeEl.id) continue;
                    if (p.lines && p.lines.some(l => l.elId === excludeEl.id)) continue;
                }
                
                let pDisp = mapFrameToDisplay(p.x, p.t, null, frameV);
                let pScreenX = mathToScreenX(pDisp.x);
                let pScreenY = mathToScreenY(pDisp.t);
                
                let dist = Math.hypot(mScreenX - pScreenX, mScreenY - pScreenY);
                if (dist < 15 && dist < bestDist) {
                    bestDist = dist;
                    bestPoint = p;
                }
            }
            
            if (bestPoint) {
                return { x: bestPoint.x, t: bestPoint.t, point: bestPoint, isIntersection: bestPoint.snapType === 'intersection', label: bestPoint.label, snapInfo: bestPoint };
            }
            return null;
        }

        function processInteractionMove(offsetX, offsetY) {
            const xd = screenToMathX(offsetX);
            const td = screenToMathY(offsetY);
            let frameV = getDisplayFrameV();
            
            let activeFrameG = null;
            let axesElements = elements.filter(e => {
                if (!e.showAxes || e.isValid === false) return false;
                return true;
            });
            if (axesElements.length > 0) {
                let e = axesElements[axesElements.length - 1];
                let v = (e.x2 - e.x1) / (e.t2 - e.t1);
                let u = Math.abs(v) < 1.0 ? v : 1/v;
                let candidateFrameG = { v: u, x0: e.x1, t0: e.t1, color: e.color };
                if (Math.abs(Math.abs(candidateFrameG.v) - 1.0) >= 0.005) {
                    activeFrameG = candidateFrameG;
                }
            }

            let gCoords = mapDisplayToFrame(xd, td, frameV, activeFrameG);
            let mx_g = gCoords.x;
            let mt_g = gCoords.t;

            let abs = mapDisplayToFrame(xd, td, frameV, null);
            let mx = abs.x;
            let mt = abs.t;
            
            let rawStep = 50 / view.scale;
            let power = Math.round(Math.log2(rawStep));
            let step = Math.pow(2, power);
            
            let snapX_g = Math.round(mx_g / step) * step;
            let snapT_g = Math.round(mt_g / step) * step;

            let snapAbs = mapFrameToDisplay(snapX_g, snapT_g, activeFrameG, null);
            let snapX = snapAbs.x;
            let snapT = snapAbs.t;
            let isIntersectionSnap = false;
            let snapLabel = '';

            let snapPoint = getSnapPoint(mx, mt, draggingTarget ? draggingTarget.el : null);
            let bestPoint = null;
            if (snapPoint) {
                snapX = snapPoint.x;
                snapT = snapPoint.t;
                bestPoint = snapPoint.point;
                isIntersectionSnap = snapPoint.isIntersection;
                snapLabel = snapPoint.label;
            }
            
            currentHoverSnap = { x: snapX, t: snapT, isIntersection: isIntersectionSnap, label: snapLabel, snapInfo: bestPoint };

            if (isCreatingLineDrag) {
                lineDragCurrent = { x: snapX, t: snapT, snapInfo: bestPoint };
                draw();
                return;
            }

            if (isCreatingLineClick) {
                lineClickCurrent = { x: snapX, t: snapT, snapInfo: bestPoint };
                draw();
                return;
            }

            if (draggingTarget) {
                let snapDisp = mapFrameToDisplay(snapX, snapT, null, frameV);
                let snapScreenX = mathToScreenX(snapDisp.x);
                let snapScreenY = mathToScreenY(snapDisp.t);
                
                if (Math.hypot(offsetX - snapScreenX, offsetY - snapScreenY) < 15) {
                    mx = snapX;
                    mt = snapT;
                }
                
                const el = draggingTarget.el;

                if (draggingTarget.type === 'x0') {
                    if (el.type === 'event') {
                        el.x = mx;
                        el.t = mt;
                    }
                } else if (draggingTarget.type === 'end') {
                    if (el.type === 'line') {
                        let vx = el.x2 - el.x1;
                        let vt = el.t2 - el.t1;
                        let ux = mx - el.x1;
                        let ut = mt - el.t1;
                        let l2 = vx*vx + vt*vt;
                        if (l2 > 0) {
                            let k = (ux*vx + ut*vt) / l2;
                            el.x2 = el.x1 + k * vx;
                            el.t2 = el.t1 + k * vt;
                        } else {
                            el.x2 = mx;
                            el.t2 = mt;
                        }
                        el.endpointAtInfinity = false;
                        syncPreservedProperFromGeometry(el);
                    }
                } else if (draggingTarget.type === 'start') {
                    if (el.type === 'line') {
                        let dx = el.x2 - el.x1;
                        let dt = el.t2 - el.t1;
                        el.x1 = mx;
                        el.t1 = mt;
                        el.x2 = mx + dx;
                        el.t2 = mt + dt;
                        syncPreservedProperFromGeometry(el);
                    }
                } else if (draggingTarget.type === 'line') {
                    if (el.type === 'line') {
                        let I = draggingTarget.initialI !== undefined ? draggingTarget.initialI : ((el.x2 - el.x1)**2 - (el.t2 - el.t1)**2);
                        let dx_new = mx - el.x1;
                        let dt_new = mt - el.t1;
                        let Inew = dx_new**2 - dt_new**2;

                        if (Math.abs(I) > 1e-9 && Math.abs(Inew) < 1e-6) {
                            // Passaggio vicino al cono di luce: endpoint all'infinito, misura preservata
                            let signDt = dt_new >= 0 ? 1 : -1;
                            let vApprox = Math.abs(dt_new) > 1e-12 ? dx_new / dt_new : (dx_new >= 0 ? 1 : -1);
                            el.preservedProperAbs = Math.sqrt(Math.abs(I));
                            el.preservedProperKind = I < 0 ? 'tau' : 'L0';
                            placeEndpointAtInfinity(el, vApprox, signDt);
                        } else if (Math.abs(Inew) < 1e-6) {
                            // Segmento genuinamente nullo: preserva lunghezza euclidea
                            let L2 = el.endpointAtInfinity ? 1 : ((el.x2 - el.x1)**2 + (el.t2 - el.t1)**2);
                            let Lnew2 = dx_new**2 + dt_new**2;
                            let k = Lnew2 > 0 ? Math.sqrt(Math.max(L2, 1e-12) / Lnew2) : 1;
                            el.x2 = el.x1 + k * dx_new;
                            el.t2 = el.t1 + k * dt_new;
                            el.endpointAtInfinity = false;
                        } else {
                            let k = Math.sqrt(Math.abs(I) / Math.abs(Inew));
                            el.x2 = el.x1 + k * dx_new;
                            el.t2 = el.t1 + k * dt_new;
                            el.endpointAtInfinity = false;
                            el.preservedProperAbs = Math.sqrt(Math.abs(I));
                            el.preservedProperKind = (k * k * Inew) < 0 ? 'tau' : 'L0';
                            el.preservedSignDt = (el.t2 - el.t1) >= 0 ? 1 : -1;
                        }
                    }
                }
                
                updateDependencies();
                updateSidebarUI();
                draw();
                didChangeDuringDrag = true;
            } else if (isPanning) {
                const dx = (offsetX - startPan.x) / view.scale;
                const dt = (startPan.y - offsetY) / view.scale;
                view.x = startView.x - dx;
                view.t = startView.t - dt;
                draw();
            } else {
                const target = getHoveredTarget(offsetX, offsetY);
                currentHoverTarget = target;
                if (target) {
                    if (target.type === 'line' && target.el.viewRestFrame) {
                        canvas.style.cursor = 'pointer';
                    } else {
                        canvas.style.cursor = target.type === 'line' ? 'crosshair' : 'pointer';
                    }
                } else {
                    canvas.style.cursor = 'grab';
                }
                draw(); // to update hover snap
            }
        }

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                const { offsetX, offsetY } = getTouchOffset(e.touches[0]);
                processInteractionMove(offsetX, offsetY);
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const t1 = getTouchOffset(e.touches[0]);
                const t2 = getTouchOffset(e.touches[1]);
                
                const currentDistance = Math.hypot(t2.offsetX - t1.offsetX, t2.offsetY - t1.offsetY);
                const centerX = (t1.offsetX + t2.offsetX) / 2;
                const centerY = (t1.offsetY + t2.offsetY) / 2;
                
                const factor = currentDistance / initialPinchDistance;
                view.scale = initialViewScale * factor;
                
                view.x = initialPinchMathX - (centerX - canvas.width/2) / view.scale;
                view.t = initialPinchMathT - (canvas.height/2 - centerY) / view.scale;
                
                draw();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (e.touches.length === 0) {
                if (didChangeDuringDrag) {
                    saveState();
                    didChangeDuringDrag = false;
                }
                draggingTarget = null;
                isPanning = false;
                initialPinchDistance = null;
            } else if (e.touches.length === 1) {
                initialPinchDistance = null;
                const { offsetX, offsetY } = getTouchOffset(e.touches[0]);
                isPanning = true;
                startPan = { x: offsetX, y: offsetY };
                startView = { x: view.x, t: view.t };
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', () => {
            if (didChangeDuringDrag) {
                saveState();
                didChangeDuringDrag = false;
            }
            draggingTarget = null;
            isPanning = false;
            initialPinchDistance = null;
        });

        function updateFocusedCardStyling() {
            elements.forEach(el => {
                const card = document.getElementById(`element-card-${el.id}`);
                if (card) {
                    if (focusedElementId === el.id) {
                        card.style.boxShadow = `0 0 10px ${el.color}`;
                        card.style.backgroundColor = '#444';
                    } else {
                        card.style.boxShadow = 'none';
                        card.style.backgroundColor = '#333';
                    }
                }
            });
        }

        function isTypingTarget(target) {
            if (!target || target === document.body || target === document.documentElement) return false;
            if (target.isContentEditable) return true;
            const tag = target.tagName;
            if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
            if (tag === 'INPUT') {
                const type = (target.type || 'text').toLowerCase();
                // Checkbox, range, buttons: Canc must still delete the selected object
                return !['checkbox', 'radio', 'range', 'button', 'submit', 'reset', 'file', 'color'].includes(type);
            }
            return false;
        }

        function deleteElementById(id) {
            const elIndex = elements.findIndex(e => e.id === id);
            if (elIndex === -1) {
                if (focusedElementId === id) {
                    focusedElementId = null;
                    updateFocusedCardStyling();
                    draw();
                }
                return;
            }

            const el = elements[elIndex];
            let prevFrame = getDisplayFrameV() || { v: 0, x0: 0, t0: 0 };
            let wasRestFrame = el.viewRestFrame;

            elements = elements.filter(e => e.id !== id);

            // Keep selection on a remaining element so Canc can delete several in a row
            if (focusedElementId === id) {
                if (elements.length === 0) {
                    focusedElementId = null;
                } else {
                    const nextIndex = Math.min(elIndex, elements.length - 1);
                    focusedElementId = elements[nextIndex].id;
                }
            }

            elements.forEach(otherEl => {
                if (otherEl.dependencies) {
                    if (otherEl.dependencies.elId === id ||
                        (otherEl.dependencies.lines && otherEl.dependencies.lines.some(l => l.elId === id)) ||
                        (otherEl.dependencies.p1 && otherEl.dependencies.p1.elId === id) ||
                        (otherEl.dependencies.p2 && otherEl.dependencies.p2.elId === id) ||
                        (otherEl.dependencies.pt && otherEl.dependencies.pt.elId === id)) {
                        otherEl.isValid = false;
                    }
                }
            });

            if (wasRestFrame) {
                animationTargetEl = null;
                animationStartFrame = prevFrame;
                currentAnimatedFrame = prevFrame;
                animationStartTime = performance.now();
                requestAnimationFrame(updateAnimation);
            }

            const card = document.getElementById(`element-card-${id}`);
            if (card) card.remove();

            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                const activeTag = document.activeElement.tagName;
                if (activeTag === 'INPUT' || activeTag === 'BUTTON' || activeTag === 'SELECT' || activeTag === 'TEXTAREA') {
                    document.activeElement.blur();
                }
            }

            updateFocusedCardStyling();
            updateDependencies();
            updateSidebarUI();
            draw();
            saveState();
        }
