                const worldDiag = Math.hypot(width || 1, height || 1) / Math.min(zoom, 1);
                const maxHistory = Math.min(4000, Math.ceil(worldDiag / Math.max(cSpeed, 0.05)) + 10);
                for (let c of charges) {
                    if (!c.history) c.history = [];
                    c.history.push({ 
                        x: c.x, y: c.y, 
                        vx: c.vx || 0, vy: c.vy || 0, 
                        ax: c.ax || 0, ay: c.ay || 0 
                    });
                    if (c.history.length > maxHistory) c.history.shift();
                }
            } else { for (let c of charges) { c.history = []; } }

            // Una volta per frame: passo di quadratura della coda e cache di campo.
            frameOscPeriod = (physicsSpace === '2d' && simMode === 'dynamic') ? shortestOscillationPeriod() : 0;
            buildFieldCache();
            if (isToggleOn(ui.showFlow)) updateFlow(flowFrameDt());

            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            drawVoltageMap();
            if (isToggleOn(ui.showGrid)) drawGrid();
            if (isToggleOn(ui.checkFieldLines)) {
                if (lineMode === 'equipotential') drawEquipotentials();
                else drawFieldLines();
            }
            if (isToggleOn(ui.showFlow)) drawFlow();
            if (isToggleOn(ui.showField)) drawField();
            drawSensors();
            drawCharges();
            
            ctx.restore();
            
            if (simMode === 'dynamic' && dragTarget && charges.includes(dragTarget)) {
                ctx.save();
                ctx.translate(panX, panY);
                ctx.scale(zoom, zoom);
                ctx.beginPath();
                ctx.moveTo(dragTarget.x, dragTarget.y);
                ctx.lineTo(dragTarget.targetX, dragTarget.targetY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(dragTarget.targetX, dragTarget.targetY, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.restore();
            }
            
            requestAnimationFrame(render);
        }

        // --- Interaction ---
        function eventClientXY(e) {
            if (e.changedTouches && e.changedTouches.length) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            if (e.touches && e.touches.length) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function getMousePos(e, isPan = false) {
            const { x: clientX, y: clientY } = eventClientXY(e);
            const screen = getCanvasScreenPos(clientX, clientY);
            if (isPan) {
                return screen;
            }
            return screenToWorld(screen.x, screen.y);
        }

        function toolboxClickSpawnPos() {
            const toolbox = document.getElementById('toolbox');
            const canvasRect = canvas.getBoundingClientRect();
            const toolRect = toolbox.getBoundingClientRect();
            const radiusPx = CHARGE_RADIUS * zoom + 16;
            const sx = width / 2;
            let sy = (toolRect.top - canvasRect.top) - radiusPx;
            sy = Math.max(radiusPx + 8, Math.min(height - radiusPx - 8, sy));
            return screenToWorld(sx, sy);
        }

        function isClientOverToolbox(clientX, clientY) {
            const toolbox = document.getElementById('toolbox');
            if (!toolbox || clientX == null || clientY == null) return false;
            const r = toolbox.getBoundingClientRect();
            return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
        }

        function addToolboxItem(type, value, worldPos) {
            const newItem = {
                id: nextObjectId++,
                x: worldPos.x,
                y: worldPos.y,
                vx: 0,
                vy: 0,
                targetX: worldPos.x,
                targetY: worldPos.y,
                expanded: true
            };
            if (type === 'charge') {
                newItem.q = value;
                newItem.history = [];
                newItem.name = 'Q' + chargeCounter++;
                charges.push(newItem);
                assignObjectHue(newItem, chargeFamily(newItem.q));
                createChargeCard(newItem);
            } else {
                newItem.name = 'S' + sensorCounter++;
                newItem.scale = DEFAULT_SENSOR_SCALE;
                newItem.normLength = DEFAULT_SENSOR_NORM_LENGTH;
                newItem.normalize = false;
                newItem.vectorAnalysis = false;
                newItem.headToTail = false;
                sensors.push(newItem);
                assignObjectHue(newItem, 'sensor');
                createSensorCard(newItem);
            }
            return newItem;
        }

        function findDraggableAt(pos) {
            for (let i = charges.length - 1; i >= 0; i--) {
                const c = charges[i];
                if (Math.hypot(pos.x - c.x, pos.y - c.y) < CHARGE_RADIUS * 1.5) return c;
            }
            for (let i = sensors.length - 1; i >= 0; i--) {
                const s = sensors[i];
                if (Math.hypot(pos.x - s.x, pos.y - s.y) < 20) return s;
            }
            return null;
        }

        function updateCanvasCursor(e) {
            if (isPinching || pinchIgnoreRemaining) {
                setCanvasCursor('default');
                return;
            }
            if (dragTarget || isPanDragging) {
                setCanvasCursor('grabbing');
                return;
            }
            if (!e || e.touches) {
                setCanvasCursor('default');
                return;
            }
            setCanvasCursor(findDraggableAt(getMousePos(e)) ? 'grab' : 'default');
        }

        canvas.addEventListener('mousemove', updateCanvasCursor);
        canvas.addEventListener('mouseleave', () => {
            if (!dragTarget && !isPanDragging) setCanvasCursor('default');
        });

        canvas.addEventListener('mousedown', startDragCanvas);
        canvas.addEventListener('touchstart', startDragCanvas, { passive: false });

        function startDragCanvas(e) {
            if (e.touches && e.touches.length >= 2) {
                beginPinch(e);
                e.preventDefault();
                return;
            }
            if (isPinching || pinchIgnoreRemaining) {
                e.preventDefault();
                return;
            }

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartClientX = clientX;
            dragStartClientY = clientY;
            dragMoved = false;
            pendingOscStop = null;
            emptyClickCandidate = false;
            panMoved = false;

            const pos = getMousePos(e);
            const hit = findDraggableAt(pos);

            if (hit && charges.includes(hit)) {
                dragTarget = hit;
                dragOffsetX = hit.x - pos.x;
                dragOffsetY = hit.y - pos.y;
                hit.targetX = hit.x; hit.targetY = hit.y;
                if (hit.oscillation) pendingOscStop = hit;
                selectObject(hit, 'charge', true);
                if (hit.vx === undefined) { hit.vx = 0; hit.vy = 0; }
                isDraggingNew = false;
                setCanvasCursor('grabbing');
            } else if (hit) {
                dragTarget = hit;
                dragOffsetX = hit.x - pos.x;
                dragOffsetY = hit.y - pos.y;
                isDraggingNew = false;
                selectObject(hit, 'sensor', true);
                setCanvasCursor('grabbing');
            } else {
                isPanDragging = true;
                emptyClickCandidate = true;
                const panPos = getMousePos(e, true);
                panStartX = panPos.x - panX;
                panStartY = panPos.y - panY;
                setCanvasCursor('grabbing');
            }

            e.preventDefault();
        }


        window.startDragFromToolbox = function(e, type, value) {
            if (e && e.button != null && e.button !== 0) return;
            const start = eventClientXY(e);
            pendingToolbox = { type, value };
            isDraggingNew = true;
            dragMoved = false;
            dragTarget = null;
            emptyClickCandidate = false;
            dragStartClientX = start.x;
            dragStartClientY = start.y;
            dragOffsetX = 0;
            dragOffsetY = 0;
            setCanvasCursor('grabbing');

            const source = e && e.currentTarget;
            const pointerId = e && e.pointerId;
            if (source && pointerId != null && typeof source.setPointerCapture === 'function') {
                try { source.setPointerCapture(pointerId); } catch (_) {}
                const finishToolboxDrag = (ev) => {
                    if (ev.pointerId !== pointerId) return;
                    source.removeEventListener('pointerup', finishToolboxDrag);
                    source.removeEventListener('pointercancel', finishToolboxDrag);
                    source.removeEventListener('pointermove', onMove);
                    try { source.releasePointerCapture(pointerId); } catch (_) {}
                    onEnd(ev);
                };
                source.addEventListener('pointerup', finishToolboxDrag);
                source.addEventListener('pointercancel', finishToolboxDrag);
                source.addEventListener('pointermove', onMove);
            }
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });

        function onMove(e) {
            if (e.touches && e.touches.length >= 2) {
                if (!isPinching) beginPinch(e);
                applyPinchMove(e);
                e.preventDefault();
                return;
            }
            if (isPinching || pinchIgnoreRemaining) {
                e.preventDefault();
                return;
            }

            if (isPanDragging) {
                const pos = getMousePos(e, true);
                panX = pos.x - panStartX;
                panY = pos.y - panStartY;
                const { x: clientX, y: clientY } = eventClientXY(e);
                if (Math.hypot(clientX - dragStartClientX, clientY - dragStartClientY) > DRAG_SELECT_THRESHOLD) {
                    panMoved = true;
                }
                e.preventDefault();
                return;
            }

            const { x: clientX, y: clientY } = eventClientXY(e);
            if (pendingToolbox && !dragTarget) {
                if (Math.hypot(clientX - dragStartClientX, clientY - dragStartClientY) <= DRAG_SELECT_THRESHOLD) {
                    return;
                }
                dragMoved = true;
                dragTarget = addToolboxItem(pendingToolbox.type, pendingToolbox.value, getMousePos(e));
                pendingToolbox = null;
                setCanvasCursor('grabbing');
            }

            if (dragTarget) {
                setCanvasCursor('grabbing');
                if (!dragMoved && Math.hypot(clientX - dragStartClientX, clientY - dragStartClientY) > DRAG_SELECT_THRESHOLD) {
                    dragMoved = true;
                    if (pendingOscStop && pendingOscStop.oscillation) {
                        pendingOscStop.oscillation = null;
                        updateChargeCardUI(pendingOscStop);
                    }
                    pendingOscStop = null;
                }

                const pos = getMousePos(e);
                const desiredX = pos.x + dragOffsetX;
                const desiredY = pos.y + dragOffsetY;

                if (simMode === 'dynamic' && charges.includes(dragTarget)) {
                    dragTarget.targetX = desiredX;
                    dragTarget.targetY = desiredY;
                } else {
                    dragTarget.x = desiredX; dragTarget.y = desiredY;
                    dragTarget.targetX = desiredX; dragTarget.targetY = desiredY;
                    dragTarget.vx = 0; dragTarget.vy = 0;
                }
                e.preventDefault();
            }
        }

        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchend', onEnd);
        window.addEventListener('touchcancel', onEnd);

        function onEnd(e) {
            const remaining = e.touches ? e.touches.length : 0;
            if (isPinching) {
                if (remaining < 2) {
                    isPinching = false;
                    pinchIgnoreRemaining = remaining === 1;
                }
                if (e.cancelable) e.preventDefault();
                return;
            }
            if (pinchIgnoreRemaining) {
                if (remaining === 0) pinchIgnoreRemaining = false;
                return;
            }

            isPanDragging = false;

            if (pendingToolbox) {
                const item = addToolboxItem(pendingToolbox.type, pendingToolbox.value, toolboxClickSpawnPos());
                const kind = pendingToolbox.type === 'charge' ? 'charge' : 'sensor';
                pendingToolbox = null;
                isDraggingNew = false;
                dragTarget = null;
                selectObject(item, kind, true);
                emptyClickCandidate = false;
                panMoved = false;
                updateCanvasCursor(e);
                return;
            }

            if (dragTarget) {
                const wasNew = isDraggingNew;
                const dropped = dragTarget;
                const pt = eventClientXY(e);
                if (wasNew && isClientOverToolbox(pt.x, pt.y)) {
                    removeObject(dropped);
                } else if (!wasNew && dropped.y * zoom + panY > height - 80) {
                    removeObject(dropped);
                } else if (wasNew) {
                    const kind = charges.includes(dropped) ? 'charge' : 'sensor';
                    selectObject(dropped, kind, true);
                }
                dragTarget = null;
                isDraggingNew = false;
                pendingOscStop = null;
            } else if (emptyClickCandidate && !panMoved) {
                deselectAll();
            }
            emptyClickCandidate = false;
            panMoved = false;
            updateCanvasCursor(e);
        }

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // --- Object cards, selection, colors ---

        function objectCardId(kind, obj) {
            return `object-card-${kind}-${obj.id}`;
        }

        function getObjectCard(obj, kind) {
            return document.getElementById(objectCardId(kind, obj));
        }

        function refreshObjectCardColor(obj, kind) {
            applyCardAccent(getObjectCard(obj, kind), obj);
            updateFocusedCardStyling();
        }

        function updateFocusedCardStyling() {
            const sidebar = document.getElementById('controls');
            if (sidebar) {
                sidebar.classList.toggle('has-selection', !!(selectedCharge || selectedSensor));
            }
            document.querySelectorAll('#objects-list .object-card').forEach(card => {
                const id = parseInt(card.dataset.id, 10);
                const isFocused =
                    (card.dataset.kind === 'charge' && selectedCharge && selectedCharge.id === id) ||
                    (card.dataset.kind === 'sensor' && selectedSensor && selectedSensor.id === id);
                card.classList.toggle('is-selected', isFocused);
            });
        }

        function scrollToObjectCard(obj, kind) {
            setTimeout(() => {
                const card = getObjectCard(obj, kind);
                const sidebar = document.getElementById('controls');
                if (!card || !sidebar) return;
                const sidebarRect = sidebar.getBoundingClientRect();
                const cardRect = card.getBoundingClientRect();
                const top = sidebar.scrollTop + (cardRect.top - sidebarRect.top) - 12;
                sidebar.scrollTo({ top, behavior: 'smooth' });
            }, 50);
        }

        function expandObjectCard(obj, kind) {
            obj.expanded = true;
            setCardExpanded(getObjectCard(obj, kind), true);
        }

        function selectObject(obj, kind, scroll = true) {
            if (kind === 'charge') {
                selectedCharge = obj;
                selectedSensor = null;
            } else {
                selectedSensor = obj;
                selectedCharge = null;
            }
            if (obj) expandObjectCard(obj, kind);
            updateFocusedCardStyling();
            if (scroll && obj) scrollToObjectCard(obj, kind);
        }

        function deselectAll() {
            selectedCharge = null;
            selectedSensor = null;
            updateFocusedCardStyling();
        }

        function removeObject(obj) {
            const isCharge = charges.includes(obj);
            const kind = isCharge ? 'charge' : 'sensor';
            const card = getObjectCard(obj, kind);
            if (card) card.remove();
            if (isCharge) charges = charges.filter(c => c !== obj);
            else sensors = sensors.filter(s => s !== obj);
            if (selectedCharge === obj) selectedCharge = null;
            if (selectedSensor === obj) selectedSensor = null;
            updateFocusedCardStyling();
        }

        function bindCardSelection(card, obj, kind) {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.delete-btn, .toggle-expand')) return;
                selectObject(obj, kind, false);
            });
        }

                <div class="card-content">
                    <div class="control-group">
                        <div class="control-label-row">
                            <span>Charge</span>
                            <span>
                                <button type="button" class="stepper-btn btn-minus">−</button>

                            </span>

                    </div>
                    <div class="movement-options">
                        <div class="radio-switch-row">
                            <span>Movement <span class="opt-help" data-help="Puts the charge in periodic motion. Selecting the same mode again stops it." tabindex="0" role="button" aria-label="Info">i</span></span>
                            <div class="radio-switch">
                                <input type="radio" name="move-${rid}" id="move-h-${rid}" value="horizontal">
                                <label for="move-h-${rid}">Horiz.</label>
                                <input type="radio" name="move-${rid}" id="move-v-${rid}" value="vertical">
                                <label for="move-v-${rid}">Vert.</label>
                                <input type="radio" name="move-${rid}" id="move-c-${rid}" value="circular">
                                <label for="move-c-${rid}">Circ.</label>
                            </div>
                        </div>
                    </div>
                    <div class="osc-controls" style="display:none">
                        <div class="control-group">
                            <button type="button" class="state-toggle btn-play" aria-pressed="true">
                                <span class="state-toggle-mark" aria-hidden="true"></span>
                                <span class="state-toggle-label">Playing</span>
                            </button>
                        </div>
                        <div class="control-group">
                            <label>
                                <span>Speed (0 to c) <span class="opt-help" data-help="Maximum speed of the oscillation, as a fraction of the simulation speed of light." tabindex="0" role="button" aria-label="Info">i</span></span>
                                <span class="control-value" data-max="100%"><span class="val-freq">50%</span></span>
                            </label>
                            <input type="range" class="slider-freq" min="0" max="100" value="50">

                        <div class="control-group">
                            <label>
                                <span>Amplitude/Radius <span class="opt-help" data-help="Linear amplitude or orbital radius." tabindex="0" role="button" aria-label="Info">i</span></span>
                                <span class="control-value" data-max="300px"><span class="val-amp">100px</span></span>
                            </label>
                            <input type="range" class="slider-amp" min="10" max="300" value="100" step="10">
                        </div>
                    </div>
                </div>
            `;
            objectsList.appendChild(div);
            setupCollapsibleCard(div, c.expanded !== false);
            bindCardSelection(div, c, 'charge');

            div.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                removeObject(c);
            });
            div.querySelector('.btn-minus').addEventListener('click', (e) => {
                e.stopPropagation();
                adjustChargeValue(c, -1);
            });
            div.querySelector('.btn-plus').addEventListener('click', (e) => {
                e.stopPropagation();
                adjustChargeValue(c, 1);
            });
            div.querySelectorAll('input[name="move-' + rid + '"]').forEach(radio => {
                radio.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (c.oscillation && c.oscillation.type === radio.value) {
                        radio.checked = false;
                        stopChargeOscillation(c);
                    } else {
                        startChargeOscillation(c, radio.value);
                    }
                });
            });
            const playBtn = div.querySelector('.btn-play');
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!c.oscillation) return;
                c.oscillation.paused = !c.oscillation.paused;
                updateChargeCardUI(c);
            });
            div.querySelector('.slider-freq').addEventListener('input', (e) => {
                if (!c.oscillation) return;
                c.oscillation.sliderVal = parseInt(e.target.value, 10);
                div.querySelector('.val-freq').textContent = e.target.value + '%';
            });
            div.querySelector('.slider-amp').addEventListener('input', (e) => {
                if (!c.oscillation) return;
                c.oscillation.amplitude = parseInt(e.target.value, 10);
                div.querySelector('.val-amp').textContent = e.target.value + 'px';

        function createSensorCard(s) {

            const div = document.createElement('div');

            div.dataset.kind = 'sensor';
            div.dataset.id = String(s.id);
            applyCardAccent(div, s);
            div.style.cursor = 'pointer';
            div.style.transition = 'all 0.2s ease';
            div.innerHTML = `
                <div class="element-header">
                    <span class="toggle-expand">▼</span>
                    <strong class="header-title">${s.name}</strong>
                    <button type="button" class="delete-btn" title="Delete">&times;</button>
                </div>
                <div class="card-content">
                    <div class="control-group">
                        <label>
                            <span>Scale <span class="opt-help" data-help="When Normalize is off, Scale multiplies the measured field (logarithmic range). When Normalize is on, Scale is the arrow length in pixels (linear)." tabindex="0" role="button" aria-label="Info">i</span></span>

                                <span class="state-toggle-label">Vector Analysis</span>
                            </button>
                            <span class="opt-help" data-help="Decomposes the sensor arrow into the contribution of each charge." tabindex="0" role="button" aria-label="Info">i</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="toggle-with-help">
                            <button type="button" class="state-toggle btn-headtotail" aria-pressed="false">
                                <span class="state-toggle-mark" aria-hidden="true"></span>
                                <span class="state-toggle-label">Show head-to-tail rule</span>
                            </button>
                            <span class="opt-help" data-help="Geometric construction of the vector sum of the component vectors." tabindex="0" role="button" aria-label="Info">i</span>
                        </div>
                    </div>
                </div>
            `;
            objectsList.appendChild(div);
            setupCollapsibleCard(div, s.expanded !== false);
            bindCardSelection(div, s, 'sensor');

            div.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                removeObject(s);
            });
            div.querySelector('.slider-scale').addEventListener('input', (e) => {
                const t = parseFloat(e.target.value);
                if (s.normalize) {
                    s.normLength = t;
                    div.querySelector('.val-scale').textContent = Math.round(t) + 'px';
                } else {
                    s.scale = sensorScaleFromSlider(t);
                    div.querySelector('.val-scale').textContent = formatSensorScaleValue(s.scale);
                }
            });
            const normalizeBtn = div.querySelector('.btn-normalize');
            normalizeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                s.normalize = !s.normalize;
                updateSensorCardUI(s);
            });
            const analysisBtn = div.querySelector('.btn-analysis');
            analysisBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                s.vectorAnalysis = !s.vectorAnalysis;
                setStateToggle(analysisBtn, s.vectorAnalysis);
            });
            const httBtn = div.querySelector('.btn-headtotail');
            httBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                s.headToTail = !s.headToTail;
                setStateToggle(httBtn, s.headToTail);
            });
            updateSensorCardUI(s);
        }

        function updateChargeCardUI(c) {
            const card = getObjectCard(c, 'charge');
            if (!card) return;
            const valueEl = card.querySelector('.charge-value');
            if (valueEl) valueEl.textContent = c.q + ' nC';
            const move = card.querySelector('.movement-options');
            if (move) move.style.display = (simMode === 'static') ? 'none' : '';
            const oscBox = card.querySelector('.osc-controls');
            const radios = card.querySelectorAll('input[type="radio"]');
            if (c.oscillation) {
                if (oscBox) oscBox.style.display = '';
                radios.forEach(r => { r.checked = r.value === c.oscillation.type; });
                const osc = c.oscillation;
                const freq = card.querySelector('.slider-freq');
                const amp = card.querySelector('.slider-amp');
                const valFreq = card.querySelector('.val-freq');
                const valAmp = card.querySelector('.val-amp');
                if (freq) freq.value = osc.sliderVal || 50;
                if (valFreq) valFreq.textContent = (osc.sliderVal || 50) + '%';
                if (amp) amp.value = osc.amplitude;
                if (valAmp) valAmp.textContent = osc.amplitude + 'px';
                const playBtn = card.querySelector('.btn-play');
                setStateToggle(playBtn, !osc.paused);
                const playLabel = card.querySelector('.btn-play .state-toggle-label');
                if (playLabel) playLabel.textContent = osc.paused ? 'Paused' : 'Playing';
            } else {
                if (oscBox) oscBox.style.display = 'none';
                radios.forEach(r => { r.checked = false; });
            }
        }

        function syncSensorScaleSlider(card, s) {
            const slider = card.querySelector('.slider-scale');
            const valEl = card.querySelector('.val-scale');
            const maxEl = card.querySelector('.control-group .control-value');
            if (!slider) return;
            if (s.normalize) {
                const len = Math.round(Math.min(SENSOR_NORM_MAX, Math.max(SENSOR_NORM_MIN, getSensorNormLength(s))));
                s.normLength = len;
                slider.min = String(SENSOR_NORM_MIN);
                slider.max = String(SENSOR_NORM_MAX);
                slider.step = '1';
                slider.value = String(len);
                if (valEl) valEl.textContent = len + 'px';
                if (maxEl) maxEl.setAttribute('data-max', SENSOR_NORM_MAX + 'px');
            } else {
                const scale = getSensorFieldScale(s);
                slider.min = '0';
                slider.max = '100';
                slider.step = '1';
                slider.value = String(sensorSliderFromScale(scale));
                if (valEl) valEl.textContent = formatSensorScaleValue(scale);
                if (maxEl) maxEl.setAttribute('data-max', SENSOR_SCALE_MAX + 'px');
            }
        }

        function updateSensorCardUI(s) {
            const card = getObjectCard(s, 'sensor');
            if (!card) return;
            setStateToggle(card.querySelector('.btn-normalize'), !!s.normalize);
            setStateToggle(card.querySelector('.btn-analysis'), !!s.vectorAnalysis);
            setStateToggle(card.querySelector('.btn-headtotail'), !!s.headToTail);
            syncSensorScaleSlider(card, s);
        }

        function adjustChargeValue(c, delta) {
            const prevFamily = chargeFamily(c.q);
            c.q += delta;
            if (chargeFamily(c.q) !== prevFamily) {
                assignObjectHue(c, chargeFamily(c.q));
                refreshObjectCardColor(c, 'charge');
            }
            updateChargeCardUI(c);
        }

        function startChargeOscillation(c, type) {
            c.oscillation = {
                type,
                centerX: c.x,
                centerY: c.y,
                amplitude: (c.oscillation && c.oscillation.amplitude) || 100,
                phase: 0,
                paused: false,
                sliderVal: (c.oscillation && c.oscillation.sliderVal) || 50
            };
            updateChargeCardUI(c);
        }

        function stopChargeOscillation(c) {
            c.oscillation = null;
            updateChargeCardUI(c);
        }

        window.clearAll = function() {
            charges = [];
            sensors = [];
            selectedCharge = null;
            selectedSensor = null;
            const list = document.getElementById('objects-list');
            if (list) list.innerHTML = '';
            updateFocusedCardStyling();
        };

        // --- Author Contact ---
        window.toggleAuthorInfo = function() {
            const footer = document.getElementById('author-footer');
            const isExpanded = footer.getAttribute('data-expanded') === 'true';
            
            if (isExpanded) {
                // Ripristina stato iniziale
                footer.innerHTML = "Contact the Author";
                footer.setAttribute('data-expanded', 'false');
            } else {
                // Decifra e mostra
                const revEmail = "moc.liamg@ecsidocram";
                const email = reverseString(revEmail);
                
                footer.innerHTML = `<a href="mailto:${email}">${email}</a>`;
                footer.setAttribute('data-expanded', 'true');
            }
        };

        window.reverseString = function(str) {
            return str.split("").reverse().join("");
        };

        function setupOptionHelp() {
            const GAP = 8;
            const tip = document.createElement('div');
            tip.id = 'opt-tooltip';
            tip.setAttribute('role', 'tooltip');
            tip.hidden = true;
            document.body.appendChild(tip);

            const controls = document.getElementById('controls');
            let current = null;
            let touchPinned = false;

            function closestHelp(node) {
                if (!node) return null;
                if (node.nodeType !== 1) node = node.parentElement;
                return node && node.closest ? node.closest('.opt-help') : null;
            }

            function placeTip(anchor) {
                const r = anchor.getBoundingClientRect();
                const tw = tip.offsetWidth;
                const th = tip.offsetHeight;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                let top = r.top - th - GAP;
                if (top < GAP) top = r.bottom + GAP;
                if (top + th > vh - GAP) top = Math.max(GAP, vh - th - GAP);
                let left = r.left;
                if (left + tw > vw - GAP) left = vw - tw - GAP;
                if (left < GAP) left = GAP;
                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            }

            function showTip(el) {
                const text = el.getAttribute('data-help');
                if (!text) return;
                current = el;
                tip.textContent = text;
                tip.hidden = false;
                placeTip(el);
            }

            function hideTip() {
                current = null;
                touchPinned = false;
                tip.hidden = true;
            }

            controls.addEventListener('pointerover', (e) => {
                if (e.pointerType === 'touch') return;
                const el = closestHelp(e.target);
                if (el) showTip(el);
            });

            controls.addEventListener('pointerout', (e) => {
                if (e.pointerType === 'touch') return;
                const leaving = closestHelp(e.target);
                if (!leaving) return;
                const entering = closestHelp(e.relatedTarget);
                if (!entering) hideTip();
            });

            controls.addEventListener('focusin', (e) => {
                const el = closestHelp(e.target);
                if (el) showTip(el);
            });

            controls.addEventListener('focusout', (e) => {
                const leaving = closestHelp(e.target);
                if (!leaving) return;
                const entering = closestHelp(e.relatedTarget);
                if (!entering) hideTip();
            });

            controls.addEventListener('pointerdown', (e) => {
                const help = closestHelp(e.target);
                if (help) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.pointerType === 'touch') {
                        if (current === help && touchPinned) hideTip();
                        else {
                            touchPinned = true;
                            showTip(help);
                        }
                    }
                    return;
                }
                if (e.pointerType === 'touch') hideTip();
            }, true);

            controls.addEventListener('click', (e) => {
                if (closestHelp(e.target)) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            document.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'touch') return;
                if (!e.target.closest || !e.target.closest('.opt-help')) hideTip();
            });

            window.addEventListener('scroll', () => {
                if (current) placeTip(current);
            }, true);
            window.addEventListener('resize', () => {
                if (current) placeTip(current);
            });
        }

        // Initial render start
        setInitialValues();
        setupOptionHelp();
        render();

    </script>
</body>
</html>
