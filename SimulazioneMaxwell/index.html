            let x1 = b.right + w * FIELD_CACHE_MARGIN;
            let y1 = b.bottom + h * FIELD_CACHE_MARGIN;
            if (needLines) {
                const frame = fieldLineClusterFrame();
                if (frame) {
                    const pad = frame.radius + FIELD_CACHE_STEP;
                    x0 = Math.min(x0, frame.cx - pad);
                    y0 = Math.min(y0, frame.cy - pad);
                    x1 = Math.max(x1, frame.cx + pad);
                    y1 = Math.max(y1, frame.cy + pad);
                }
            }
            const spanX = x1 - x0;
            const spanY = y1 - y0;

            let step = getLodSpacing(FIELD_CACHE_STEP);
            let nx = Math.ceil(spanX / step) + 2;
            let ny = Math.ceil(spanY / step) + 2;
            while (nx * ny > FIELD_CACHE_MAX_CELLS) {
                step *= 2;
                nx = Math.ceil(spanX / step) + 2;
                ny = Math.ceil(spanY / step) + 2;
            }

            const n = nx * ny;
            if (!fieldCache.ex || fieldCache.ex.length < n) {
                fieldCache.ex = new Float32Array(n);
                fieldCache.ey = new Float32Array(n);
                fieldCache.v = new Float32Array(n);
            }
            for (let j = 0; j < ny; j++) {
                const yy = y0 + j * step;
                const row = j * nx;
                for (let i = 0; i < nx; i++) {
                    const xx = x0 + i * step;
                    let ex = 0, ey = 0, v = 0;
                    for (let c of charges) {
                        const r = getFieldPotential2D(c, xx, yy, _scratch2D);
                        ex += r.x; ey += r.y; v += r.V;
                    }
                    fieldCache.ex[row + i] = ex;
                    fieldCache.ey[row + i] = ey;
                    fieldCache.v[row + i] = v;
                }
            }
            fieldCache.x0 = x0; fieldCache.y0 = y0; fieldCache.step = step;
            fieldCache.nx = nx; fieldCache.ny = ny;
            fieldCache.exactRadius = Math.max(R_NEAR_2D, 2 * step);
            fieldCache.active = true;
        }

        // Vicino alle cariche la griglia e' troppo grossa (E va come 1/R, V come ln R):
        // li' si calcola esatto, cosi' le linee partono pulite.
        function nearAnyCharge(x, y, radius) {
            const r2 = radius * radius;
            for (let c of charges) {
                const dx = x - c.x, dy = y - c.y;
                if (dx * dx + dy * dy < r2) return true;
            }
            return false;
        }

        function exactFieldPotential2D(x, y, out) {
            out.x = 0; out.y = 0; out.V = 0;
            for (let c of charges) {
                const r = getFieldPotential2D(c, x, y, _scratch2D);
                out.x += r.x; out.y += r.y; out.V += r.V;
            }
            return out;
        }

        function sampledFieldPotential2D(x, y, out) {
            if (!fieldCache.active || nearAnyCharge(x, y, fieldCache.exactRadius)) {
                return exactFieldPotential2D(x, y, out);
            }
            const gx = (x - fieldCache.x0) / fieldCache.step;
            const gy = (y - fieldCache.y0) / fieldCache.step;
            if (gx < 0 || gy < 0 || gx > fieldCache.nx - 1.001 || gy > fieldCache.ny - 1.001) {
                return exactFieldPotential2D(x, y, out);
            }
            const i = gx | 0, j = gy | 0;
            const fx = gx - i, fy = gy - j;
            const nx = fieldCache.nx;
            const a = j * nx + i, b = a + 1, cc = a + nx, d = cc + 1;
            const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy);
            const w01 = (1 - fx) * fy, w11 = fx * fy;
            const ex = fieldCache.ex, ey = fieldCache.ey, vv = fieldCache.v;
            out.x = ex[a] * w00 + ex[b] * w10 + ex[cc] * w01 + ex[d] * w11;
            out.y = ey[a] * w00 + ey[b] * w10 + ey[cc] * w01 + ey[d] * w11;
            out.V = vv[a] * w00 + vv[b] * w10 + vv[cc] * w01 + vv[d] * w11;
            return out;
        }

        // --- Rendering ---
        function drawGrid() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const bounds = getWorldBounds();
            const spacing = getLodSpacing(gridSpacing);
            const startX = Math.floor(bounds.left / spacing) * spacing;
            const startY = Math.floor(bounds.top / spacing) * spacing;
            for (let x = startX; x < bounds.right; x += spacing) {
                ctx.moveTo(x, bounds.top); ctx.lineTo(x, bounds.bottom);
            }
            for (let y = startY; y < bounds.bottom; y += spacing) {
                ctx.moveTo(bounds.left, y); ctx.lineTo(bounds.right, y);
            }
            ctx.stroke();
        }

        // Helper per convertire HSB/HSV in RGB
        // h, s, v sono in range [0, 1]
        function hsvToRgbChannels(h, s, v) {
            let r, g, b;
            const i = Math.floor(h * 6);
            const f = h * 6 - i;
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return {
                r: Math.floor(r * 255),
                g: Math.floor(g * 255),
                b: Math.floor(b * 255)
            };
        }

        function hsvToRgb(h, s, v) {
            const c = hsvToRgbChannels(h, s, v);
            return `rgb(${c.r},${c.g},${c.b})`;
        }

        function hsvToRgba(h, s, v, alpha = 1) {
            const c = hsvToRgbChannels(h, s, v);
            return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
        }

        function drawVoltageMap() {
            if (!isToggleOn(ui.showVoltage)) return;
            const alpha = parseFloat(ui.sliderVoltage.value) / 100;
            if (alpha <= 0) return;

            ctx.save();
            ctx.globalAlpha = alpha;
            const bounds = getWorldBounds();
            const res = getLodSpacing(potentialResolution);
            const startX = Math.floor(bounds.left / res) * res;
            const startY = Math.floor(bounds.top / res) * res;
            // In 2D il potenziale e' un logaritmo: liscio, quindi campionarlo dalla cache
            // bilineare non perde nulla, e la taratura vuole un divisore suo.
            const is2D = physicsSpace === '2d';
            const scale = is2D ? VOLTAGE_SCALE_2D : 300;
            for (let y = startY; y < bounds.bottom; y += res) {
                for (let x = startX; x < bounds.right; x += res) {
                    const V = is2D
                        ? sampledFieldPotential2D(x + res / 2, y + res / 2, _sample2D).V
                        : getPotentialAt(x + res / 2, y + res / 2);
                    const intensity = Math.min(Math.abs(V) / scale, 1);
                    if (intensity > 0.05) {
                        const p = getPolarityHs(V > 0);
                        ctx.fillStyle = hsvToRgb(p.h, p.s, intensity * POLARITY_MAP_V);
                        ctx.fillRect(x, y, res, res);
                    }
                }
            }
            ctx.restore();
        }

        function drawArrow(x, y, angle, magnitude) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            const minAlpha = parseFloat(ui.sliderBrightness.value) / 100;
            const saturation = Math.min(magnitude / 5, 1);
            const alpha = minAlpha + (1 - minAlpha) * saturation;

            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            
            let arrowLen = gridSpacing * arrowSizeFactor;

            const headLen = arrowLen * 0.4, headWidth = headLen * 0.7, indent = headLen * 0.3;
            const arrowWidth = Math.max(2, arrowLen * 0.15);
            const shaftEnd = arrowLen / 2 - headLen + indent;

            if (arrowLen > 2) {
                // Calcola il punto di intersezione tra l'asta e il retro della punta per unire le forme
                const intersectionX = shaftEnd - (arrowWidth * indent) / (2 * headWidth);

                ctx.beginPath();
                // Asta (coda)
                ctx.moveTo(-arrowLen / 2, arrowWidth / 2);
                ctx.lineTo(-arrowLen / 2, -arrowWidth / 2);
                // Congiunzione asta-punta superiore
                ctx.lineTo(intersectionX, -arrowWidth / 2);
                // Punta superiore
                ctx.lineTo(arrowLen / 2 - headLen, -headWidth);
                // Vertice punta
                ctx.lineTo(arrowLen / 2, 0);
                // Punta inferiore
                ctx.lineTo(arrowLen / 2 - headLen, headWidth);
                // Congiunzione asta-punta inferiore
                ctx.lineTo(intersectionX, arrowWidth / 2);
                
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function drawFieldLineArrowHead(x, y, angle, alpha) {
            const a = alpha == null ? FIELD_LINE_BASE_ALPHA : alpha;
            if (a < 0.02) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.fillStyle = 'rgba(255, 255, 255, ' + a + ')';

            const headLen = gridSpacing * arrowSizeFactor * 0.28;
            const headWidth = headLen * 0.7;
            const indent = headLen * 0.3;

            if (headLen > 2) {
                ctx.beginPath();
                ctx.moveTo(headLen / 2, 0);
                ctx.lineTo(-headLen / 2, -headWidth);
                ctx.lineTo(-headLen / 2 + indent, 0);
                ctx.lineTo(-headLen / 2, headWidth);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function pointInWorldBounds(p, bounds) {
            return p.x >= bounds.left && p.x <= bounds.right &&
                   p.y >= bounds.top && p.y <= bounds.bottom;
        }

        function clipInsideToOutside(inside, outside, bounds) {
            const dx = outside.x - inside.x;
            const dy = outside.y - inside.y;
            let t = 1;
            if (dx > 0) t = Math.min(t, (bounds.right - inside.x) / dx);
            else if (dx < 0) t = Math.min(t, (bounds.left - inside.x) / dx);
            if (dy > 0) t = Math.min(t, (bounds.bottom - inside.y) / dy);
            else if (dy < 0) t = Math.min(t, (bounds.top - inside.y) / dy);
            t = Math.max(0, Math.min(1, t));
            return { x: inside.x + dx * t, y: inside.y + dy * t };
        }

        function polylineArcLength(pts) {
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
                total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
            }
            return total;
        }

        function polylineArcMidpoint(pts) {
            const total = polylineArcLength(pts);
            if (total < 1e-6) return null;
            let remaining = total / 2;
            for (let i = 1; i < pts.length; i++) {
                const dx = pts[i].x - pts[i - 1].x;
                const dy = pts[i].y - pts[i - 1].y;
                const len = Math.hypot(dx, dy);
                if (remaining <= len || i === pts.length - 1) {
                    const t = len > 0 ? Math.max(0, Math.min(1, remaining / len)) : 0;
                    return {
                        x: pts[i - 1].x + dx * t,
                        y: pts[i - 1].y + dy * t,
                        length: total
                    };
                }
                remaining -= len;
            }
            return null;
        }

        function longestVisibleFieldLineBranch(points, bounds) {
            if (points.length < 2) return null;

            let best = null;
            let bestLen = -1;
            let runStart = -1;

            const considerRun = (firstInside, endExclusive) => {
                const branch = [];
                if (firstInside > 0) {
                    branch.push(clipInsideToOutside(points[firstInside], points[firstInside - 1], bounds));
                }
                for (let i = firstInside; i < endExclusive; i++) {
                    branch.push(points[i]);
                }
                if (endExclusive < points.length) {
                    branch.push(clipInsideToOutside(points[endExclusive - 1], points[endExclusive], bounds));
                }
                if (branch.length < 2) return;
                const len = polylineArcLength(branch);
                if (len > bestLen) {
                    bestLen = len;
                    best = branch;
                }
            };

            for (let i = 0; i < points.length; i++) {
                if (pointInWorldBounds(points[i], bounds)) {
                    if (runStart < 0) runStart = i;
                } else if (runStart >= 0) {
                    considerRun(runStart, i);
                    runStart = -1;
                }
            }
            if (runStart >= 0) considerRun(runStart, points.length);
            return best;
        }

        // Filtro di unicita' delle linee: due intersezioni sul cerchio di una carica
        // sono "la stessa linea" se piu' vicine di questa frazione del passo angolare nominale.
        // < 1 cosi' i semi uniformi della stessa carica non si eliminano a vicenda.
        const FIELD_LINE_GAP_FACTOR = 0.8;
        // Sul cerchio lontano il passo e' 2pi / |Q_net|, non 2pi / |q_i|.
        // Fattore piu' basso: si scartano solo gli attraversamenti quasi coincidenti,
        // senza mangiare i semi netti vicini ne' i grandi anelli +/− che sfiorano il cerchio.
        const FIELD_LINE_FAR_GAP_FACTOR = 0.45;
        const FIELD_LINE_BASE_ALPHA = 0.5;
        const FIELD_LINE_FILTER_FADE_MS = 1200;
        const fieldLineFadeAlphas = new Map();
        let fieldLineFadeLastMs = 0;
        let fieldLineFadeSeen = null;
        let fieldLineFadeStepSize = 0;

        function fieldLineFadeStep() {
            const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : frameCount * 16.67;
            const dt = fieldLineFadeLastMs > 0
                ? Math.min(0.08, Math.max(0, (now - fieldLineFadeLastMs) / 1000))
                : 1 / 60;
            fieldLineFadeLastMs = now;
            return dt / (FIELD_LINE_FILTER_FADE_MS / 1000);
        }

        function stepFieldLineFade(id, accepted) {
            const target = accepted ? 1 : 0;
            let a = fieldLineFadeAlphas.has(id) ? fieldLineFadeAlphas.get(id) : 0;
            const step = fieldLineFadeStepSize;
            if (a < target) a = Math.min(target, a + step);
            else if (a > target) a = Math.max(target, a - step);
            if (fieldLineFadeSeen) fieldLineFadeSeen.add(id);
            if (a <= 0.001 && !accepted) {
                fieldLineFadeAlphas.delete(id);
                return 0;
            }
            fieldLineFadeAlphas.set(id, a);
            return a;
        }

        function pruneFieldLineFade() {
            if (!fieldLineFadeSeen) return;
            const drop = [];
            fieldLineFadeAlphas.forEach((a, id) => {
                if (fieldLineFadeSeen.has(id)) return;
                a = Math.max(0, a - fieldLineFadeStepSize);
                if (a <= 0.001) drop.push(id);
                else fieldLineFadeAlphas.set(id, a);
            });
            for (let i = 0; i < drop.length; i++) fieldLineFadeAlphas.delete(drop[i]);
        }

        function fieldLineSeedCount(charge) {
            const linesPerNc = 1500 / fieldLineGridSpacing;
            const raw = Math.min(Math.abs(charge.q) * linesPerNc, 100);
            if (raw <= 0) return 0;
            return Math.min(100, Math.max(1, Math.round(raw)));
        }

        // I semi sulle cariche coprono solo i collegamenti + ↔ −.
        // Il flusso da/verso l'infinito e' dei semi sul cerchio esterno:
        // senza carica opposta non si semina in locale (evita i doppioni monopolari).
        function fieldLineLocalSeedCount(charge, totals) {
            if (Math.min(totals.pos, totals.neg) <= 0) return 0;
            return fieldLineSeedCount(charge);
        }

        function wrapAngle(a) {
            const tau = Math.PI * 2;
            a %= tau;
            if (a < 0) a += tau;
            return a;
        }

        // Porta l'angolo di arrivo sulla griglia dei semi della carica, cosi'
        // il filtro locale non manca lo slot per un errore di integrazione.
        function nearestSeedSlot(angle, n) {
            if (n <= 0) return wrapAngle(angle);
            const tau = Math.PI * 2;
            const slot = Math.round(wrapAngle(angle) / tau * n) % n;
            return slot * tau / n;
        }

        function fieldLinePolarityTotals() {
            let pos = 0;
            let neg = 0;
            for (let i = 0; i < charges.length; i++) {
                const q = charges[i].q;
                if (q > 0) pos += q;
                else if (q < 0) neg += -q;
            }
            return { pos, neg, net: pos - neg };
        }

        // Cerchio dei semi lontani: agganciato alle cariche, non alla vista.
        // Centro in |q| (il baricentro segnato diverge se Q_net ~ 0).
        function fieldLineClusterFrame() {
            let absQ = 0;
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < charges.length; i++) {
                const w = Math.abs(charges[i].q);
                if (w <= 0) continue;
                absQ += w;
                cx += w * charges[i].x;
                cy += w * charges[i].y;
            }
            if (absQ <= 0) return null;
            cx /= absQ;
            cy /= absQ;
            let enclose = 0;
            for (let i = 0; i < charges.length; i++) {
                if (!charges[i].q) continue;
                const d = Math.hypot(charges[i].x - cx, charges[i].y - cy) + CHARGE_RADIUS;
                if (d > enclose) enclose = d;
            }
            const radius = Math.max(
                FIELD_LINE_FAR_RADIUS_FACTOR * enclose,
                FIELD_LINE_FAR_RADIUS_MIN_FACTOR * CHARGE_RADIUS
            );
            return { cx, cy, radius };
        }

        // Round-robin pesato: la frazione di semi anticipati di ciascun segno e'
        // Q_sign / (Q+ + Q-), cioe' 50/50 nel dipolo e sempre piu' sbilanciata
        // verso la maggioranza quanto |Q_net| cresce. A parita' di deficit si
        // privilegia il segno di Q_net, cosi' il flusso da/verso l'infinito
        // parte prima che l'altro segno occupi i cerchi.
        function pickNextWeightedFieldLineCharge(counts, next, totalEmitted, net) {
            let best = -1;
            let bestDeficit = -Infinity;
            let total = 0;
            for (let i = 0; i < counts.length; i++) total += counts[i];
            if (total <= 0) return -1;
            for (let i = 0; i < counts.length; i++) {
                if (next[i] >= counts[i]) continue;
                const deficit = counts[i] * (totalEmitted + 1) - next[i] * total;
                if (best < 0 || deficit > bestDeficit + 1e-12) {
                    best = i;
                    bestDeficit = deficit;
                    continue;
                }
                if (Math.abs(deficit - bestDeficit) > 1e-12) continue;
                const qBest = charges[best].q;
                const qCand = charges[i].q;
                if (net !== 0) {
                    const maj = net > 0 ? 1 : -1;
                    const bestMaj = Math.sign(qBest) === maj;
                    const candMaj = Math.sign(qCand) === maj;
                    if (candMaj !== bestMaj) {
                        if (candMaj) {
                            best = i;
                            bestDeficit = deficit;
                        }
                        continue;
                    }
                }
                const aqBest = Math.abs(qBest);
                const aqCand = Math.abs(qCand);
                if (aqCand !== aqBest) {
                    if (aqCand > aqBest) {
                        best = i;
                        bestDeficit = deficit;
                    }
                    continue;
                }
                if (i < best) {
                    best = i;
                    bestDeficit = deficit;
                }
            }
            return best;
        }

        function angularDistance(a, b) {
            let d = Math.abs(a - b) % (Math.PI * 2);
            if (d > Math.PI) d = Math.PI * 2 - d;
            return d;
        }

        function occupancyAngle(slot) {
            return typeof slot === 'number' ? slot : slot.angle;
        }

        function angleOccupied(slots, angle, minGap) {
            if (minGap <= 0) return false;
            for (let i = 0; i < slots.length; i++) {
                if (angularDistance(occupancyAngle(slots[i]), angle) < minGap) return true;
            }
            return false;
        }

        function segmentCircleIntersection(p0, p1, cx, cy, r) {
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const fx = p0.x - cx;
            const fy = p0.y - cy;
            const a = dx * dx + dy * dy;
            const b = 2 * (fx * dx + fy * dy);
            const c = fx * fx + fy * fy - r * r;
            const project = (p) => {
                const dist = Math.hypot(p.x - cx, p.y - cy);
                if (dist < 1e-14) return { x: cx + r, y: cy };
                const s = r / dist;
                return { x: cx + (p.x - cx) * s, y: cy + (p.y - cy) * s };
            };
            if (a < 1e-14) return project(p1);
            const disc = b * b - 4 * a * c;
            let t = null;
            if (disc >= 0) {
                const sqrtD = Math.sqrt(disc);
                const t1 = (-b - sqrtD) / (2 * a);
                const t2 = (-b + sqrtD) / (2 * a);
                const inRange = (u) => u >= -1e-6 && u <= 1 + 1e-6;
                if (inRange(t1) && inRange(t2)) t = Math.min(t1, t2);
                else if (inRange(t1)) t = t1;
                else if (inRange(t2)) t = t2;
            }
            if (t === null) return project(p1);
            t = Math.max(0, Math.min(1, t));
            return { x: p0.x + dx * t, y: p0.y + dy * t };
        }

        function segmentCircleCrossings(p0, p1, cx, cy, r) {
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const fx = p0.x - cx;
            const fy = p0.y - cy;
            const a = dx * dx + dy * dy;
            const out = [];
            if (a < 1e-14) return out;
            const b = 2 * (fx * dx + fy * dy);
            const c = fx * fx + fy * fy - r * r;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return out;
            const sqrtD = Math.sqrt(Math.max(0, disc));
            const ts = [(-b - sqrtD) / (2 * a), (-b + sqrtD) / (2 * a)];
            for (let k = 0; k < ts.length; k++) {
                const t = ts[k];
                if (t < -1e-6 || t > 1 + 1e-6) continue;
                if (k === 1 && Math.abs(ts[1] - ts[0]) < 1e-8) continue;
                const tt = Math.max(0, Math.min(1, t));
                const x = p0.x + dx * tt;
                const y = p0.y + dy * tt;
                out.push({ x, y, angle: Math.atan2(y - cy, x - cx) });
            }
            return out;
        }

        function polylineCircleCrossings(points, cx, cy, r) {
            const hits = [];
            for (let i = 1; i < points.length; i++) {
                const xs = segmentCircleCrossings(points[i - 1], points[i], cx, cy, r);
                for (let j = 0; j < xs.length; j++) hits.push(xs[j]);
            }
            return hits;
        }

        function traceFieldLine(startX, startY, sign, sourceIndex, options) {
            let x = startX;
            let y = startY;
            const points = [{ x, y }];
            const is2D = physicsSpace === '2d';
            const stepSize = 4;
            const clipToView = !options || options.clipToView !== false;
            const maxTravel = options && options.maxTravel > 0 ? options.maxTravel : 0;
            let MAX_STEPS = 2400;
            if (maxTravel > 0) {
                MAX_STEPS = Math.max(MAX_STEPS, Math.ceil(3 * maxTravel / stepSize) + 80);
                MAX_STEPS = Math.min(MAX_STEPS, 8000);
            }
            const source = sourceIndex >= 0 ? charges[sourceIndex] : null;
            let leftSource = !source;
            let hitChargeIndex = -1;

            for (let i = 0; i < MAX_STEPS; i++) {
                const field = is2D ? sampledFieldPotential2D(x, y, _sample2D) : getFieldAt(x, y);
                const mag = Math.hypot(field.x, field.y);
                if (!isFinite(mag) || mag < 1e-12) break;

                let nx = (field.x / mag) * sign;
                let ny = (field.y / mag) * sign;
                const midX = x + nx * stepSize;
                const midY = y + ny * stepSize;
                const field2 = is2D ? sampledFieldPotential2D(midX, midY, _sample2D) : getFieldAt(midX, midY);
                const mag2 = Math.hypot(field2.x, field2.y);
                if (isFinite(mag2) && mag2 >= 1e-12) {
                    nx = (field2.x / mag2) * sign;
                    ny = (field2.y / mag2) * sign;
                }
                x += nx * stepSize;
                y += ny * stepSize;
                points.push({ x, y });

                if (clipToView) {
                    const bounds = getWorldBounds();
                    const marginX = (bounds.right - bounds.left) * 0.6;
                    const marginY = (bounds.bottom - bounds.top) * 0.6;
                    if (x < bounds.left - marginX || x > bounds.right + marginX ||
                        y < bounds.top - marginY || y > bounds.bottom + marginY) break;
                }

                if (source && !leftSource) {
                    const distSrc = Math.hypot(x - source.x, y - source.y);
                    if (distSrc > CHARGE_RADIUS + 1) leftSource = true;
                }

                for (let oi = 0; oi < charges.length; oi++) {
                    if (oi === sourceIndex && !leftSource) continue;
                    const dist = Math.hypot(x - charges[oi].x, y - charges[oi].y);
                    if (dist < CHARGE_RADIUS) {
                        hitChargeIndex = oi;
                        break;
                    }
                }
                if (hitChargeIndex >= 0) break;
            }

            if (points.length < 2) return null;
            return { points, hitChargeIndex };
        }

        function joinFarFieldLineTraces(inward, outward) {
            const pts = [];
            if (inward && inward.points) {
                for (let i = inward.points.length - 1; i >= 0; i--) {
                    pts.push(inward.points[i]);
                }
            }
            if (outward && outward.points) {
                const start = pts.length > 0 ? 1 : 0;
                for (let i = start; i < outward.points.length; i++) {
                    pts.push(outward.points[i]);
                }
            }
            return pts;
        }

        function fieldLineHitsFromTrace(startX, startY, sourceIndex, trace) {
            const hits = [];
            if (!trace) return hits;
            if (sourceIndex >= 0) {
                const source = charges[sourceIndex];
                hits.push({
                    index: sourceIndex,
                    angle: Math.atan2(startY - source.y, startX - source.x)
                });
            }
            if (trace.hitChargeIndex >= 0) {
                const dest = charges[trace.hitChargeIndex];
                const pts = trace.points;
                const p = segmentCircleIntersection(
                    pts[pts.length - 2],
                    pts[pts.length - 1],
                    dest.x, dest.y, CHARGE_RADIUS
                );
                hits.push({
                    index: trace.hitChargeIndex,
                    angle: Math.atan2(p.y - dest.y, p.x - dest.x)
                });
            }
            return hits;
        }

        function fieldLineBlockedByOccupancy(hits, occupancy, minGap) {
            for (let i = 0; i < hits.length; i++) {
                const h = hits[i];
                if (angleOccupied(occupancy[h.index], h.angle, minGap[h.index])) return true;
            }
            return false;
        }

        function commitFieldLineOccupancy(hits, occupancy) {
            for (let i = 0; i < hits.length; i++) {
                const h = hits[i];
                const nSlots = fieldLineSeedCount(charges[h.index]);
                occupancy[h.index].push({
                    angle: nearestSeedSlot(h.angle, nSlots)
                });
            }
        }

        function paintFieldLine(points, fade) {
            if (!points || points.length < 2) return;
            const fadeClamped = fade == null ? 1 : fade;
            if (fadeClamped < 0.02) return;
            const a = FIELD_LINE_BASE_ALPHA * fadeClamped;
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + a + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let j = 1; j < points.length; j++) {
                ctx.lineTo(points[j].x, points[j].y);
            }
            ctx.stroke();

            if (isToggleOn(ui.showField)) return;
            const vis = longestVisibleFieldLineBranch(points, getWorldBounds());
            if (!vis) return;
            const mid = polylineArcMidpoint(vis);
            const minLen = Math.max(gridSpacing * arrowSizeFactor * 0.5, 10 / Math.max(zoom, 1e-6));
            if (!mid || mid.length < minLen) return;
            const is2D = physicsSpace === '2d';
            const field = is2D ? sampledFieldPotential2D(mid.x, mid.y, _sample2D) : getFieldAt(mid.x, mid.y);
            const magnitude = Math.sqrt(field.x * field.x + field.y * field.y);
            if (magnitude >= 0.005) {
                drawFieldLineArrowHead(mid.x, mid.y, Math.atan2(field.y, field.x), a);
            }
        }

        function emitFieldLine(points, fade) {
            paintFieldLine(points, fade);
        }

        function acceptFieldLine(hits, occupancy, minGap) {
            if (fieldLineBlockedByOccupancy(hits, occupancy, minGap)) return false;
            commitFieldLineOccupancy(hits, occupancy);
            return true;
        }

        function drawFieldLines() {
            ctx.lineWidth = 1;
            fieldLineFadeStepSize = fieldLineFadeStep();
            fieldLineFadeSeen = new Set();

            const occupancy = charges.map(() => []);
            const minGap = charges.map((c) => {
                const n = fieldLineSeedCount(c);
                return n > 0 ? FIELD_LINE_GAP_FACTOR * 2 * Math.PI / n : 0;
            });
            const totals = fieldLinePolarityTotals();
            const net = totals.net;
            const frame = fieldLineClusterFrame();
            const farCount = net === 0 ? 0 : fieldLineSeedCount({ q: net });
            const farSign = net === 0 ? 0 : -Math.sign(net);

            const farOccupancy = [];
            const farGap = farCount > 0 ? FIELD_LINE_FAR_GAP_FACTOR * 2 * Math.PI / farCount : 0;
            const farFilter = frame && farGap > 0
                ? { frame, occupancy: farOccupancy, gap: farGap }
                : null;

            if (frame && farCount > 0 && farSign !== 0) {
                for (let i = 0; i < farCount; i++) {
                    const angle = (i / farCount) * 2 * Math.PI;
                    const id = 'f' + i;
                    const startOccupied = angleOccupied(farOccupancy, angle, farGap);
                    const prevFade = fieldLineFadeAlphas.get(id) || 0;
                    if (startOccupied && prevFade < 0.02) {
                        stepFieldLineFade(id, false);
                        continue;
                    }
                    const startX = frame.cx + frame.radius * Math.cos(angle);
                    const startY = frame.cy + frame.radius * Math.sin(angle);
                    const inward = traceFieldLine(startX, startY, farSign, -1, {
                        clipToView: false,
                        maxTravel: frame.radius
                    });
                    const outward = traceFieldLine(startX, startY, -farSign, -1, {
                        clipToView: true,
                        maxTravel: frame.radius * 4
                    });
                    const hits = fieldLineHitsFromTrace(startX, startY, -1, inward)
                        .concat(fieldLineHitsFromTrace(startX, startY, -1, outward));
                    let rejected = startOccupied;
                    if (!rejected && !acceptFieldLine(hits, occupancy, minGap)) rejected = true;
                    if (!rejected) farOccupancy.push(angle);
                    const fade = stepFieldLineFade(id, !rejected);
                    if (fade > 0.02) emitFieldLine(joinFarFieldLineTraces(inward, outward), fade);
                }
            }

            const counts = charges.map((c) => fieldLineLocalSeedCount(c, totals));
            const next = counts.map(() => 0);
            let total = 0;
            for (let i = 0; i < counts.length; i++) total += counts[i];
            let emitted = 0;

            for (let k = 0; k < total; k++) {
                const ci = pickNextWeightedFieldLineCharge(counts, next, emitted, net);
                if (ci < 0) break;
                const n = counts[ci];
                const seedIndex = next[ci];
                next[ci]++;
                emitted++;
                const angle = (seedIndex / n) * 2 * Math.PI;
                const charge = charges[ci];
                const id = 'c' + charge.id + ':' + seedIndex;
                const startOccupied = angleOccupied(occupancy[ci], angle, minGap[ci]);
                const prevFade = fieldLineFadeAlphas.get(id) || 0;
                if (startOccupied && prevFade < 0.02) {
                    stepFieldLineFade(id, false);
                    continue;
                }
                const startX = charge.x + CHARGE_RADIUS * Math.cos(angle);
                const startY = charge.y + CHARGE_RADIUS * Math.sin(angle);
                drawSingleFieldLine(startX, startY, Math.sign(charge.q), ci, occupancy, minGap, {
                    farFilter,
                    clipToView: false,
                    maxTravel: frame ? 2 * Math.PI * frame.radius : 0,
                    forceRejected: startOccupied,
                    fadeId: id
                });
            }
            pruneFieldLineFade();
            fieldLineFadeSeen = null;
        }

        function drawSingleFieldLine(startX, startY, sign, sourceIndex, occupancy, minGap, options) {
            const trace = traceFieldLine(startX, startY, sign, sourceIndex, options);
            const fadeId = options && options.fadeId;
            if (!trace || trace.hitChargeIndex < 0) {
                if (fadeId) stepFieldLineFade(fadeId, false);
                return;
            }

            let rejected = !!(options && options.forceRejected);
            const farFilter = options && options.farFilter;
            if (!rejected && farFilter && farFilter.frame && farFilter.gap > 0) {
                const fr = farFilter.frame;
                const crossings = polylineCircleCrossings(trace.points, fr.cx, fr.cy, fr.radius);
                for (let i = 0; i < crossings.length; i++) {
                    if (angleOccupied(farFilter.occupancy, crossings[i].angle, farFilter.gap)) {
                        rejected = true;
                        break;
                    }
                }
                if (!rejected) {
                    for (let i = 0; i < crossings.length; i++) {
                        farFilter.occupancy.push(wrapAngle(crossings[i].angle));
                    }
                }
            }

            if (!rejected) {
                const hits = fieldLineHitsFromTrace(startX, startY, sourceIndex, trace);
                if (!acceptFieldLine(hits, occupancy, minGap)) rejected = true;
            }

            const fade = fadeId ? stepFieldLineFade(fadeId, !rejected) : (rejected ? 0 : 1);
            if (fade > 0.02) emitFieldLine(trace.points, fade);
        }

        // Livelli di phi a passo costante. Vicino alle cariche la griglia si infittisce
        // e il potenziale resta definito, cosi' le curve arrivano al disco senza buchi quadrati.
        const EQUIPO_FINE_RADIUS = 100;
        const EQUIPO_MS = [
            null,
            [[3, 0]],
            [[0, 1]],
            [[3, 1]],
            [[1, 2]],
            null,
            [[0, 2]],
            [[3, 2]],
            [[2, 3]],
            [[0, 2]],
            null,
            [[1, 2]],
            [[3, 1]],
            [[0, 1]],
            [[3, 0]],
            null
        ];
        let equipotStamp = '';
        let equipotPaths = null;
        let equipotValues = null;
        let equipotFine = null;

        function bilinearCachedPotential(x, y) {
            const step = fieldCache.step;
            const gx = (x - fieldCache.x0) / step;
            const gy = (y - fieldCache.y0) / step;
            const nx = fieldCache.nx;
            const ny = fieldCache.ny;
            if (gx < 0 || gy < 0 || gx > nx - 1 || gy > ny - 1) return NaN;
            let i = gx | 0;
            let j = gy | 0;
            if (i >= nx - 1) i = nx - 2;
            if (j >= ny - 1) j = ny - 2;
            if (i < 0 || j < 0) return NaN;
            const x0 = fieldCache.x0 + i * step;
            const y0 = fieldCache.y0 + j * step;
            if (nearAnyCharge(x0, y0, CHARGE_RADIUS) ||
                nearAnyCharge(x0 + step, y0, CHARGE_RADIUS) ||
                nearAnyCharge(x0, y0 + step, CHARGE_RADIUS) ||
                nearAnyCharge(x0 + step, y0 + step, CHARGE_RADIUS)) return NaN;
            const a = j * nx + i;
            const vv = fieldCache.v;
            const v00 = vv[a];
            const v10 = vv[a + 1];
            const v01 = vv[a + nx];
            const v11 = vv[a + nx + 1];
            const fx = gx - i;
            const fy = gy - j;
            return v00 * (1 - fx) * (1 - fy) + v10 * fx * (1 - fy) + v01 * (1 - fx) * fy + v11 * fx * fy;
        }

        function contourPotential2D(x, y) {
            let V = 0;
            for (let i = 0; i < charges.length; i++) {
                const c = charges[i];
                let R = Math.hypot(x - c.x, y - c.y);
                if (R < 1) R = 1;
                V += -K2 * c.q * Math.log(R / L0_2D);
            }
            return V;
        }

        function contourPotential(x, y) {
            // Vicino alla carica non si legge la cache: i nodi con R < 10 valgono 0 e
            // bucano la griglia. La forma chiusa resta finita fino al bordo del disco.
            const near = nearAnyCharge(x, y, CHARGE_RADIUS + 24);
            if (physicsSpace === '2d') {
                if (!near && simMode === 'dynamic' && fieldCache.active) {
                    const cached = bilinearCachedPotential(x, y);
                    if (isFinite(cached)) return cached;
                }
                return contourPotential2D(x, y);
            }
            const v = getPotentialAt(x, y);
            return isFinite(v) ? v : 0;
        }

        function equipotentialLevels(grid, nx, ny, x0, y0, cell) {
            const dV = equipotentialDeltaV();
            if (!(dV > 0)) return [];
            let vmin = Infinity;
            let vmax = -Infinity;
            const consider = (v) => {
                if (!isFinite(v)) return;
                if (v < vmin) vmin = v;
                if (v > vmax) vmax = v;
            };
            for (let j = 0; j < ny; j++) {
                const y = y0 + j * cell;
                const row = j * nx;
                for (let i = 0; i < nx; i++) {
                    if (nearAnyCharge(x0 + i * cell, y, CHARGE_RADIUS)) continue;
                    consider(grid[row + i]);
                }
            }
            for (let ci = 0; ci < charges.length; ci++) {
                const c = charges[ci];
                if (!c.q) continue;
                for (let a = 0; a < 8; a++) {
                    const ang = a * Math.PI / 4;
                    const r = CHARGE_RADIUS + 1.5;
                    consider(contourPotential(c.x + r * Math.cos(ang), c.y + r * Math.sin(ang)));
                }
            }
            if (!(vmax > vmin)) return [];
            let step = dV;
            let k0 = Math.ceil(vmin / step - 1e-8);
            let k1 = Math.floor(vmax / step + 1e-8);
            const maxLevels = 40;
            if (k1 - k0 + 1 > maxLevels) {
                step = (vmax - vmin) / maxLevels;
                k0 = Math.ceil(vmin / step - 1e-8);
                k1 = Math.floor(vmax / step + 1e-8);
            }
            const levels = [];
            for (let k = k0; k <= k1; k++) {
                const level = k * step;
                if (level < vmin || level > vmax) continue;
                levels.push(level);
            }
            return levels;
        }

        function equipotLerp(x1, y1, v1, x2, y2, v2, level) {
            const d = v2 - v1;
            let t = Math.abs(d) < 1e-14 ? 0.5 : (level - v1) / d;
            if (t < 0) t = 0;
            else if (t > 1) t = 1;
            return [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
        }

        function equipotEdgePoint(edge, x0, y0, cell, v00, v10, v11, v01, level) {
            if (edge === 0) return equipotLerp(x0, y0, v00, x0 + cell, y0, v10, level);
            if (edge === 1) return equipotLerp(x0 + cell, y0, v10, x0 + cell, y0 + cell, v11, level);
            if (edge === 2) return equipotLerp(x0, y0 + cell, v01, x0 + cell, y0 + cell, v11, level);
            return equipotLerp(x0, y0, v00, x0, y0 + cell, v01, level);
        }

        function equipotSaddlePairs(caseId, centerHigh) {
            if (caseId === 5) return centerHigh ? [[3, 2], [0, 1]] : [[3, 0], [1, 2]];
            return centerHigh ? [[3, 0], [1, 2]] : [[0, 1], [2, 3]];
        }

        function clipOutsideCircle(x1, y1, x2, y2, cx, cy, r) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const fx = x1 - cx;
            const fy = y1 - cy;
            const a = dx * dx + dy * dy;
            const r2 = r * r;
            const outside = (px, py) => {
                const ox = px - cx;
                const oy = py - cy;
                return ox * ox + oy * oy >= r2;
            };
            if (a < 1e-12) return outside(x1, y1) ? [[x1, y1, x2, y2]] : [];
            const b = 2 * (fx * dx + fy * dy);
            const c = fx * fx + fy * fy - r2;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return (outside(x1, y1) && outside(x2, y2)) ? [[x1, y1, x2, y2]] : [];
            const sd = Math.sqrt(disc);
            let tA = (-b - sd) / (2 * a);
            let tB = (-b + sd) / (2 * a);
            if (tA > tB) {
                const tmp = tA;
                tA = tB;
                tB = tmp;
            }
            const parts = [];
            const emit = (ta, tb) => {
                if (tb - ta < 1e-5) return;
                parts.push([x1 + dx * ta, y1 + dy * ta, x1 + dx * tb, y1 + dy * tb]);
            };
            if (tA > 0) emit(0, Math.min(1, tA));
            if (tB < 1) emit(Math.max(0, tB), 1);
            return parts;
        }

        function appendOutsideCharges(segs, x1, y1, x2, y2) {
            let parts = [[x1, y1, x2, y2]];
            for (let ci = 0; ci < charges.length; ci++) {
                const c = charges[ci];
                const next = [];
                for (let p = 0; p < parts.length; p++) {
                    const clipped = clipOutsideCircle(parts[p][0], parts[p][1], parts[p][2], parts[p][3], c.x, c.y, CHARGE_RADIUS);
                    for (let k = 0; k < clipped.length; k++) next.push(clipped[k]);
                }
                parts = next;
                if (!parts.length) return;
            }
            for (let p = 0; p < parts.length; p++) {
                const s = parts[p];
                const dx = s[0] - s[2];
                const dy = s[1] - s[3];
                if (dx * dx + dy * dy < 1e-8) continue;
                segs.push(s[0], s[1], s[2], s[3]);
            }
        }

        function marchEquipotentialLevel(grid, nx, ny, x0, y0, cell, level, segs, allowCell) {
            for (let j = 0; j < ny - 1; j++) {
                const row = j * nx;
                const row2 = row + nx;
                for (let i = 0; i < nx - 1; i++) {
                    const cx = x0 + (i + 0.5) * cell;
                    const cy = y0 + (j + 0.5) * cell;
                    if (allowCell && !allowCell(cx, cy)) continue;
                    const v00 = grid[row + i];
                    const v10 = grid[row + i + 1];
                    const v01 = grid[row2 + i];
                    const v11 = grid[row2 + i + 1];
                    if (!isFinite(v00) || !isFinite(v10) || !isFinite(v11) || !isFinite(v01)) continue;
                    let caseId = 0;
                    if (v00 >= level) caseId |= 1;
                    if (v10 >= level) caseId |= 2;
                    if (v11 >= level) caseId |= 4;
                    if (v01 >= level) caseId |= 8;
                    let pairs = EQUIPO_MS[caseId];
                    if (caseId === 5 || caseId === 10) {
                        pairs = equipotSaddlePairs(caseId, (v00 + v10 + v11 + v01) * 0.25 >= level);
                    }
                    if (!pairs) continue;
                    const ox = x0 + i * cell;
                    const oy = y0 + j * cell;
                    for (let p = 0; p < pairs.length; p++) {
                        const a = equipotEdgePoint(pairs[p][0], ox, oy, cell, v00, v10, v11, v01, level);
                        const b = equipotEdgePoint(pairs[p][1], ox, oy, cell, v00, v10, v11, v01, level);
                        appendOutsideCharges(segs, a[0], a[1], b[0], b[1]);
                    }
                }
            }
        }

        function nearestChargeIndex(x, y) {
            let best = -1;
            let bestD = Infinity;
            for (let i = 0; i < charges.length; i++) {
                const d = Math.hypot(x - charges[i].x, y - charges[i].y);
                if (d < bestD) {
                    bestD = d;
                    best = i;
                }
            }
            return best;
        }

        function marchFineEquipotentials(chargeIndex, levels, segs, fineExtent, fineCell) {
            const c = charges[chargeIndex];
            const x0 = c.x - fineExtent;
            const y0 = c.y - fineExtent;
            const n = Math.ceil((2 * fineExtent) / fineCell) + 1;
            const count = n * n;
            if (!equipotFine || equipotFine.length < count) equipotFine = new Float64Array(count);
            const grid = equipotFine;
            for (let j = 0; j < n; j++) {
                const y = y0 + j * fineCell;
                const row = j * n;
                for (let i = 0; i < n; i++) grid[row + i] = contourPotential(x0 + i * fineCell, y);
            }
            const allow = (cx, cy) => {
                if (Math.hypot(cx - c.x, cy - c.y) > fineExtent) return false;
                return nearestChargeIndex(cx, cy) === chargeIndex;
            };
            for (let li = 0; li < levels.length; li++) {
                marchEquipotentialLevel(grid, n, n, x0, y0, fineCell, levels[li], segs, allow);
            }
        }

        function chainContourSegments(segs) {
            const n = segs.length >> 2;
            if (!n) return [];
            const adj = new Map();
            const keyOf = (x, y) => x + ',' + y;
            const link = (k, seg, end) => {
                let list = adj.get(k);
                if (!list) {
                    list = [];
                    adj.set(k, list);
                }
                list.push((seg << 1) | end);
            };
            for (let i = 0; i < n; i++) {
                link(keyOf(segs[i * 4], segs[i * 4 + 1]), i, 0);
                link(keyOf(segs[i * 4 + 2], segs[i * 4 + 3]), i, 1);
            }
            const used = new Uint8Array(n);
            const paths = [];
            const xy = (seg, end) => {
                const o = (seg << 2) + (end << 1);
                return [segs[o], segs[o + 1]];
            };
            const extend = (seg, fromEnd) => {
                const pts = [];
                let s = seg;
                let end = fromEnd;
                for (let guard = 0; guard <= n; guard++) {
                    const p = xy(s, end);
                    pts.push(p[0], p[1]);
                    const list = adj.get(keyOf(p[0], p[1]));
                    let nxt = -1;
                    if (list) {
                        for (let t = 0; t < list.length; t++) {
                            if (used[list[t] >> 1]) continue;
                            nxt = list[t];
                            break;
                        }
                    }
                    if (nxt < 0) break;
                    s = nxt >> 1;
                    used[s] = 1;
                    end = 1 - (nxt & 1);
                }
                return pts;
            };
            for (let i = 0; i < n; i++) {
                if (used[i]) continue;
                used[i] = 1;
                const back = extend(i, 0);
                const fwd = extend(i, 1);
                const path = [];
                for (let t = back.length - 2; t >= 0; t -= 2) path.push(back[t], back[t + 1]);
                for (let t = 0; t < fwd.length; t++) path.push(fwd[t]);
                if (path.length >= 4) paths.push(path);
            }
            return paths;
        }

        function equipotentialStamp() {
            let s = physicsSpace + '|' + simMode + '|' + fieldLineGridSpacing + '|' +
                zoom + '|' + panX + '|' + panY + '|' + width + '|' + height;
            for (let i = 0; i < charges.length; i++) {
                const c = charges[i];
                s += '|' + c.q + ',' + c.x + ',' + c.y;
            }
            return s;
        }

        function buildEquipotentialPaths() {
            const bounds = getWorldBounds();
            const vw = Math.max(1, bounds.right - bounds.left);
            const vh = Math.max(1, bounds.bottom - bounds.top);
            let cell = Math.max(2, 12 / Math.max(zoom, 0.05));
            let nx = Math.ceil(vw / cell) + 1;
            let ny = Math.ceil(vh / cell) + 1;
            const cap = physicsSpace === '2d' ? 14000 : 4500;
            while (nx * ny > cap) {
                cell *= 1.35;
                nx = Math.ceil(vw / cell) + 1;
                ny = Math.ceil(vh / cell) + 1;
            }
            const count = nx * ny;
            if (!equipotValues || equipotValues.length < count) equipotValues = new Float64Array(count);
            const grid = equipotValues;
            const x0 = bounds.left;
            const y0 = bounds.top;
            for (let j = 0; j < ny; j++) {
                const y = y0 + j * cell;
                const row = j * nx;
                for (let i = 0; i < nx; i++) grid[row + i] = contourPotential(x0 + i * cell, y);
            }
            const levels = equipotentialLevels(grid, nx, ny, x0, y0, cell);
            syncLineDensityReadout();
            if (!levels.length) return [];
            const segs = [];
            const fineR = EQUIPO_FINE_RADIUS;
            const coarseAllow = (cx, cy) => !nearAnyCharge(cx, cy, fineR);
            for (let li = 0; li < levels.length; li++) {
                marchEquipotentialLevel(grid, nx, ny, x0, y0, cell, levels[li], segs, coarseAllow);
            }
            const fineExtent = fineR + cell * 0.5;
            const fineCell = 4;
            for (let ci = 0; ci < charges.length; ci++) {
                if (!charges[ci].q) continue;
                marchFineEquipotentials(ci, levels, segs, fineExtent, fineCell);
            }
            return chainContourSegments(segs);
        }

        function drawEquipotentials() {
            if (!charges.length) return;
            let paths;
            if (simMode === 'dynamic') {
                paths = buildEquipotentialPaths();
            } else {
                const stamp = equipotentialStamp();
                if (stamp !== equipotStamp || !equipotPaths) {
                    equipotPaths = buildEquipotentialPaths();
                    equipotStamp = stamp;
                }
                paths = equipotPaths;
            }
            if (!paths || !paths.length) return;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + FIELD_LINE_BASE_ALPHA + ')';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let p = 0; p < paths.length; p++) {
                const path = paths[p];
                ctx.moveTo(path[0], path[1]);
                for (let i = 2; i < path.length; i += 2) ctx.lineTo(path[i], path[i + 1]);
            }
            ctx.stroke();
            ctx.restore();
        }

        // Traccianti del campo disegnato: la velocità ha la direzione di E e un modulo
        // compresso, perché le frecce hanno lunghezza fissa mentre |E| copre molti ordini.
        // In Maxwell 2D si legge solo la cache (niente integrale per particella): dentro
        // il disco della carica il campione non è affidabile e il tracciante muore.
        // Ogni tratto è un segmento fisso. L'opacità sale e scende con uno smoothstep:
        // il tratto vivo segue la vita della particella, il segmento depositato
        // continua a spegnersi anche dopo. Il canvas è pulito ogni frame.
        const FLOW_TRAIL_SPACING = 5;
        const FLOW_FADE_IN = 0.35;
        const FLOW_FADE_OUT = 0.4;
        const FLOW_STAMP_FADE = 0.5;
        const FLOW_STAMP_MAX = 20480;
        const FLOW_SPEED_MAX = 160;
        const FLOW_E0 = 2.5;
        const FLOW_LIFE_MIN = 0.3;
        const FLOW_LIFE_MAX = 0.5;
        const FLOW_MAX_PARTICLES = 1280;
        const FLOW_SPAWN_PER_FRAME = 80;
        const FLOW_KILL_MARGIN = 0;
        const FLOW_DT_MAX = 0.05;
        const FLOW_LINE_WIDTH = 2.2;
        let flowSpacing = 34;
        let flowClock = 0;
        const flowParticles = [];
        const flowStampX0 = new Float32Array(FLOW_STAMP_MAX);
        const flowStampY0 = new Float32Array(FLOW_STAMP_MAX);
        const flowStampX = new Float32Array(FLOW_STAMP_MAX);
        const flowStampY = new Float32Array(FLOW_STAMP_MAX);
        const flowStampAge = new Float32Array(FLOW_STAMP_MAX);
        const flowStampGain = new Float32Array(FLOW_STAMP_MAX);
        let flowStampHead = 0;
        let flowStampCount = 0;
        const _flowE = { x: 0, y: 0 };
        const _flowPart = { x: 0, y: 0 };

        function flowClear() {
            for (let i = 0; i < flowParticles.length; i++) flowParticles[i].alive = false;
            flowStampHead = 0;
            flowStampCount = 0;
            flowClock = 0;
        }

        function flowSmooth(u) {
            if (u <= 0) return 0;
            if (u >= 1) return 1;
            return u * u * (3 - 2 * u);
        }

        function flowLifeAlpha(age, life) {
            if (!(life > 0)) return 0;
            const t = age / life;
            let edge = 1;
            if (t < FLOW_FADE_IN) edge = t / FLOW_FADE_IN;
            if (t > 1 - FLOW_FADE_OUT) edge = Math.min(edge, (1 - t) / FLOW_FADE_OUT);
            return flowSmooth(edge);
        }

        function flowFadeOutAlpha(age) {
            return flowSmooth(1 - age / FLOW_STAMP_FADE);
        }

        function flowPushStamp(x0, y0, x1, y1, gain) {
            flowStampX0[flowStampHead] = x0;
            flowStampY0[flowStampHead] = y0;
            flowStampX[flowStampHead] = x1;
            flowStampY[flowStampHead] = y1;
            flowStampAge[flowStampHead] = 0;
            flowStampGain[flowStampHead] = gain;
            flowStampHead = (flowStampHead + 1) % FLOW_STAMP_MAX;
            if (flowStampCount < FLOW_STAMP_MAX) flowStampCount++;
        }

        function flowAgeStamps(dt) {
            if (!flowStampCount || !(dt > 0)) return;
            const start = (flowStampHead - flowStampCount + FLOW_STAMP_MAX) % FLOW_STAMP_MAX;
            for (let k = 0; k < flowStampCount; k++) {
                flowStampAge[(start + k) % FLOW_STAMP_MAX] += dt;
            }
            while (flowStampCount > 0) {
                const oldest = (flowStampHead - flowStampCount + FLOW_STAMP_MAX) % FLOW_STAMP_MAX;
                if (flowStampAge[oldest] < FLOW_STAMP_FADE) break;
                flowStampCount--;
            }
        }

        function flowDropStamp(p) {
            const dx = p.x - p.markX;
            const dy = p.y - p.markY;
            if (dx * dx + dy * dy < FLOW_TRAIL_SPACING * FLOW_TRAIL_SPACING) return;
            flowPushStamp(p.markX, p.markY, p.x, p.y, flowLifeAlpha(p.age, p.life));
            p.markX = p.x;
            p.markY = p.y;
        }

        function flowRetire(p) {
            if (!p.alive) return;
            const dx = p.x - p.markX;
            const dy = p.y - p.markY;
            if (dx * dx + dy * dy > 1) flowPushStamp(p.markX, p.markY, p.x, p.y, flowLifeAlpha(p.age, p.life));
            p.alive = false;
        }

        function flowTargetCount() {
            if (!charges.length) return 0;
            const b = getWorldBounds();
            const area = Math.max(0, b.right - b.left) * Math.max(0, b.bottom - b.top);
            return Math.max(0, Math.min(FLOW_MAX_PARTICLES, Math.round(area / (flowSpacing * flowSpacing))));
        }

        function flowInsideCharge(x, y) {
            const r = CHARGE_RADIUS + FLOW_KILL_MARGIN;
            const r2 = r * r;
            for (let i = 0; i < charges.length; i++) {
                const dx = x - charges[i].x;
                const dy = y - charges[i].y;
                if (dx * dx + dy * dy < r2) return true;
            }
            return false;
        }

        function flowSample2D(x, y, out) {
            if (!fieldCache.active) return false;
            const gx = (x - fieldCache.x0) / fieldCache.step;
            const gy = (y - fieldCache.y0) / fieldCache.step;
            if (gx < 0 || gy < 0 || gx > fieldCache.nx - 1.001 || gy > fieldCache.ny - 1.001) return false;
            const i = gx | 0, j = gy | 0;
            const fx = gx - i, fy = gy - j;
            const nx = fieldCache.nx;
            const a = j * nx + i, b = a + 1, cc = a + nx, d = cc + 1;
            const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy);
            const w01 = (1 - fx) * fy, w11 = fx * fy;
            const ex = fieldCache.ex, ey = fieldCache.ey;
            out.x = ex[a] * w00 + ex[b] * w10 + ex[cc] * w01 + ex[d] * w11;
            out.y = ey[a] * w00 + ey[b] * w10 + ey[cc] * w01 + ey[d] * w11;
            return isFinite(out.x) && isFinite(out.y);
        }

        function flowSample(x, y, out) {
            if (flowInsideCharge(x, y)) return false;
            if (physicsSpace === '2d') return flowSample2D(x, y, out);
            out.x = 0;
            out.y = 0;
            for (let i = 0; i < charges.length; i++) {
                getFieldContribution3D(charges[i], x, y, _flowPart);
                out.x += _flowPart.x;
                out.y += _flowPart.y;
            }
            return isFinite(out.x) && isFinite(out.y);
        }

        function flowSpawnOne(bounds) {
            let p = null;
            for (let i = 0; i < flowParticles.length; i++) {
                if (!flowParticles[i].alive) { p = flowParticles[i]; break; }
            }
            if (!p) {
                if (flowParticles.length >= FLOW_MAX_PARTICLES) return false;
                p = { alive: false, x: 0, y: 0, age: 0, life: 2, markX: 0, markY: 0 };
                flowParticles.push(p);
            }
            const spanX = bounds.right - bounds.left;
            const spanY = bounds.bottom - bounds.top;
            if (!(spanX > 0) || !(spanY > 0)) return false;
            for (let attempt = 0; attempt < 8; attempt++) {
                const x = bounds.left + Math.random() * spanX;
                const y = bounds.top + Math.random() * spanY;
                if (!flowSample(x, y, _flowE)) continue;
                if (!(Math.hypot(_flowE.x, _flowE.y) > 0.04)) continue;
                p.alive = true;
                p.x = x;
                p.y = y;
                p.age = 0;
                p.life = FLOW_LIFE_MIN + Math.random() * (FLOW_LIFE_MAX - FLOW_LIFE_MIN);
                p.markX = x;
                p.markY = y;
                return true;
            }
            return false;
        }

        function flowOffscreen(x, y, bounds) {
            const m = 48;
            return x < bounds.left - m || x > bounds.right + m || y < bounds.top - m || y > bounds.bottom + m;
        }

        function flowFrameDt() {
            const now = performance.now();
            if (!flowClock) {
                flowClock = now;
                return 1 / 60;
            }
            let dt = (now - flowClock) / 1000;
            flowClock = now;
            if (!(dt > 0)) return 0;
            return dt > FLOW_DT_MAX ? FLOW_DT_MAX : dt;
        }

        function updateFlow(dt) {
            flowAgeStamps(dt);
            const bounds = getWorldBounds();
            const target = flowTargetCount();
            let alive = 0;
            for (let i = 0; i < flowParticles.length; i++) {
                const p = flowParticles[i];
                if (!p.alive) continue;
                p.age += dt;
                if (p.age >= p.life || !flowSample(p.x, p.y, _flowE)) {
                    flowRetire(p);
                    continue;
                }
                const mag = Math.hypot(_flowE.x, _flowE.y);
                if (mag > 1e-8) {
                    const scale = (FLOW_SPEED_MAX / (mag + FLOW_E0)) * dt;
                    p.x += _flowE.x * scale;
                    p.y += _flowE.y * scale;
                }
                if (flowOffscreen(p.x, p.y, bounds) || flowInsideCharge(p.x, p.y)) {
                    flowRetire(p);
                    continue;
                }
                flowDropStamp(p);
                alive++;
            }
            let extra = alive - target;
            const kill = extra > 48 ? 48 : extra;
            for (let k = 0; k < kill; k++) {
                let oldest = null;
                let oldestAge = -1;
                for (let i = 0; i < flowParticles.length; i++) {
                    const p = flowParticles[i];
                    if (p.alive && p.age > oldestAge) {
                        oldest = p;
                        oldestAge = p.age;
                    }
                }
                if (!oldest) break;
                flowRetire(oldest);
                alive--;
            }
            let budget = FLOW_SPAWN_PER_FRAME;
            if (target - alive < budget) budget = target - alive;
            while (budget > 0) {
                if (!flowSpawnOne(bounds)) break;
                budget--;
            }
        }

        function drawFlow() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = FLOW_LINE_WIDTH;
            if (flowStampCount > 0) {
                const start = (flowStampHead - flowStampCount + FLOW_STAMP_MAX) % FLOW_STAMP_MAX;
                for (let k = 0; k < flowStampCount; k++) {
                    const idx = (start + k) % FLOW_STAMP_MAX;
                    const alpha = flowStampGain[idx] * flowFadeOutAlpha(flowStampAge[idx]);
                    if (alpha < 0.03) continue;
                    ctx.beginPath();
                    ctx.moveTo(flowStampX0[idx], flowStampY0[idx]);
                    ctx.lineTo(flowStampX[idx], flowStampY[idx]);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
                    ctx.stroke();
                }
            }
            for (let i = 0; i < flowParticles.length; i++) {
                const p = flowParticles[i];
                if (!p.alive) continue;
                const dx = p.x - p.markX;
                const dy = p.y - p.markY;
                const alpha = flowLifeAlpha(p.age, p.life);
                if (alpha < 0.03) continue;
                if (dx * dx + dy * dy > 0.25) {
                    ctx.beginPath();
                    ctx.moveTo(p.markX, p.markY);
                    ctx.lineTo(p.x, p.y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
                    ctx.stroke();
                }
            }
        }

        function drawField() {
            const bounds = getWorldBounds();
            const spacing = getLodSpacing(gridSpacing);
            const startX = Math.floor(bounds.left / spacing) * spacing;
            const startY = Math.floor(bounds.top / spacing) * spacing;
            for (let x = startX; x < bounds.right; x += spacing) {
                for (let y = startY; y < bounds.bottom; y += spacing) {
                    if (charges.length > 0) {
                        const field = getFieldAt(x, y);
                        const angle = Math.atan2(field.y, field.x);
                        const magnitude = Math.sqrt(field.x*field.x + field.y*field.y);
                        drawArrow(x, y, angle, magnitude);
                    }
                }
            }
        }

        function drawCharge(c) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, CHARGE_RADIUS, 0, Math.PI * 2);

            ctx.fillStyle = getChargeColor(c, 1);
            ctx.strokeStyle = getChargeStrokeColor(c);

            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            const signSize = CHARGE_RADIUS * 0.8;
            const barWidth = signSize * 0.2;
            ctx.fillStyle = 'white';

            ctx.fillRect(c.x - signSize / 2, c.y - barWidth / 2, signSize, barWidth);

            if (c.q > 0) {
                ctx.fillRect(c.x - barWidth / 2, c.y - signSize / 2, barWidth, signSize);
            }

            if (c === selectedCharge) {
                drawSelectionMarkers(c.x, c.y, CHARGE_RADIUS, c);
            }
        }

        function drawCharges() {
            for (let c of charges) {
                drawCharge(c);
            }
        }

        function sensorScaleFromSlider(t) {
            const minLog = Math.log(SENSOR_SCALE_MIN);
            const maxLog = Math.log(SENSOR_SCALE_MAX);
            return Math.exp(minLog + (maxLog - minLog) * (t / 100));
        }

        function sensorSliderFromScale(scale) {
            const clamped = Math.min(SENSOR_SCALE_MAX, Math.max(SENSOR_SCALE_MIN, scale));
            const minLog = Math.log(SENSOR_SCALE_MIN);
            const maxLog = Math.log(SENSOR_SCALE_MAX);
            return 100 * (Math.log(clamped) - minLog) / (maxLog - minLog);
        }

        function formatSensorScaleValue(value) {
            if (value >= 100) return Math.round(value) + 'px';
            return (Math.round(value * 10) / 10) + 'px';
        }

        function getSensorFieldScale(s) {
            return (s.scale !== undefined) ? s.scale : DEFAULT_SENSOR_SCALE;
        }

        function getSensorNormLength(s) {
            return (s.normLength !== undefined) ? s.normLength : DEFAULT_SENSOR_NORM_LENGTH;
        }

        function getSensorDrawScale(s, field) {
            if (!s.normalize) return getSensorFieldScale(s);
            const mag = Math.hypot(field.x, field.y);
            if (!(mag > 0) || !isFinite(mag)) return 0;
            return getSensorNormLength(s) / mag;
        }

        function drawFieldVector(originX, originY, field, color, lineWidth, scale) {
            const targetX = originX + field.x * scale;
            const targetY = originY + field.y * scale;
            const magnitude = Math.sqrt(field.x * field.x + field.y * field.y);
            const len = magnitude * scale;
            if (!isFinite(len) || len < 4) return { x: originX, y: originY };

            const angle = Math.atan2(field.y, field.x);

            const headLen = Math.min(25, Math.max(8, len * 0.35));
            const headWidth = headLen * 0.48;
            const indent = headLen * 0.32;
            const shaftLen = len - (headLen - indent);
            const shaftEndX = originX + Math.cos(angle) * Math.max(shaftLen, 0);
            const shaftEndY = originY + Math.sin(angle) * Math.max(shaftLen, 0);

            ctx.save();
            if (shaftLen > 0) {
                ctx.beginPath();
                ctx.moveTo(originX, originY);
                ctx.lineTo(shaftEndX, shaftEndY);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'butt';
                ctx.stroke();
            }
            ctx.translate(targetX, targetY);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-headLen, -headWidth);
            ctx.lineTo(-(headLen - indent), 0);
            ctx.lineTo(-headLen, headWidth);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
            return { x: targetX, y: targetY };
        }

        function drawSensorVector(s, field, color, lineWidth, scale) {
            drawFieldVector(s.x, s.y, field, color, lineWidth, scale);
        }

        function drawSensorAnalysis(s, scale) {
            for (let c of charges) {
                const colorVec = getFieldVectorColor(c, 1);
                const dx = s.x - c.x;
                const dy = s.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > CHARGE_RADIUS + SENSOR_RADIUS) {
                    const startX = c.x + (dx / dist) * CHARGE_RADIUS;
                    const startY = c.y + (dy / dist) * CHARGE_RADIUS;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(s.x, s.y);
                    ctx.strokeStyle = colorVec;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([6, 4]);
                    ctx.stroke();
                    ctx.restore();
                }

                const contrib = getFieldContributionFromCharge(c, s.x, s.y);
                drawSensorVector(s, contrib, colorVec, 3, scale);
            }
        }

        function drawSensorHeadToTail(s, scale) {
            let ox = s.x;
            let oy = s.y;
            for (let c of charges) {
                const contrib = getFieldContributionFromCharge(c, s.x, s.y);
                const colorVec = getFieldVectorColor(c, 0.66);
                const tip = drawFieldVector(ox, oy, contrib, colorVec, 3, scale);
                ox = tip.x;
                oy = tip.y;
            }
        }

        function drawSensor(s) {
            const field = getFieldAt(s.x, s.y);
            const scale = getSensorDrawScale(s, field);

            if (s.vectorAnalysis) {
                drawSensorAnalysis(s, scale);
            }
            if (s.headToTail) {
                drawSensorHeadToTail(s, scale);
            }

            ctx.beginPath();
            ctx.arc(s.x, s.y, SENSOR_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = getSensorColor(s, 1);
            ctx.strokeStyle = getSensorStrokeColor(s);
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            drawSensorVector(s, field, getSensorVectorColor(s), 4, scale);

            if (s === selectedSensor) {
                drawSelectionMarkers(s.x, s.y, SENSOR_RADIUS, s);
            }
        }

        function drawSensors() {
            for (let s of sensors) {
                drawSensor(s);
            }
        }

        function render() {
            frameCount++;

            if (simMode === 'dynamic') {
                const maxSpeed = 0.9 * cSpeed;
                for (let c of charges) {
                    // Inizializzazione se mancano proprietà
                    if (c.vx === undefined) {
                        c.vx = 0; c.vy = 0;
                        c.targetX = c.x; c.targetY = c.y;
                        c.ax = 0; c.ay = 0;
                    }

                    // 1. GESTIONE OSCILLAZIONE (Calcolo Analitico)
                    if (c.oscillation) {
                        if (!c.oscillation.paused) {
                            const osc = c.oscillation;
                            const A = osc.amplitude;

                            // Calcolo frequenza angolare (omega)
                            const omegaMax = (cSpeed > 0 ? cSpeed : 0.1) / (A > 0 ? A : 1);
                            const sliderFactor = (osc.sliderVal || 0) / 100;
                            const omega = sliderFactor * omegaMax;

                            if (osc.phase === undefined) osc.phase = 0;
                            osc.phase += omega;

                            // Calcolo posizione relativa al centro
                            let dx = 0, dy = 0;
                            if (osc.type === 'horizontal') dx = A * Math.sin(osc.phase);
                            else if (osc.type === 'vertical') dy = A * Math.sin(osc.phase);
                            else if (osc.type === 'circular') {
                                dx = A * Math.cos(osc.phase);
                                dy = A * Math.sin(osc.phase);
                            }

                            const nextX = osc.centerX + dx;
                            const nextY = osc.centerY + dy;

                            // Velocità istantanea (derivata prima)
                            c.vx = nextX - c.x;
                            c.vy = nextY - c.y;

                            // Accelerazione istantanea ANALITICA: a = -omega^2 * spostamento
                            c.ax = -omega * omega * dx;
                            c.ay = -omega * omega * dy;

                            c.x = nextX;
                            c.y = nextY;
                        } else {
                            // Paused: Freeze in place
                            c.vx = 0;
                            c.vy = 0;
                            c.ax = 0;
                            c.ay = 0;
                        }
                    }
                    // 2. GESTIONE FISICA MOLLA/TRASCINAMENTO (Calcolo Dinamico con Velocity Verlet)
                    else {
                        // Assicuriamoci che ax, ay non siano NaN o undefined prima di iniziare
                        const ax = c.ax || 0;
                        const ay = c.ay || 0;
                        const vx = c.vx || 0;
                        const vy = c.vy || 0;

                        // Velocity Verlet Step 1: v(t + dt/2) = v(t) + 0.5 * a(t) * dt
                        const vHalfX = vx + 0.5 * ax;
                        const vHalfY = vy + 0.5 * ay;

                        // Velocity Verlet Step 2: x(t + dt) = x(t) + v(t + dt/2) * dt
                        c.x += vHalfX;
                        c.y += vHalfY;

                        // Calcolo nuova forza basata sulla nuova posizione
                        let nextForceX = 0;
                        let nextForceY = 0;

                        if (dragTarget === c) {
                            // Protezione targetX/Y
                            const tx = c.targetX !== undefined ? c.targetX : c.x;
                            const ty = c.targetY !== undefined ? c.targetY : c.y;
                            const dx = tx - c.x;
                            const dy = ty - c.y;
                            nextForceX += K_SPRING * dx;
                            nextForceY += K_SPRING * dy;
                        }

                        // Attrito basato sulla velocità a metà passo per stabilità (Damping)
                        nextForceX -= FRICTION * vHalfX;
                        nextForceY -= FRICTION * vHalfY;

                        // Nuova accelerazione a(t + dt)
                        const nextAx = nextForceX;
                        const nextAy = nextForceY;

                        // Velocity Verlet Step 3: v(t + dt) = v(t + dt/2) + 0.5 * a(t + dt) * dt
                        c.vx = vHalfX + 0.5 * nextAx;
                        c.vy = vHalfY + 0.5 * nextAy;
                        
                        // Aggiorniamo a(t) per il prossimo frame
                        c.ax = nextAx;
                        c.ay = nextAy;

                        // Limite velocità (Relatività speciale "manuale")
                        const speed = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
                        if (speed > maxSpeed && maxSpeed > 0) {
                            const ratio = maxSpeed / speed;
                            c.vx *= ratio;
                            c.vy *= ratio;
                        }
                        
                        // Protezione finale contro valori non validi (NaN/Infinity)
                        if (isNaN(c.x) || isNaN(c.y)) {
                            c.x = (width / 2 - panX) / zoom;
                            c.y = (height / 2 - panY) / zoom;
                            c.vx = 0; c.vy = 0; c.ax = 0; c.ay = 0;
                        }
                    }
                }
            }

            if (simMode === 'dynamic') {
