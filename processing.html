<script type="text/processing" data-processing-target="mycanvas">

float dt, vx, vy, ax, ay,x,y;
int[] colors = new int[3];
int op,s;

void setup(){
  size(400, 400);
  frameRate(50);
  x=200;
  y=200;
  dt=0.1;
  vx=0;
  vy=0;
  ax=0;
  ay=0;
  op=10;
  s=10;
colors[0] = round(random(0,255)); 
colors[1] = round(random(0,255)); 
colors[2] = round(random(0,255)); 
  background(255);
}

void draw(){
  fill(colors[0],colors[1],colors[2],op);
  stroke(colors[0],colors[1],colors[2],0);
  ellipse(round(x),round(y),s,s);
  
  for(int i=0;i<3;i=i+1){
    colors[i]+=round(random(-3,3));
    colors[i]=max(colors[i],0);
    colors[i]=min(colors[i],255);
  }
  
  //op=round(200/sqrt(sq(vx)+sq(vy)));
  
  s=round(50*sqrt(1/sqrt(sq(vx)+sq(vy))));
  
  x+=(vx*dt);
  y+=(vy*dt);
  
  vx+=ax*dt;
  vy+=ay*dt;
  
  vx*=0.9;
  vy*=0.9;
  
  ax=100*random(-1,1)+50*pow(200-x,5)/(1*pow(200,5));
  ay=100*random(-1,1)+50*pow(200-y,5)/(1*pow(200,5));

  
}


void mousePressed() {
       x=mouseX;
       y=mouseY;
       vx=0;
       vy=0;
     }

</script>
<canvas id="mycanvas"></canvas>
