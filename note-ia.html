<script>
function toggleAuthorInfo() {
  var footer = document.getElementById("author-footer");
  if (footer.getAttribute("data-expanded") === "true") {
    footer.textContent = "Contatta l'autore";
    footer.setAttribute("data-expanded", "false");
  } else {
    var revEmail = "moc.liamg@ecsidocram";
    var email = revEmail.split("").reverse().join("");
    footer.innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
    footer.setAttribute("data-expanded", "true");
  }
}
</script>
</footer>

<script>
(function () {
  var nav = document.getElementById("nota-indice");
  var small = window.matchMedia("(max-width: 767px)");
  function place() {
    if (small.matches) {
      nav.style.position = "";
      nav.style.top = "";
      nav.style.maxHeight = "";
      return;
    }
    var scrollTop = window.scrollY;
    var footer = document.querySelector("footer");
    var container = nav.parentElement;
    var containerTop = container.getBoundingClientRect().top + scrollTop;
    var footerTop = footer.getBoundingClientRect().top + scrollTop;
    var marginTop = parseFloat(getComputedStyle(nav).marginTop) || 0;
    var maxScroll = footerTop - containerTop - nav.offsetHeight - marginTop - 120;
    if (maxScroll < 160) maxScroll = 160;

    if (scrollTop < 160) {
      nav.style.position = "absolute";
      nav.style.top = "160px";
      nav.style.maxHeight = "calc(100vh - 220px)";
    } else if (scrollTop < maxScroll) {
      nav.style.position = "fixed";
      nav.style.top = "0";
      nav.style.maxHeight = "calc(100vh - 60px)";
    } else {
      nav.style.position = "absolute";
      nav.style.top = maxScroll + "px";
      nav.style.maxHeight = "calc(100vh - 60px)";
    }
  }
  window.addEventListener("scroll", place);
  window.addEventListener("resize", place);
  if (small.addEventListener) small.addEventListener("change", place);
  place();
})();
</script>
